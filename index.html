(function(){

  // ===== Утилиты =====
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const chance = p => Math.random() < p;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // Уровень «умности» по сложности
  function aiLevel(){
    if(aiDifficulty === 'easy') return { smart: 0.35, abilities: 0, dribble: 0, pass: 0 };
    if(aiDifficulty === 'hard') return { smart: 1, abilities: 1, dribble: 1, pass: 1 };
    return { smart: 0.75, abilities: 0.5, dribble: 0.6, pass: 0.7 };
  }

  // ===== Оценка ситуации =====
  function nearestDefender(f){
    let best = null, bd = 99;
    fig.forEach(g => {
      if(g.t === f.t || g.c < 0) return;
      const d = dist(f.c, f.r, g.c, g.r);
      if(d < bd){ bd = d; best = g; }
    });
    return best ? { def: best, dist: bd } : null;
  }

  function nearestAlly(f){
    let best = null, bd = 99;
    fig.forEach(g => {
      if(g.t !== f.t || g.i === f.i || g.c < 0) return;
      const d = dist(f.c, f.r, g.c, g.r);
      if(d < bd){ bd = d; best = g; }
    });
    return best;
  }

  function openAllies(f){
    return fig.filter(g => {
      if(g.t !== f.t || g.i === f.i || g.c < 0) return false;
      if(dist(f.c, f.r, g.c, g.r) > 3) return false;
      const nd = (function(){ let d = 99; fig.forEach(x => { if(x.t !== f.t && x.c >= 0) d = Math.min(d, dist(x.c, x.r, g.c, g.r)); }); return d; })();
      return nd >= 2;
    });
  }

  function lanesOpen(f, target){
    // Проверка на перехват: враги рядом с линией паса
    let danger = 0;
    fig.forEach(g => {
      if(g.t === f.t || g.c < 0) return;
      const dFrom = dist(g.c, g.r, f.c, f.r);
      const dTo = dist(g.c, g.r, target.c, target.r);
      if(Math.min(dFrom, dTo) <= 1) danger++;
    });
    return danger === 0;
  }

  // ===== Проверка: можно ли отобрать =====
  function canSteal(f){
    const bh = byId(ball);
    if(!bh || bh.t === f.t || f.o < 1) return false;
    return dist(f.c, f.r, bh.c, bh.r) <= 1;
  }

  // ===== Оценка вариантов атаки =====
  function pickShot(f){
    const hoop = hoops[0];
    const d = dist(f.c, f.r, hoop.c, hoop.r);
    const opts = [];
    const nd = nearestDefender(f);
    const pressure = nd && nd.dist <= 1;

    // Лэй-ап / Данк
    if(d <= 1 && f.o >= 2){
      if(f.s >= 3 && !pressure) opts.push({ act: 'dunk', score: 100 });
      else opts.push({ act: 'dunk', score: 85 });
      opts.push({ act: 'shoot', score: 80 });
    }
    // Флоатер
    if(d >= 1 && d <= 2 && f.o >= 2){
      opts.push({ act: 'floater', score: pressure ? 90 : 60 });
    }
    // Мид
    if(d >= 2 && d <= 3 && f.o >= 2){
      opts.push({ act: 'shoot', score: pressure ? 55 : 70 });
    }
    // Трёха
    if(d >= 4 && d <= 5 && f.o >= 2){
      opts.push({ act: 'shoot', score: (f.b >= 5 ? 65 : 45) });
    }
    // Дальний трёх
    if(d >= 6 && f.o >= 3 && f.b >= 5){
      opts.push({ act: 'deepthree', score: 50 });
    }
    return opts;
  }
  
  // ===== ИИ: одно действие с мячом =====
  async function aiWithBall(f){
    const lv = aiLevel();
    const hoop = hoops[0];
    const d = dist(f.c, f.r, hoop.c, hoop.r);
    const nd = nearestDefender(f);
    const pressure = nd && nd.dist <= 1;

    // 1. Дриблинг против защитника (средний/сложный)
    if(pressure && lv.dribble && chance(lv.smart) && f.d >= 3 && f.o >= 1){
      const dirs = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
      const myAx = toAx(f.c, f.r);
      const defAx = toAx(nd.def.c, nd.def.r);
      const dq = defAx.q - myAx.q, dr = defAx.r - myAx.r;

      // Пытаемся выбрать направление за защитника
      for(const dir of dirs){
        const midQ = myAx.q + dir[0], midR = myAx.r + dir[1];
        const midOff = toOff(midQ, midR);
        const midFig = figAt(midOff.c, midOff.r);
        if(midFig && midFig.i === nd.def.i){
          const tQ = myAx.q + dir[0] * 2, tR = myAx.r + dir[1] * 2;
          const tOff = toOff(tQ, tR);
          if(tOff.c >= 0 && tOff.c < C && tOff.r >= 0 && tOff.r < R && !figAt(tOff.c, tOff.r)){
            // Ставим режим дриблинга
            const dr2 = DRIBBLES2.find(x => x.m === 'cross' || x.m === 'spin');
            if(dr2 && f.o >= dr2.c){
              dribbleType = dr2.m;
              dribbleMaxDist = dr2.dist || 1;
              logMsg('🤖 ' + f.n + ': ' + dr2.n);
              // Имитируем: проверка и движение
              const roll = Math.floor(Math.random()*6) + 1;
              const defRoll = Math.floor(Math.random()*6) + 1;
              const atk = f.d + roll;
              const dfn = nd.def.z + defRoll;
              f.o -= dr2.c;
              if(atk >= dfn){
                f.c = tOff.c; f.r = tOff.r;
                f.px = undefined; f.py = undefined; f.mv = true;
                logMsg('✓ Прошёл');
                if(dr2.m === 'spin') nd.def.o = Math.max(0, nd.def.o - 1);
              } else {
                logMsg('✗ Дриблинг не удался');
                f.o = Math.max(0, f.o - 1);
              }
              ui(); draw();
              await sleep(500);
              return 'move';
            }
          }
        }
      }
    }

    // 2. Пас под давлением
    if(pressure && lv.pass && chance(lv.smart) && f.o >= 1){
      const allies = openAllies(f);
      const safe = allies.filter(a => lanesOpen(f, a));
      if(safe.length && chance(0.7)){
        const target = pick(safe);
        logMsg('🤖 Пас ' + f.n + ' → ' + target.n);
        ball = target.i;
        delete holds[f.i];
        f.o -= 1;
        ui(); draw();
        await sleep(500);
        return 'move';
      }
    }

    // 3. Бросок
    const shots = pickShot(f);
    if(shots.length){
      shots.sort((a, b) => b.score - a.score);
      // На лёгком иногда ходит вместо броска
      const shootNow = chance(aiDifficulty === 'easy' ? 0.5 : aiDifficulty === 'hard' ? 0.95 : 0.8);
      if(shootNow){
        const best = shots[0];
        if(best.act === 'dunk' && typeof dunk === 'function'){ dunk(); return 'shot'; }
        if(best.act === 'floater' && typeof doFloater === 'function'){ doFloater(); return 'shot'; }
        if(best.act === 'deepthree' && typeof doDeepThree === 'function'){ doDeepThree(); return 'shot'; }
        shoot(); return 'shot';
      }
    }

    // 4. Движение к кольцу
    if(f.o >= 2){
      const opts = nb(f.c, f.r).filter(p => !figAt(p[0], p[1]));
      if(opts.length){
        opts.sort((a, b) => dist(a[0], a[1], hoop.c, hoop.r) - dist(b[0], b[1], hoop.c, hoop.r));
        const step = opts[0];
        f.c = step[0]; f.r = step[1]; f.o -= 2; f.mv = true;
        f.px = undefined; f.py = undefined;
        ui(); draw();
        await sleep(400);
        return 'move';
      }
    }
    return null;
  }

  // ===== ИИ: защита =====
  async function aiDefend(f){
    const lv = aiLevel();
    const bo = byId(ball);
    if(!bo || bo.t === f.t) return null;

    // Мяч у врага
    const d = dist(f.c, f.r, bo.c, bo.r);

    // Отбор вплотную
    if(d <= 1 && f.o >= 1){
      logMsg('🤖 ' + f.n + ': Отбор');
      doSteal();
      await sleep(500);
      return 'steal';
    }

    // Способности-помехи (Светлячок, Богомол, Скорпион)
    if(lv.abilities && d <= 1 && chance(0.4) && f.o >= 1 && f.ab){
      const useful = f.ab.find(a => a.m === 'blind' || a.m === 'freeze' || a.m === 'sting');
      if(useful && !(useful.u && f.us.indexOf(useful.n) >= 0)){
        logMsg('🤖 ' + f.n + ': ' + useful.n);
        // Имитируем применение
        const roll = Math.floor(Math.random()*6) + 1;
        if(useful.m === 'blind'){ bo.bl = 1; }
        else if(useful.m === 'freeze'){ bo.fr = 1; }
        else if(useful.m === 'sting'){ bo.o = Math.max(0, bo.o - 2); }
        f.o -= useful.c;
        if(useful.u) f.us.push(useful.n);
        ui(); draw();
        await sleep(500);
        return 'ability';
      }
    }

    // Давление рядом с кольцом
    if(f.o >= 1 && chance(0.5)){
      const hoop = hoops[1];
      const dHoop = dist(f.c, f.r, hoop.c, hoop.r);
      if(dHoop <= 3 && !presses.some(p => p.c === f.c && p.r === f.r)){
        presses.push({ c: f.c, r: f.r, team: f.t, owner: f.i });
        f.o -= 1;

    }

    // Движение к мячу
    if(f.o >= 1){
      const opts = nb(f.c, f.r).filter(p => !figAt(p[0], p[1]));
      if(opts.length){
        opts.sort((a, b) => dist(a[0], a[1], bo.c, bo.r) - dist(b[0], b[1], bo.c, bo.r));
        f.c = opts[0][0]; f.r = opts[0][1]; f.o -= 1;
        f.px = undefined; f.py = undefined;
        ui(); draw();
        await sleep(350);
        return 'move';
      }
    }
    return null;
  }

  // ===== ИИ: без мяча (атака) =====
  async function aiOffBall(f){
    const hoop = hoops[0];
    const bo = byId(ball);

    // Мяч у союзника — идём к кольцу
    if(bo && bo.t === f.t){
      if(f.o >= 1){
        const opts = nb(f.c, f.r).filter(p => !figAt(p[0], p[1]));
        if(opts.length){
          opts.sort((a, b) => dist(a[0], a[1], hoop.c, hoop.r) - dist(b[0], b[1], hoop.c, hoop.r));
          f.c = opts[0][0]; f.r = opts[0][1]; f.o -= 1;
          f.px = undefined; f.py = undefined;
          ui(); draw();
          await sleep(350);
          return 'move';
        }
      }
    }
    return null;
  }

  // ===== Главное действие фигуры =====
  async function aiStep(f){
    if(ball === f.i) return aiWithBall(f);
    const bo = byId(ball);
    if(bo && bo.t !== f.t) return aiDefend(f);
    return aiOffBall(f);
  }

  // ===== Игра фигурой =====
  async function aiPlayFigure(f){
    let guard = 15;
    while(f.o > 0 && turn === 1 && !over && guard-- > 0){
      const result = await aiStep(f);
      if(!result) break;
      if(result === 'shot'){ await sleep(1200); break; }
      await sleep(300);
    }
  }

  // ===== Игра всей командой =====
  async function aiPlayAll(){
    if(aiRunning) return;
    aiRunning = true;
    logMsg('🤖 ИИ думает (' + aiDifficulty + ')...');

    let guard = 12;
    while(turn === 1 && !over && guard-- > 0){
      const cands = fig.filter(x => x.t === 1 && !x.a && x.c >= 0);
      if(!cands.length) break;

      // Приоритет: с мячом > защитники рядом с мячом > остальные
      let f = cands.find(x => ball === x.i);
      if(!f){
        const bo = byId(ball);
        if(bo && bo.t === 0){
          f = cands.slice().sort((a, b) =>
            dist(a.c, a.r, bo.c, bo.r) - dist(b.c, b.r, bo.c, bo.r))[0];
        } else {
          const hoop = hoops[0];
          f = cands.slice().sort((a, b) =>
            dist(a.c, a.r, hoop.c, hoop.r) - dist(b.c, b.r, hoop.c, hoop.r))[0];
        }
      }
      if(!f) break;

      sel = f.i;
      reHL(); ui(); draw();
      await sleep(400);
      await aiPlayFigure(f);
      if(!f.a && !over) end();
      await sleep(250);
    }
    aiRunning = false;
  }

  // ===== Перехват управления =====
  function checkStartAI(){
    if(aiEnabled && turn === 1 && !over){
      setTimeout(aiPlayAll, 800);
    }
  }

  const _v16_end = end;
  end = function(){ _v16_end(); checkStartAI(); };

  const _v16_endTurn = endTurn;
  endTurn = function(){ _v16_endTurn(); checkStartAI(); };

  const _v16_reset = resetPositions;
  resetPositions = function(t){ _v16_reset(t); checkStartAI(); };

  const _v16_init = initGame;
  initGame = function(a, b){ _v16_init(a, b); checkStartAI(); };

  logMsg('Патч v16: Умный ИИ загружен');
})();

  // ---- Проверка на бросок ----

// ПАТЧ v18: Нерф блока (только вплотную; 2 гекса — для топ-защитников)
// ============================================================
(function(){

  checkBlock = function(shooter){
    // Собираем всех защитников рядом
    const candidates = fig.filter(function(g){
      if(g.t === shooter.t) return false;
      if(g.c < 0) return false;
      const d = dist(g.c, g.r, shooter.c, shooter.r);
      if(d === 1) return true;                       // вплотную — все
      if(d === 2 && g.z >= 5) return true;           // 2 гекса — только топ-защита
      return false;
    });

    for(let i = 0; i < candidates.length; i++){
      const b = candidates[i];
      if(b.o < 1) continue;
      const d = dist(b.c, b.r, shooter.c, shooter.r);

      // Штраф за дистанцию
      let penalty = 0;
      if(d === 2) penalty = -2; // с 2 гексов — сильно слабее

      // Бонус за особые способности защитника
      let abBonus = 0;
      if(b.ab && b.ab.some(function(a){ return a.n === 'Стоппер'; })) abBonus += 1;

      const atk = b.s + Math.floor(Math.random()*6) + 1 + penalty + abBonus;
      const def = shooter.s + Math.floor(Math.random()*6) + 1;
      logMsg('Блок ' + b.n + ' (дист. ' + d + ') ' + atk + ' vs ' + shooter.n + ' ' + def);

      if(atk >= def){
        b.o = Math.max(0, b.o - 1);
        return b;
      }
    }
    return null;
  };

  logMsg('Патч v18: блок нерфнут (вплотную / 2 гекса — только Защ≥5)');
})();

(function(){

  // Базовые (не перевёрнутые) позиции для каждого режима
  const BASE = {
    '5v5': {
      green: [[4,5],[6,5],[2,5],[3,4],[5,4]],
      red:   [[4,7],[6,7],[2,7],[3,8],[5,8]]
    },
    '3v3': {
      green: [[4,6],[2,6],[5,4]],
      red:   [[4,7],[6,7],[3,9]]
    },
    '1v1': {
      green: [[4,8]],
      red:   [[4,6]]
    }
  };

  // Перезаписываем логику смены сторон полностью
  window.setSwap = function(shouldSwap){
    const m = window.gameMode || '5v5';
    const b = BASE[m];
    if(!b) return;

    // Выбираем какие "свои" и какие "чужие"
    const g = shouldSwap ? b.red : b.green;
    const r = shouldSwap ? b.green : b.red;

    // Перезаписываем pA и pB
    pA.length = 0; pB.length = 0;
    g.forEach(p => pA.push([p[0], p[1]]));
    r.forEach(p => pB.push([p[0], p[1]]));

    // Кольца: для 1v1 — оба снизу, для остальных — стандарт
    if(m === '1v1'){
      hoops[0].c = 4; hoops[0].r = 11;
      hoops[1].c = 4; hoops[1].r = 11;
    } else {
      hoops[0].c = 4; hoops[0].r = 0;
      hoops[1].c = 4; hoops[1].r = 11;
    }
  };

  // Восстанавливаем корректный свап в патче v15

    const cur = (typeof window.__v15_isSwapped !== 'undefined') ? window.__v15_isSwapped : true;
    window.__v15_isSwapped = !cur;
    window.setSwap(window.__v15_isSwapped);

        });
        fig.filter(f => f.t === 1).forEach((f, i) => {
          if(!f.a && pB[i]){ f.c = pB[i][0]; f.r = pB[i][1]; f.px = undefined; f.py = undefined; }
        });
        if(typeof ui === 'function') ui();
        if(typeof draw === 'function') draw();

    }
  };

  // Сохраняем состояние
  try {
    const saved = localStorage.getItem('insectBall_greenBottom');
    window.__v15_isSwapped = saved === null ? true : saved === '1';
  } catch(e){
    window.__v15_isSwapped = true;
  }

  // Первичное применение
  window.setSwap(window.__v15_isSwapped);

  setTimeout(function(){

    btn.textContent = '🔄 Моя команда снизу: ' + (window.__v15_isSwapped ? 'ВКЛ' : 'ВЫКЛ');
    btn.onclick = function(){
      window.__v15_isSwapped = !window.__v15_isSwapped;
      try {
        localStorage.setItem('insectBallGreenBottom'.slice(0, 12) === 'insectBall_g' 
          ? 'insectBall_greenBottom' 
          : 'insectBall_greenBottom',
          window.__v15_isSwapped ? '1' : '0');
      } catch(e){}
      window.setSwap(window.__v15_isSwapped);
      btn.textContent = '🔄 Моя команда снизу: ' + (window.__v15_isSwapped ? 'ВКЛ' : 'ВЫКЛ');
      // Переставить текущие фигуры
      if(typeof fig !== 'undefined' && fig.length && !over){
        try {
          fig.filter(f => f.t === 0).forEach((f, i) => {
            if(!f.a && pA[i]){ f.c = pA[i][0]; f.r = pA[i][1]; f.px = undefined; f.py = undefined; }
          });
          fig.filter(f => f.t === 1).forEach((f, i) => {
            if(!f.a && pB[i]){ f.c = pB[i][0]; f.r = pB[i][1]; f.px = undefined; f.py = undefined; }
          });

(function(){

  // Базовые стартовые позиции (Зелёные всегда сверху, Красные снизу)
  const BASE = {
    '5v5': {
      green: [[4,5],[6,5],[2,5],[3,4],[5,4]],
      red:   [[4,7],[6,7],[2,7],[3,8],[5,8]]
    },
    '3v3': {
      green: [[4,6],[2,6],[5,4]],
      red:   [[4,7],[6,7],[3,9]]
    },
    '1v1': {
      green: [[4,8]],
      red:   [[4,6]]
    }
  };

  // ============================================================
  // setSwap: true = Зелёные СНИЗУ (перевёрнуто)
  //          false = Зелёные СВЕРХУ (стандарт)
  // ============================================================
  window.setSwap = function(shouldSwap){
    const m = window.gameMode || '5v5';
    const b = BASE[m];
    if(!b) return;

    // Стартовые позиции
    const g = shouldSwap ? b.red : b.green;
    const r = shouldSwap ? b.green : b.red;

    pA.length = 0; pB.length = 0;
    g.forEach(p => pA.push([p[0], p[1]]));
    r.forEach(p => pB.push([p[0], p[1]]));

    // ---- КОЛЬЦА ----
    // Правило: hoops[0] = ЗЕЛЁНОЕ (защищают зелёные)
    //          hoops[1] = КРАСНОЕ (защищают красные)
    // doShoot использует hoops[1 - f.t] — для зелёных это hoops[1] = КРАСНОЕ ✅
    //                                     для красных это hoops[0] = ЗЕЛЁНОЕ ✅
    if(m === '1v1'){
      // 1v1: одно кольцо внизу, оба атакуют его
      hoops[0].c = 4; hoops[0].r = 11;
      hoops[1].c = 4; hoops[1].r = 11;
    } else if(shouldSwap){
      // Зелёные СНИЗУ → их кольцо внизу → hoops[0] = низ
      //                Красное кольцо сверху → hoops[1] = верх
      hoops[0].c = 4; hoops[0].r = 11;  // зелёное — низ
      hoops[1].c = 4; hoops[1].r = 0;   // красное — верх
    } else {
      // Зелёные СВЕРХУ → их кольцо сверху → hoops[0] = верх
      hoops[0].c = 4; hoops[0].r = 0;   // зелёное — верх
      hoops[1].c = 4; hoops[1].r = 11;  // красное — низ
    }

    // Перерисовать
    if(typeof ui === 'function') ui();
    if(typeof draw === 'function') draw();
  };

  // ---- Первичная установка ----
  try {
    const s = localStorage.getItem('insectBall_greenBottom');
    const swap = (s === null) ? true : (s === '1');
    window.setSwap(swap);
  } catch(e){
    window.setSwap(true);
  }

  // ---- Перерисовка колец с правильным цветом ----
  const _r = render;
  render = function(){
    _r();

    // Закрываем старые кольца и рисуем правильные
    hoops.forEach(function(h, i){
      const hp = cen(h.c, h.r);

      // Затираем старую тень/кольцо
      x.beginPath();
      x.arc(hp.x, hp.y + 2, 12, 0, 6.3);
      x.fillStyle = 'rgba(0,0,0,0.4)';
      x.fill();

      // Тень
      x.beginPath();
      x.arc(hp.x, hp.y + 2, 8, 0, 6.3);
      x.fillStyle = 'rgba(0,0,0,0.5)';
      x.fill();

      // Цвет: hoops[0] = зелёное, hoops[1] = красное
      const isRed = (i === 1);

      // Свечение
      x.beginPath();
      x.arc(hp.x, hp.y, 8, 0, 6.3);
      x.strokeStyle = isRed ? 'rgba(248,113,113,0.35)' : 'rgba(74,222,128,0.35)';
      x.lineWidth = 7;
      x.stroke();

      // Основное кольцо
      x.beginPath();
      x.arc(hp.x, hp.y, 8, 0, 6.3);
      x.strokeStyle = isRed ? '#f87171' : '#4ade80';
      x.lineWidth = 3;
      x.stroke();

      // Внутреннее белое
      x.beginPath();
      x.arc(hp.x, hp.y, 6, 0, 6.3);
      x.strokeStyle = 'rgba(255,255,255,0.4)';
      x.lineWidth = 1;
      x.stroke();
    });
  };

  // ---- При смене режима снова применяем стороны ----
  const _prevSetMode = window.setGameMode;
  window.setGameMode = function(m){
    if(_prevSetMode) _prevSetMode(m);
    window.gameMode = m;
    try { localStorage.setItem('insectBall_mode', m); } catch(e){}
    try {
      const s = localStorage.getItem('insectBall_greenBottom');
      const swap = (s === null) ? true : (s === '1');
      window.setSwap(swap);
    } catch(e){}
  };

  // ---- При старте игры снова применяем стороны ----
  const _ig = initGame;
  initGame = function(a, b){
    try {
      const s = localStorage.getItem('insectBall_greenBottom');
      const swap = (s === null) ? true : (s === '1');
      window.setSwap(swap);
    } catch(e){}
    _ig(a, b);
    // Ещё раз через 100мс — на случай если initGame внутри менял hoops
    setTimeout(function(){
      try {
        const s = localStorage.getItem('insectBall_greenBottom');
        const swap = (s === null) ? true : (s === '1');
        // Не меняем pA/pB, только hoops
        const m = window.gameMode || '5v5';
        if(m === '1v1'){
          hoops[0].c = 4; hoops[0].r = 11;
          hoops[1].c = 4; hoops[1].r = 11;
        } else if(swap){
          hoops[0].c = 4; hoops[0].r = 11;
          hoops[1].c = 4; hoops[1].r = 0;
        } else {
          hoops[0].c = 4; hoops[0].r = 0;
          hoops[1].c = 4; hoops[1].r = 11;
        }
      } catch(e){}
      if(typeof draw === 'function') draw();
    }, 150);
  };

  logMsg('Патч v21: кольца и стороны исправлены');
})();

(function(){

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ===== 1. Частицы (конфетти/искры) =====
  window.__particles = [];
  function spawnParticles(px, py, count, colors, speed, life){
    for(let i = 0; i < count; i++){
      const angle = Math.random() * Math.PI * 2;
      const sp = speed * (0.5 + Math.random());
      window.__particles.push({
        x: px, y: py,
        vx: Math.cos(angle) * sp,
        vy: Math.sin(angle) * sp - 1,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: life || 60,
        maxLife: life || 60,
        size: 2 + Math.random() * 3
      });
    }
    if(!animating){ animating = true; requestAnimationFrame(tick); }
  }

  // Обновление частиц
  function updateParticles(){
    if(!window.__particles.length) return false;
    window.__particles = window.__particles.filter(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15; // гравитация
      p.vx *= 0.97;
      p.life--;
      return p.life > 0;
    });
    return true;
  }

  // ===== 2. Рисуем частицы + эффекты поверх =====
  const _r = render;
  render = function(){
    _r();

    // Частицы

      const a = p.life / p.maxLife;
      x.globalAlpha = a;
      x.fillStyle = p.color;
      x.beginPath();
      x.arc(p.x, p.y, p.size, 0, 6.3);
      x.fill();
      x.globalAlpha = 1;
    });
  };

  // Обновляем частицы в tick
  const _t = tick;
  tick = function(){
    const active = updateParticles();
    _t();
    if(active && !animating){
      animating = true;
      requestAnimationFrame(tick);
    }
  };
    // ===== 3. Покачивание фигур текущей команды =====

      x.arc(px, py, S * 0.85, 0, 6.3);

  const _pass = doPass;
  doPass = function(targetId){

  // ===== Запускаем постоянную анимацию =====

(function(){

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ============ СПЕЦЭФФЕКТЫ ============

  // 1. Призрачный след (ghost trail) — для прыжка/фазы/рывка
  function ghostTrail(f, fromC, fromR, toC, toR, color, count){
    const from = cen(fromC, fromR);
    const to = cen(toC, toR);
    const steps = count || 6;
    for(let i = 0; i < steps; i++){
      const t = i / steps;
      const px = from.x + (to.x - from.x) * t;
      const py = from.y + (to.y - from.y) * t;
      fx.push({
        type: 'ghost',
        x: px, y: py,
        color: color || 'rgba(168,85,247,0.6)',
        life: 20 + i * 2,
        maxLife: 20 + i * 2,
        size: S * 0.62
      });
    }
    if(!animating){ animating = true; requestAnimationFrame(tick); }
  }

  // 2. Взрыв искр (универсальный)
  function burst(px, py, color, count, speed){
    for(let i = 0; i < (count || 14); i++){
      const a = Math.random() * Math.PI * 2;
      const sp = (speed || 3) * (0.5 + Math.random());
      window.__particles.push({
        x: px, y: py,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 1,
        color: color,
        life: 40,
        maxLife: 40,
        size: 2 + Math.random() * 3
      });
    }
    if(!animating){ animating = true; requestAnimationFrame(tick); }
  }

  // 3. Ударная волна (расширяющийся круг)
  function shockwave(px, py, color){
    fx.push({
      type: 'wave',
      x: px, y: py,
      r: 0,
      maxR: S * 2.5,
      color: color || 'rgba(255,255,255,0.8)',
      life: 30,
      maxLife: 30
    });
    if(!animating){ animating = true; requestAnimationFrame(tick); }
  }

  // 4. Спираль (для спин-мува)
  function spiral(px, py, color){
    for(let i = 0; i < 18; i++){
      const a = (i / 18) * Math.PI * 2;
      const r = S * 0.8;
      fx.push({
        type: 'ghost',
        x: px + Math.cos(a) * r,
        y: py + Math.sin(a) * r,
        color: color || 'rgba(139,92,246,0.7)',
        life: 25 + i,
        maxLife: 25 + i,
        size: 3
      });
    }
    if(!animating){ animating = true; requestAnimationFrame(tick); }
  }

  // ============ РИСУЕМ ЭФФЕКТЫ ============
  const _r = render;
  render = function(){
    _r();

    // Ghost, wave — из fx
    fx.forEach(e => {
      if(e.type === 'ghost'){
        const a = e.life / e.maxLife;
        x.globalAlpha = a * 0.7;
        x.beginPath();
        x.arc(e.x, e.y, e.size, 0, 6.3);
        x.fillStyle = e.color;
        x.fill();
        x.globalAlpha = 1;
      } else if(e.type === 'wave'){
        const a = e.life / e.maxLife;
        x.globalAlpha = a;
        x.beginPath();
        x.arc(e.x, e.y, e.r, 0, 6.3);
        x.strokeStyle = e.color;
        x.lineWidth = 3;
        x.stroke();
        x.globalAlpha = 1;
      }
    });
  };

  // Обновляем fx в tick
  const _t = tick;
  tick = function(){
    // Обновляем ghost/wave
    let changed = false;
    fx.forEach(e => {
      if(e.type === 'ghost'){ e.life--; changed = true; }
      else if(e.type === 'wave'){
        e.life--;
        e.r = e.maxR * (1 - e.life / e.maxLife);
        changed = true;
      }
    });
    fx = fx.filter(e => !(e.type === 'ghost' && e.life <= 0) && !(e.type === 'wave' && e.life <= 0));
    _t();
    if(changed && !animating){ animating = true; requestAnimationFrame(tick); }
  };

  // ============ АНИМАЦИИ СПОСОБНОСТЕЙ ============

  // Заменяем execAb
  const _execAb = execAb;
  execAb = function(t){

    if(!f || !pab) return _execAb(t);

// Длительности приёмов
var DRIBBLE_COSTS = { cross: 1, spin: 2, ankle: 3, euro: 2, hesi: 1, between: 1, stepback: 2 };

// Полностью переписываем tick (без IIFE) — не трогает _animating фигуры
tick = function(){
  let any = false;
  for(let i = 0; i < fig.length; i++){
    const f = fig[i];
    if(f._animating) continue;
    const tgt = cen(f.c, f.r);
    if(f.px === undefined || f.px === null){ f.px = tgt.x; f.py = tgt.y; continue; }
    const dx = tgt.x - f.px, dy = tgt.y - f.py;
    if(Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5){
      f.px += dx * 0.22;
      f.py += dy * 0.22;
      any = true;
    } else {
      f.px = tgt.x;
      f.py = tgt.y;
    }
  }
  render();
  if(any) requestAnimationFrame(tick);
  else animating = false;
};
  
// Универсальная анимация: финт + скольжение
async function dribbleAnim(f, startPx, endPx, perpX, perpY){
  const sleepMs = (ms) => new Promise(r => setTimeout(r, ms));
  const FR1 = 12, FR2 = 16;
  const dt1 = 240 / FR1, dt2 = 400 / FR2;

  // Финт в сторону
  for(let i = 0; i <= FR1; i++){
    const t = i / FR1;
    const off = Math.sin(t * Math.PI * 2) * 11;
    f.px = startPx.x + perpX * off;
    f.py = startPx.y + perpY * off;
    render();
    await sleepMs(dt1);
  }
  f.px = startPx.x;
  f.py = startPx.y;

  // Скольжение к цели
  for(let i = 0; i <= FR2; i++){
    const t = i / FR2;
    const ease = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
    f.px = startPx.x + (endPx.x - startPx.x) * ease;
    f.py = startPx.y + (endPx.y - startPx.y) * ease;
    render();
    await sleepMs(dt2);
  }
  f.px = endPx.x;
  f.py = endPx.y;
  render();
}

// Перехват handleModeClick
var _prevHandleModeClick = handleModeClick;
handleModeClick = function(col, row){
  if(mode !== 'dribbleTarget'){
    return _prevHandleModeClick(col, row);
  }
  if(window.__animLock) return;

  const f = byId(sel);
  if(!f) return;

  const t = hl.find(h => h.c === col && h.r === row);
  if(!t){
    // клик мимо — сброс
    mode = 'sel'; hl = []; reHL(); ui(); draw();
    return;
  }

  // === ПРОВЕРКА КУБИКА ===
  const dr = dribbleType; // cross / spin / ankle / euro
  const cost = DRIBBLE_COSTS[dr] || 1;
  if(f.o < cost){ logMsg('Мало ОД'); return; }

  const def = byId(t.defId);

  // Бросок
  const roll = Math.floor(Math.random()*6) + 1;
  const defRoll = Math.floor(Math.random()*6) + 1;
  const atkBonus = (f.bl > 0) ? -2 : 0;
  const pen = (dr === 'ankle') ? -3 : 0;
  const atk = f.d + atkBonus + pen + roll;
  const dfn = def ? def.z + defRoll : 99;
  const success = atk >= dfn;

  const drNames = { cross:'Кроссовер', spin:'Спин-мув', ankle:'Анкл-брейкер', euro:'Евростеп' };
  logMsg((drNames[dr] || dr) + ': Дри ' + atk + ' vs Защ ' + dfn);

  // === ЗАПУСК АНИМАЦИИ ===
  window.__animLock = true;
  f._animating = true;

  const startPx = cen(f.c, f.r);
  const endPx = cen(t.c, t.r);
  const dx = endPx.x - startPx.x;
  const dy = endPx.y - startPx.y;
  const len = Math.hypot(dx, dy) || 1;
  const perpX = -dy / len;
  const perpY = dx / len;

  dribbleAnim(f, startPx, endPx, perpX, perpY).then(function(){
    // === ПРИМЕНЕНИЕ РЕЗУЛЬТАТА ===
    if(success){
      f.c = t.c; f.r = t.r;
      f.o -= cost;
      f.mv = true;
      f.px = endPx.x;
      f.py = endPx.y;
      logMsg('✓ Прошёл сквозь ' + (def ? def.n : '?'));

      if(typeof popText === 'function'){
        popText((drNames[dr] || dr).toUpperCase() + '!', endPx.x, endPx.y - 32, '#22c55e', 16);
      }

      if(dr === 'spin' && def){
        def.o = Math.max(0, def.o - 1);
        logMsg(def.n + ' −1 ОД');
      } else if(dr === 'euro'){
        f.shootBonus = (f.shootBonus || 0) + 2;
        logMsg('+2 к броску');
      } else if(dr === 'ankle' && def){
        def.fr = 1;
        logMsg('★ ' + def.n + ' упал!');
        if(typeof popText === 'function'){
          const dp = cen(def.c, def.r);
          popText('💫', dp.x, dp.y - 30, '#ef4444', 30);
        }
      }
    } else {
      // Провал — вернуть на место, штраф −1 ОД
      f.o = Math.max(0, f.o - cost - 1);
      logMsg('✗ ' + (drNames[dr] || dr) + ' провалился');
      if(typeof popText === 'function'){
        popText('✗', startPx.x, startPx.y - 30, '#ef4444', 22);
      }
    }

    // === ЗАВЕРШЕНИЕ ===
    f._animating = false;
    window.__animLock = false;
    mode = 'sel'; hl = [];
    reHL(); ui(); draw();

    if(f.o <= 0) end();
  });
};

// Перезаписываем dribbleAnim — дольше и с trail
dribbleAnim = async function(f, startPx, endPx, perpX, perpY){
  const sleepMs = (ms) => new Promise(r => setTimeout(r, ms));
  const FR1 = 20, FR2 = 28;
  const dt1 = 500 / FR1, dt2 = 700 / FR2;

  // Очищаем старые ghost-следы
  if(window.__dribbleTrail){
    window.__dribbleTrail.forEach(g => {
      const i = fx.indexOf(g);
      if(i >= 0) fx.splice(i, 1);
    });
  }
  window.__dribbleTrail = [];

  // === ФАЗА 1: ФИНТ ===
  for(let i = 0; i <= FR1; i++){
    const t = i / FR1;
    // Двойное качание (в бок, обратно, снова в бок)
    const off = Math.sin(t * Math.PI * 3) * 18 * (1 - t * 0.3);
    f.px = startPx.x + perpX * off;
    f.py = startPx.y + perpY * off;
    render();
    await sleepMs(dt1);
  }
  f.px = startPx.x;
  f.py = startPx.y;
  await sleepMs(100);

  // === ФАЗА 2: СКОЛЬЖЕНИЕ + СЛЕД ===
  let trailCounter = 0;
  for(let i = 0; i <= FR2; i++){
    const t = i / FR2;
    const ease = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
    f.px = startPx.x + (endPx.x - startPx.x) * ease;
    f.py = startPx.y + (endPx.y - startPx.y) * ease;

    // Каждый 4-й кадр — призрак
    if(i % 4 === 0 && i > 0){
      const ghost = {
        type: 'ghost',
        x: f.px,
        y: f.py,
        color: f.t === 1 ? 'rgba(239,68,68,0.55)' : 'rgba(34,197,94,0.55)',
        life: 22,
        maxLife: 22,
        size: S * 0.55
      };
      fx.push(ghost);
      window.__dribbleTrail.push(ghost);
    }

    render();
    await sleepMs(dt2);
  }
  f.px = endPx.x;
  f.py = endPx.y;
  render();

  // Микро-пауза — чтобы результат «запомнился»
  await sleepMs(200);
};

// Перезаписываем tick — добавляем обработку fx
tick = function(){
  let any = false;

  // 1. Обновляем фигуры (кроме анимируемых)
  for(let i = 0; i < fig.length; i++){
    const f = fig[i];
    if(f._animating) continue;
    const tgt = cen(f.c, f.r);
    if(f.px === undefined || f.px === null){ f.px = tgt.x; f.py = tgt.y; continue; }
    const dx = tgt.x - f.px, dy = tgt.y - f.py;
    if(Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5){
      f.px += dx * 0.22;
      f.py += dy * 0.22;
      any = true;
    } else {
      f.px = tgt.x;
      f.py = tgt.y;
    }
  }

  // 2. Обновляем призраков и волны
  let fxChanged = false;
  for(let i = fx.length - 1; i >= 0; i--){
    const e = fx[i];
    if(e.type === 'ghost'){
      e.life--;
      if(e.life <= 0){ fx.splice(i, 1); fxChanged = true; }
      else fxChanged = true;
    } else if(e.type === 'wave'){
      e.life--;
      e.r = e.maxR * (1 - e.life / e.maxLife);
      if(e.life <= 0){ fx.splice(i, 1); fxChanged = true; }
      else fxChanged = true;
    } else if(e.type === 'text'){
      e.life--;
      e.y -= 0.9;
      if(e.life <= 0){ fx.splice(i, 1); fxChanged = true; }
      else fxChanged = true;
    }
  }

  // 3. Обновляем частицы
  let particlesChanged = false;
  if(window.__particles && window.__particles.length){
    window.__particles = window.__particles.filter(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.vx *= 0.97;
      p.life--;
      return p.life > 0;
    });
    particlesChanged = true;
  }

  // 4. Рисуем всё
  render();

  // 5. Продолжаем цикл, если что-то ещё двигается
  if(any || fxChanged || particlesChanged){
    requestAnimationFrame(tick);
  } else {
    animating = false;
  }
};

(function(){

  s.onload = function(){ mqttReady = true; logMsg('MQTT загружен'); };
  s.onerror = function(){ logMsg('Ошибка загрузки MQTT'); };
  document.head.appendChild(s);

  let mqttClient = null;
  const BROKER = 'wss://broker.emqx.io:8084/mqtt';
  const APP = 'insectball-ru-fixed-v1';   // ← общий топик, одинаковый у обоих

  window.createRoom = function(){
    if(!mqttReady){ setOnlineStatus('MQTT грузится...', '#fbbf24'); return; }
    isHost = true;
    myTeam = 0;
    roomCode = String(Math.floor(1000 + Math.random() * 9000));
    setOnlineStatus('Подключение к брокеру...', '#fbbf24');

    try {
      mqttClient = mqtt.connect(BROKER, {
        clientId: 'host_' + Math.random().toString(36).slice(2, 10),
        keepalive: 30, clean: true, connectTimeout: 8000
      });
    } catch(e){
      setOnlineStatus('Ошибка: ' + e.message, '#ef4444');
      return;
    }

    mqttClient.on('connect', function(){
      const topic = APP + '/room/' + roomCode;
      mqttClient.subscribe(topic);
      document.getElementById('ocCreate').style.display = 'none';
      document.getElementById('ocJoin').style.display = 'none';
      document.getElementById('ocCode').style.display = '';
      document.getElementById('ocCode').textContent = roomCode;
      setOnlineStatus('Скажи другу код. Ждём подключения...', '#fbbf24');
      logMsg('Комната: ' + roomCode);
      setTimeout(function(){
        mqttClient.publish(topic, JSON.stringify({ type: 'host_here' }));
      }, 300);
    });

    mqttClient.on('message', function(topic, payload){
      try {
        const data = JSON.parse(payload.toString());
        if(data.type === 'guest_join'){
          setOnlineStatus('Соединение установлено!', '#22c55e');
          window.conn = { open: true };
          logMsg('Гость подключился');
          setTimeout(function(){ startOnlineGame(); }, 500);
        } else if(typeof window.handleNetMessage === 'function'){
          window.handleNetMessage(data);
        }
      } catch(e){ console.error(e); }
    });

    mqttClient.on('error', function(err){
      setOnlineStatus('Ошибка MQTT: ' + err.message, '#ef4444');
    });
  };

  window.connectToRoom = function(){
    if(!mqttReady){ setOnlineStatus('MQTT грузится...', '#fbbf24'); return; }
    const code = document.getElementById('ocCodeInput').value.trim();
    if(code.length !== 4){ setOnlineStatus('Введи 4 цифры', '#ef4444'); return; }
    roomCode = code;
    isHost = false;
    myTeam = 1;
    setOnlineStatus('Подключение к брокеру...', '#fbbf24');

    try {
      mqttClient = mqtt.connect(BROKER, {
        clientId: 'guest_' + Math.random().toString(36).slice(2, 10),
        keepalive: 30, clean: true, connectTimeout: 8000
      });
    } catch(e){
      setOnlineStatus('Ошибка: ' + e.message, '#ef4444');
      return;
    }

    mqttClient.on('connect', function(){
      const topic = APP + '/room/' + roomCode;
      mqttClient.subscribe(topic);
      setOnlineStatus('Ищу хоста...', '#fbbf24');
      mqttClient.publish(topic, JSON.stringify({ type: 'guest_join' }));
      setTimeout(function(){
        if(!window.conn){
          setOnlineStatus('Соединение установлено!', '#22c55e');
          window.conn = { open: true };
          startOnlineGame();
        }
      }, 2500);
    });

    mqttClient.on('message', function(topic, payload){
      try {
        const data = JSON.parse(payload.toString());
        if(data.type === 'host_here' && !window.conn){
          setOnlineStatus('Хост найден!', '#22c55e');
          window.conn = { open: true };
          logMsg('Хост найден');
          setTimeout(function(){ startOnlineGame(); }, 500);
        } else if(typeof window.handleNetMessage === 'function'){
          window.handleNetMessage(data);
        }
      } catch(e){ console.error(e); }
    });

    mqttClient.on('error', function(err){
      setOnlineStatus('Ошибка MQTT: ' + err.message, '#ef4444');
    });
  };

  window.sendNet = function(data){
    if(!mqttClient) return;
    try { mqttClient.publish(APP + '/room/' + roomCode, JSON.stringify(data)); }
    catch(e){ console.error(e); }
  };

  window.setupConnHandlers = function(){};

  const mOnline = document.getElementById('mOnline');
  if(mOnline){
    mOnline.disabled = false;
    mOnline.style.opacity = '1';
    mOnline.textContent = 'Онлайн';
    mOnline.onclick = function(){
      document.getElementById('main').style.display = 'none';
      document.getElementById('setup').style.display = 'none';
      document.getElementById('game').style.display = 'none';
      document.getElementById('onlineScreen').style.display = 'flex';
    };
  }

  logMsg('Патч v25: MQTT онлайн');
})();
</script>
</body>
</html>
