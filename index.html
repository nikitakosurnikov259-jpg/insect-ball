function startAlley(){
  var f = byId(sel);
  if(!f || ball !== f.i || f.o < 2) return;
  if(!f.teamCd) f.teamCd = {};
  if(f.teamCd.alley > 0){ logMsg('⏳ Алей-уп: кулдаун ' + f.teamCd.alley); return; }

  var h = hoops[1 - f.t];
  var ally = fig.find(function(g){
    return g.t === f.t && g.i !== f.i && g.c >= 0 &&
      dist(g.c, g.r, h.c, h.r) <= 1;
  });
  if(!ally){ logMsg('⚠ Нет союзника у кольца'); return; }

  f.o -= 2;
  f.teamCd.alley = TEAM_CD.alley;

  var int = null, br = 0;
  fig.forEach(function(g){
    if(g.t === f.t || g.c < 0) return;
    var minD = Math.min(
      dist(g.c, g.r, f.c, f.r),
      dist(g.c, g.r, ally.c, ally.r)
    );
    if(minD > 2) return;
    var roll = g.z + Math.floor(Math.random()*6) + 1;
    if(roll > br){ br = roll; int = g; }
  });

  if(int && br >= f.d + Math.floor(Math.random()*6) + 1){
    ball = int.i;
    logMsg('🚫 Перехват алей-паса: ' + int.n);
    if(f.o <= 0) end(); else { ui(); draw(); }
    return;
  }

  var from = cen(f.c, f.r);
  var hp = cen(h.c, h.r);
  ball = null;

  flyBall(from.x, from.y, hp.x, hp.y, function(){
    var pen = 0;
    fig.forEach(function(o){
      if(o.t !== ally.t && o.c >= 0 &&
         dist(o.c, o.r, ally.c, ally.r) <= 1) pen = 2;
    });
    var roll = Math.floor(Math.random()*6) + 1;
    var tot = ally.b + 5 + roll;
    var win = tot >= (5 + pen);
    logMsg('🏀 Алей-уп ' + ally.n + ': ' + tot + ' vs ' + (5 + pen));

    if(win){
      popText('АЛЕЙ-УП +2!', hp.x, hp.y - 30, '#22c55e', 22);
      sc[f.t] += 2;
      burst(hp.x, hp.y, '#22c55e', 25, 4);
      burst(hp.x, hp.y, '#fbbf24', 15, 3);
      setTimeout(function(){
        if(sc[f.t] >= 21){
          over = true;
          logMsg('🏆 Победа!');
          sel = null; hl = [];
          ui(); draw();
          return;
        }
        resetPositions(f.t);
      }, 700);
    } else {
      popText('Мимо', hp.x, hp.y - 30, '#ef4444', 22);
      setTimeout(function(){ rebound(f.t); end(); }, 400);
    }
  });
}

function doPickAndRoll(){
  var f = byId(sel);
  if(!f || f.o < 1) return;
  if(!f.teamCd) f.teamCd = {};
  if(f.teamCd.pickroll > 0){ logMsg('⏳ Пик-н-ролл: кулдаун ' + f.teamCd.pickroll); return; }

  var ally = fig.find(function(g){
    return g.t === f.t && g.i !== f.i && g.c >= 0 &&
      dist(g.c, g.r, f.c, f.r) <= 2;
  });
  if(!ally){ logMsg('⚠ Нет союзника рядом'); return; }

  var enemy = fig.find(function(g){
    return g.t !== f.t && g.c >= 0 &&
      dist(g.c, g.r, ally.c, ally.r) <= 2;
  });
  if(!enemy){ logMsg('⚠ Нет врага для скрина'); return; }

  f.o -= 1;
  f.teamCd.pickroll = TEAM_CD.pickroll;
  enemy.o = Math.max(0, enemy.o - 1);
  logMsg('🤝 Пик-н-ролл: ' + ally.n + ' скрин на ' + enemy.n);

  var p = cen(ally.c, ally.r);
  popText('🚧 СКРИН', p.x, p.y - 32, '#06b6d4', 16);
  var ep = cen(enemy.c, enemy.r);
  popText('-1 ОД', ep.x, ep.y - 30, '#ef4444', 14);
  burst(p.x, p.y, '#06b6d4', 12, 2.5);

  if(f.o <= 0) end(); else { ui(); draw(); }
}

function doFastBreak(){
  var f = byId(sel);
  if(!f || ball !== f.i || f.o < 2) return;
  if(!f.teamCd) f.teamCd = {};
  if(f.teamCd.fastbreak > 0){ logMsg('⏳ Отрыв: кулдаун ' + f.teamCd.fastbreak); return; }

  var h = hoops[1 - f.t];
  var myAx = toAx(f.c, f.r);
  var dirs = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
  var best = null, bd = dist(f.c, f.r, h.c, h.r);

  dirs.forEach(function(d){
    var tOff = toOff(myAx.q + d[0]*2, myAx.r + d[1]*2);
    if(tOff.c < 0 || tOff.c >= COLS ||
       tOff.r < 0 || tOff.r >= ROWS) return;
    if(figAt(tOff.c, tOff.r)) return;

    var mid = toOff(myAx.q + d[0], myAx.r + d[1]);
    var midFig = figAt(mid.c, mid.r);
    if(midFig && midFig.t !== f.t) return;

    var dh = dist(tOff.c, tOff.r, h.c, h.r);
    if(dh < bd){ bd = dh; best = tOff; }
  });

  if(!best){ logMsg('⚠ Некуда бежать'); return; }

  f.o -= 2;
  f.teamCd.fastbreak = TEAM_CD.fastbreak;
  var fromC = f.c, fromR = f.r;
  ghostTrail(f, fromC, fromR, best.c, best.r, 'rgba(6,182,212,0.8)', 8);
  f.c = best.c;
  f.r = best.r;
  f.px = undefined; f.py = undefined;
  f.mv = true;

  logMsg('🚀 Отрыв!');
  var p = cen(best.c, best.r);
  popText('🚀 ОТРЫВ', p.x, p.y - 30, '#06b6d4', 18);
  burst(p.x, p.y, '#06b6d4', 10, 3);

  if(f.o <= 0) end();
  else { ui(); draw(); }
}

var __longPassMode = false;
var __longPassCaster = null;

function startLongPass(){
  var f = byId(sel);
  if(!f || ball !== f.i || f.o < 2) return;
  if(!f.teamCd) f.teamCd = {};
  if(f.teamCd.longpass > 0){ logMsg('⏳ Длинный пас: кулдаун ' + f.teamCd.longpass); return; }

  mode = 'pass';
  hl = fig.filter(function(g){
    return g.t === f.t && g.i !== f.i && g.c >= 0 &&
      dist(f.c, f.r, g.c, g.r) <= 6;
  }).map(function(g){
    return {c: g.c, r: g.r, m: 'pass', id: g.i};
  });

  if(!hl.length){ logMsg('⚠ Нет союзников'); mode='sel'; return; }
  __longPassMode = true;
  __longPassCaster = f.i;
  ui(); draw();
}

// Перехват doPass для длинного паса
var _doPass_long = doPass;
doPass = function(targetId){
  if(__longPassMode){
    __longPassMode = false;
    var f = byId(__longPassCaster);
    var t = byId(targetId);
    if(!f || !t){ __longPassCaster = null; return _doPass_long(targetId); }
    __longPassCaster = null;

    var d = dist(f.c, f.r, t.c, t.r);
    if(d <= 3){ return _doPass_long(targetId); }

    if(!f.teamCd) f.teamCd = {};
    f.teamCd.longpass = TEAM_CD.longpass;
    logMsg('⏳ Длинный пас: кулдаун ' + TEAM_CD.longpass);

    var int = null, br = 0;
    fig.forEach(function(g){
      if(g.t === f.t || g.c < 0) return;
      var minD = Math.min(
        dist(g.c, g.r, f.c, f.r),
        dist(g.c, g.r, t.c, t.r)
      );
      if(minD > 2) return;
      var roll = g.z + Math.floor(Math.random()*6) + 1 + 3;
      if(roll > br){ br = roll; int = g; }
    });

    if(int){
      var pr = f.d + Math.floor(Math.random()*6) + 1 - 1;
      if(br >= pr){
        f.o -= 2;
        ball = int.i;
        logMsg('🚫 ПЕРЕХВАТ длинного паса: ' + int.n);
        mode='sel'; hl=[];
        if(f.o <= 0) end();
        else { ui(); draw(); }
        return;
      }
    }

    var from = cen(f.c, f.r), to = cen(t.c, t.r);
    ball = null;
    f.o -= 2;
    flyBall(from.x, from.y, to.x, to.y, function(){
      ball = targetId;
      logMsg('🎯 Длинный пас ' + f.n + ' → ' + t.n);
      popText('🎯', to.x, to.y - 30, '#3b82f6', 22);
      mode='sel'; hl=[];
      if(f.o <= 0) end();
      else { ui(); draw(); }
    });
    return;
  }
  return _doPass_long(targetId);
};
/* ============================================================
   ЧАСТЬ 11: ИИ
   ============================================================ */

function aiSleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function aiChance(p){ return Math.random() < p; }

function aiLevel(){
  if(aiDifficulty === 'hard') return {smart:1.0, pass:0.95, dribble:0.9, abilities:1.0, defense:1.0};
  if(aiDifficulty === 'easy') return {smart:0.5, pass:0.4, dribble:0.3, abilities:0.3, defense:0.5};
  return {smart:0.85, pass:0.8, dribble:0.7, abilities:0.8, defense:0.8};
}

function aiEnemiesAround(f, r){
  return fig.filter(function(g){
    return g.t !== f.t && g.c >= 0 && dist(g.c, g.r, f.c, f.r) <= (r || 1);
  });
}

function aiAlliesOf(f){
  return fig.filter(function(g){
    return g.t === f.t && g.i !== f.i && g.c >= 0;
  });
}

function aiHoopDist(c, r){
  return dist(c, r, hoops[0].c, hoops[0].r);
}

function aiIsOut3(f){
  return dist(f.c, f.r, hoops[0].c, hoops[0].r) >= 4;
}

async function aiMoveTo(f, tc, tr, cost){
  var opts = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
  if(!opts.length) return false;
  opts.sort(function(a, b){
    return dist(a[0], a[1], tc, tr) - dist(b[0], b[1], tc, tr);
  });
  var step = opts[0];
  var fromC = f.c, fromR = f.r;
  f.c = step[0];
  f.r = step[1];
  f.o -= (cost || 1);
  f.mv = true;
  ghostTrail(f, fromC, fromR, f.c, f.r, 'rgba(239,68,68,0.3)', 3);
  ui(); draw();
  await aiSleep(250);
  return true;
}

// ===== ИИ: ХОД С МЯЧОМ =====
async function aiWithBall(f){
  var lvl = aiLevel();
  var h = hoops[0];
  var d = aiHoopDist(f.c, f.r);
  var near = aiEnemiesAround(f, 1);
  var pressure = near.length >= 1;
  var doubleTeam = near.length >= 2;
  var desperation = (sc[f.t] < sc[1 - f.t] - 6);
  var leading = sc[f.t] > sc[1 - f.t] + 4;

  // 1v1 clear
  if(gameMode === '1v1' && window.__clearFigId === f.i && !aiIsOut3(f)){
    if(f.o >= 1){
      var opts = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
      var best = null, bd = -1;
      opts.forEach(function(p){
        var dh = aiHoopDist(p[0], p[1]);
        if(dh >= 4 && dh > bd){ bd = dh; best = p; }
      });
      if(best){
        f.c = best[0]; f.r = best[1]; f.o -= 1;
        f.px = undefined; f.py = undefined; f.mv = true;
        window.__clearFigId = null;
        logMsg('🤖 ' + f.n + ': за дугу');
        ui(); draw();
        await aiSleep(300);
        return 'move';
      }
    }
    return null;
  }

  // Оценка броска
  var tgt = d <= 1 ? 5 : d <= 3 ? 7 : 9;
  var pen = pressure ? 2 : 0;
  var bonus = 0;
  if((f.ab || []).some(function(a){ return a.n === 'Снайпер'; }) && !f.mv) bonus += 2;
  if((f.ab || []).some(function(a){ return a.n === 'Дальнобой'; }) && d >= 4) bonus += 1;
  if(f.shootBonus) bonus += f.shootBonus;
  if(f.bl > 0) bonus -= 2;
  var need = (tgt + pen) - (f.b + bonus + 3.5);
  var ch = need <= -3 ? 0.95 : need <= -1 ? 0.85 : need <= 1 ? 0.65 : need <= 3 ? 0.45 : need <= 5 ? 0.25 : 0.08;

  // 1) Отличный бросок
  if(ch >= 0.72 && !doubleTeam && f.o >= 2 && d <= 5){
    if(d <= 1 && f.s >= 4){ doDunk(); await aiSleep(1200); return 'shot'; }
    if(d <= 3){ doShoot(); await aiSleep(1200); return 'shot'; }
    if(d <= 5 && ch >= 0.65){ doShoot(); await aiSleep(1200); return 'shot'; }
  }

  // 2) Дриблинг
  if(pressure && !doubleTeam && aiChance(lvl.dribble)){
    var myAx = toAx(f.c, f.r);
    var myHD = aiHoopDist(f.c, f.r);
    var dirs = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
    var targets = [];
    dirs.forEach(function(dd){
      var midOff = toOff(myAx.q + dd[0], myAx.r + dd[1]);
      if(midOff.c < 0 || midOff.c >= COLS || midOff.r < 0 || midOff.r >= ROWS) return;
      var midFig = figAt(midOff.c, midOff.r);
      if(!midFig || midFig.t === f.t) return;
      for(var st = 1; st <= 2; st++){
        var tOff = toOff(myAx.q + dd[0]*(1+st), myAx.r + dd[1]*(1+st));
        if(tOff.c < 0 || tOff.c >= COLS || tOff.r < 0 || tOff.r >= ROWS) break;
        if(figAt(tOff.c, tOff.r)) continue;
        var dh = aiHoopDist(tOff.c, tOff.r);
        if(dh < myHD) targets.push({c: tOff.c, r: tOff.r});
      }
    });
    if(targets.length && f.o >= 1){
      var bestT = targets[Math.floor(Math.random() * targets.length)];
      var roll = Math.floor(Math.random()*6) + 1;
      var defRoll = Math.floor(Math.random()*6) + 1;
      var atk = f.d + roll;
      var dfn = near[0].z + defRoll;
      f.o -= 1;
      logMsg('🤖 ' + f.n + ': дриблинг ' + atk + ' vs ' + dfn);
      if(atk >= dfn){
        f.c = bestT.c; f.r = bestT.r;
        f.px = undefined; f.py = undefined; f.mv = true;
        logMsg('✓ Прошёл');
      } else {
        f.o = Math.max(0, f.o - 1);
        logMsg('✗');
      }
      ui(); draw();
      await aiSleep(400);
      return 'move';
    }
  }

  // 3) Пас
  if((doubleTeam || pressure || ch < 0.4) && f.o >= 1 && aiChance(lvl.pass)){
    var allies = aiAlliesOf(f).filter(function(a){
      return dist(f.c, f.r, a.c, a.r) <= 4;
    });
    if(allies.length){
      var scored = allies.map(function(a){
        var dH = aiHoopDist(a.c, a.r);
        var ne = 99;
        fig.forEach(function(g){
          if(g.t !== f.t && g.c >= 0) ne = Math.min(ne, dist(g.c, g.r, a.c, a.r));
        });
        return {ally: a, score: -dH*2 + ne*2};
      }).sort(function(x, y){ return y.score - x.score; });
      doPass(scored[0].ally.i);
      await aiSleep(400);
      return 'move';
    }
  }

  // 4) Средний бросок
  if(ch >= 0.5 && !doubleTeam && f.o >= 2 && d <= 5){
    doShoot(); await aiSleep(1000); return 'shot';
  }

  // 5) Отчаянный
  if(desperation && f.o >= 2 && d <= 8){
    doShoot(); await aiSleep(1000); return 'shot';
  }

  // 6) Ведёт — тянет время
  if(leading && f.o >= 1 && !pressure){
    f.o -= 1;
    ui(); draw();
    await aiSleep(250);
    return 'move';
  }

  // 7) Движение к кольцу
  if(f.o >= 1 && await aiMoveTo(f, h.c, h.r, 1)) return 'move';
  return null;
}

// ===== ИИ: ЗАЩИТА =====
async function aiDefend(f){
  var lvl = aiLevel();
  var bh = byId(ball);
  if(!bh || bh.t === f.t) return null;
  var d = dist(f.c, f.r, bh.c, bh.r);

  // Способности
  if(d <= 1 && aiChance(lvl.abilities * 0.8) && f.ab){
    var avail = f.ab.filter(function(a){
      return !a.p && !(a.u && f.us.indexOf(a.n) >= 0) && f.o >= a.c &&
        (!f.abilityCd || !f.abilityCd[a.n] || f.abilityCd[a.n] === 0);
    });
    var deb = avail.find(function(a){
      return a.m === 'blind' || a.m === 'freeze' || a.m === 'sting' || a.m === 'push';
    });
    if(deb){
      pab = deb;
      execAb({c: bh.c, r: bh.r, m:'enemy', id: bh.i});
      await aiSleep(400);
      return 'move';
    }
  }

  // Отбор
  if(d <= 1 && f.o >= 1 && aiChance(lvl.defense * 0.8)){
    doSteal();
    await aiSleep(400);
    return 'steal';
  }

  // Давление
  if(f.o >= 1 && aiChance(0.4)){
    var ownH = hoops[1];
    if(dist(f.c, f.r, ownH.c, ownH.r) <= 3 &&
       !presses.some(function(p){ return p.c === f.c && p.r === f.r; })){
      presses.push({c: f.c, r: f.r, team: f.t, owner: f.i});
      f.o -= 1;
      ui(); draw();
      await aiSleep(250);
      return 'move';
    }
  }

  // Позиция
  if(f.o >= 1){
    var oH = hoops[1];
    var opts = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
    var best = null, bs = -1e9;
    opts.forEach(function(p){
      var dm = dist(p[0], p[1], bh.c, bh.r);
      var dh = dist(p[0], p[1], oH.c, oH.r);
      var btw = dm + dh - dist(bh.c, bh.r, oH.c, oH.r);
      var score = -dm*2.8 - dh*0.4 - btw*0.6;
      if(score > bs){ bs = score; best = p; }
    });
    if(best){
      f.c = best[0]; f.r = best[1]; f.o -= 1;
      f.px = undefined; f.py = undefined;
      ui(); draw();
      await aiSleep(220);
      return 'move';
    }
  }
  return null;
}

// ===== ИИ: БЕЗ МЯЧА =====
async function aiOffBall(f){
  var bh = byId(ball);
  if(!bh) return null;

  if(bh.t === f.t){
    if(f.o >= 1){
      var opts = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
      var best = null, bs = -1e9;
      opts.forEach(function(p){
        var dh = aiHoopDist(p[0], p[1]);
        var pressure = 0;
        fig.forEach(function(g){
          if(g.t !== f.t && g.c >= 0 &&
             dist(g.c, g.r, p[0], p[1]) <= 1) pressure += 2;
        });
        var score = -dh * 1.8 - pressure * 3;
        if(score > bs){ bs = score; best = p; }
      });
      if(best){
        f.c = best[0]; f.r = best[1]; f.o -= 1;
        f.px = undefined; f.py = undefined;
        ui(); draw();
        await aiSleep(220);
        return 'move';
      }
    }
    return null;
  }
  return aiDefend(f);
}

// ===== ИИ: ОДИН ШАГ =====
async function aiStep(f){
  if(ball === f.i) return aiWithBall(f);
  var bh = byId(ball);
  if(bh && bh.t !== f.t) return aiDefend(f);
  return aiOffBall(f);
}

async function aiPlayFigure(f){
  var guard = 20;
  while(f.o > 0 && turn === 1 && !over && guard-- > 0){
    var r = await aiStep(f);
    if(!r) break;
    if(r === 'shot') break;
    await aiSleep(200);
  }
}

// ===== ИГРА ВСЕЙ КОМАНДОЙ =====
playAllAI = async function(){
  if(aiRunning) return;
  aiRunning = true;
  logMsg('🤖 ИИ думает (' + aiDifficulty + ')...');

  var guard = 15;
  while(turn === 1 && !over && guard-- > 0){
    var cands = fig.filter(function(x){
      return x.t === 1 && !x.a && x.c >= 0 && x.penalty === 0;
    });
    if(!cands.length) break;

    var f = cands.find(function(x){ return ball === x.i; });
    if(!f){
      var bo = byId(ball);
      if(bo && bo.t === 0){
        f = cands.slice().sort(function(a, b){
          return dist(a.c, a.r, bo.c, bo.r) - dist(b.c, b.r, bo.c, bo.r);
        })[0];
      } else {
        f = cands.slice().sort(function(a, b){
          return aiHoopDist(a.c, a.r) - aiHoopDist(b.c, b.r);
        })[0];
      }
    }
    if(!f) break;

    sel = f.i;
    reHL(); ui(); draw();
    await aiSleep(300);

    await aiPlayFigure(f);
    if(!f.a && !over) end();
    await aiSleep(200);
  }
  aiRunning = false;
};

function renderPool(){

  var pool = document.getElementById('pool');
  if(!pool) return;

        teamGreen.push(n);
        if(teamGreen.length >= need && !isAI) pickingTeam = 1;
      } else if(!isAI && pickingTeam === 1 && teamRed.length < need){
        teamRed.push(n);
      }
      renderPool();
      updateSetupButtons();
    };
    pool.appendChild(b);
  });

  var tg = document.getElementById('tg');
  if(tg){
    tg.innerHTML = teamGreen.length
      ? teamGreen.map(function(n, i){
          return '<span class="chip g" data-g="' + i + '">' + n + ' ×</span>';
        }).join('')
      : '—';
    tg.querySelectorAll('[data-g]').forEach(function(el){
      el.onclick = function(){
        teamGreen.splice(parseInt(el.getAttribute('data-g')), 1);
        pickingTeam = 0;
        renderPool(); updateSetupButtons();
      };
    });
  }

  var tr = document.getElementById('tr');
  if(tr){
    if(isAI){
      tr.innerHTML = '<i style="color:#94a3b8">ИИ выберет сам</i>';
    } else {
      tr.innerHTML = teamRed.length
        ? teamRed.map(function(n, i){
            return '<span class="chip r" data-r="' + i + '">' + n + ' ×</span>';
          }).join('')
        : '—';
      tr.querySelectorAll('[data-r]').forEach(function(el){
        el.onclick = function(){
          teamRed.splice(parseInt(el.getAttribute('data-r')), 1);
          pickingTeam = 1;
          renderPool(); updateSetupButtons();
        };
      });
    }
  }

  var who = document.getElementById('who');
  if(who){
    who.textContent = isAI
      ? 'Зелёные (ты) — ' + gameMode
      : (pickingTeam === 0 ? 'Зелёные' : 'Красные') + ' (' + gameMode + ')';
  }
}

// ===== СТАРТ ИГРЫ =====
function startGame(){
  var need = (MODE_PRESETS[gameMode] || MODE_PRESETS['5v5']).count;

  if(teamGreen.length < need){
    alert('Нужно ' + need + ' фигур Зелёным');
    return;
  }

  if(aiEnabled){
    var pool = Object.keys(F).filter(function(n){ return teamGreen.indexOf(n) < 0; });
    for(var i = pool.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    teamRed = pool.slice(0, need);
  } else if(teamRed.length < need){
    alert('Нужно ' + need + ' фигур Красным');
    return;
  }

  document.getElementById('setup').classList.remove('show');
  document.getElementById('game').classList.add('show');

  initGame(teamGreen.slice(0, need), teamRed.slice(0, need));

  if(!aiEnabled && showPassScreen){
    setTimeout(showPassScreenFn, 500);
  }
}

      h += '<button data-c1="' + c + '" style="width:32px;height:32px;background:' + c + ';border:3px solid ' + (c === c1 ? '#fbbf24' : 'transparent') + ';border-radius:8px;cursor:pointer"></button>';

    h += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px">';

    });
    h += '</div>';

    h += '<div style="color:#94a3b8;font-size:12px;margin-bottom:6px">Режим состава</div>';
    h += '<div style="display:flex;gap:4px;margin-bottom:10px">';
    ['5v5','3v3','1v1'].forEach(function(m){

      h += '<button data-mode="' + m + '" class="btn" style="flex:1;max-width:none;padding:8px 4px;font-size:12px;background:' + (m === currentMode ? '#22c55e' : '#16213e') + '">';
      h += m + ' (' + cnt + '/' + nm + ')';

    if(cur.length){

        h += '<span data-rm="' + i + '" style="display:inline-block;background:' + c1 + ';padding:4px 8px;margin:3px;border-radius:6px;cursor:pointer;font-size:12px">';

    h += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px">';

      h += '<button data-fig="' + fn + '" ' + (used ? 'disabled' : '') + ' style="padding:5px 8px;background:#3b82f6;color:#fff;border:0;border-radius:4px;font-size:11px;cursor:pointer;opacity:' + (used ? '0.3' : '1') + ';font-family:inherit">';
      h += (ICONS[fn] || '🐜') + ' ' + fn + '</button>';
    });
    h += '</div>';

    h += '<button id="teSave" class="btn green" style="max-width:none">💾 Сохранить</button>';
    h += '<button id="teCancel" class="btn gray" style="max-width:none;margin-top:8px">← Отмена</button>';
    h += '</div>';
    div.innerHTML = h;

    div.querySelector('#teName').oninput = function(e){ name = e.target.value; };

      b.onclick = function(){ c1 = b.getAttribute('data-c1'); render(); };
    });
    div.querySelectorAll('[data-c2]').forEach(function(b){
      b.onclick = function(){ c2 = b.getAttribute('data-c2'); render(); };

      b.onclick = function(){
        if(lineups[currentMode].length >= n) return;
        lineups[currentMode].push(b.getAttribute('data-fig'));
        render();
      };
    });

    div.querySelector('#teSave').onclick = function(){
      var nm = div.querySelector('#teName').value.trim();

        var idx = custom.findIndex(function(t){ return t.id === teamId; });
        if(idx >= 0){
          custom[idx] = Object.assign({}, custom[idx], {name: nm, c1: c1, c2: c2, lineups: lineups});
        } else {
          custom.push({id: 'custom_' + Date.now(), name: nm, c1: c1, c2: c2, builtIn: false, lineups: lineups});
        }
      }
      saveCustomTeams(custom);
      div.remove();

  }

  render();
};

      if(sel) h += '<span style="color:#22c55e">✓</span>';
      h += '</button>';
    });
    h += '</div>';

    h += '<div style="font-weight:bold;color:#ef4444;margin-bottom:6px">🔴 Команда соперника</div>';
    h += '<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:16px">';

    if(oppPick === 'manual') h += '<span style="color:#ef4444">✓</span>';
    h += '</button>';

    teams.forEach(function(t){
      var ok = hasLineup(t);
      var sel = oppPick === t.id;
      h += '<button data-opp="' + t.id + '" ' + (ok ? '' : 'disabled') + ' class="team-card' + (sel ? ' sel-opp' : '') + '">';
      h += '<span class="team-dot" style="background:' + t.c1 + ';border:2px solid ' + t.c2 + '"></span>';
      h += '<span style="flex:1;font-weight:bold">' + t.name + '</span>';

      if(sel) h += '<span style="color:#ef4444">✓</span>';
      h += '</button>';

    h += '<button id="tpCancel" class="btn gray" style="max-width:500px;margin-top:8px">← Назад</button>';

    cont.innerHTML = h;

    cont.querySelectorAll('[data-opp]').forEach(function(b){
      b.onclick = function(){ oppPick = b.getAttribute('data-opp'); render(); };

    document.getElementById('tpGo').onclick = function(){
      if(myPick === 'manual'){
        team1 = 'manual';
        teamGreen = [];
      } else {
        team1 = getTeamById(myPick);
        try { localStorage.setItem('ib_team1', myPick); } catch(e){}
        teamGreen = (team1.lineups[gameMode] || []).slice();
      }
      if(oppPick === 'manual'){
        team2 = 'manual';
        teamRed = [];
      } else {
        team2 = getTeamById(oppPick);
        try { localStorage.setItem('ib_team2', oppPick); } catch(e){}
        teamRed = (team2.lineups[gameMode] || []).slice();

      if(afterDone) afterDone();

      if(afterCancel) afterCancel();
    };
  }

  render();

// ===== СОХРАНЕНИЕ =====
function saveGameToStorage(){
  try {
    var data = {
      fig: fig.map(function(f){
        var o = {};
        for(var k in f){
          if(k === 'px' || k === 'py' || k === '_animating') continue;
          o[k] = f[k];
        }
        return o;
      }),
      ball: ball, turn: turn, sc: sc, over: over,
      webs: webs, presses: presses, holds: holds,
      gameMode: gameMode, teamGreen: teamGreen, teamRed: teamRed,
      pA: pA, pB: pB, hoops: hoops,
      clearFigId: window.__clearFigId
    };
    localStorage.setItem('ib_game', JSON.stringify(data));
    logMsg('💾 Сохранено');
  } catch(e){
    alert('Ошибка сохранения: ' + e.message);
  }
}

function loadGameFromStorage(){
  var raw = localStorage.getItem('ib_game');
  if(!raw){ alert('Нет сохранения'); return false; }

  try {
    var d = JSON.parse(raw);

    fig = d.fig || [];
    ball = d.ball;
    turn = d.turn || 0;
    sc = d.sc || [0,0];
    over = !!d.over;
    webs = d.webs || [];
    presses = d.presses || [];
    holds = d.holds || {};
    gameMode = d.gameMode || '5v5';
    teamGreen = d.teamGreen || [];
    teamRed = d.teamRed || [];
    pA = d.pA || [];
    pB = d.pB || [];
    hoops = d.hoops || [{c:4,r:0},{c:4,r:11}];
    window.__clearFigId = d.clearFigId || null;

    fig.forEach(function(f){
      f.px = undefined;
      f.py = undefined;
      f._animating = false;
      if(!f.dribbleCd) f.dribbleCd = {};
      if(!f.teamCd) f.teamCd = {};
      if(!f.abilityCd) f.abilityCd = {};
      if(f.penalty === undefined) f.penalty = 0;
    });

    sel = null;
    hl = [];
    mode = 'sel';
    pab = null;

    hideAllScreens();
    document.getElementById('game').classList.add('show');
    setupCanvas();
    ui(); draw();
    logMsg('📂 Загружено');
    return true;
  } catch(e){
    alert('Ошибка загрузки: ' + e.message);
    return false;
  }
}

    } catch(e){}

    matches.unshift({
      date: Date.now(),
      myScore: sc[0],

      myTeam: myTeamName,
      oppTeam: oppTeamName,
      mode: gameMode,
      win: win
    });
    if(matches.length > 30) matches.length = 30;

    try { localStorage.setItem('ib_matches', JSON.stringify(matches)); } catch(e){}

    profile.games++;
    if(win) profile.wins++;
    saveProfile();

    logMsg('📊 Матч сохранён в историю');

};

  var cont = document.getElementById('onlineContent');
  cont.innerHTML =
    '<h2 style="text-align:center;margin:8px 0">🌐 Онлайн</h2>' +
    '<div id="ocStatus" style="color:#fbbf24;font-size:13px;text-align:center;margin:8px 0">Подключение к брокеру...</div>' +
    '<div style="text-align:center;color:#94a3b8;font-size:12px;margin-top:14px">Скажи другу код:</div>' +
    '<div class="code-display">' + mqttRoomCode + '</div>' +
    '<div id="ocHint" style="color:#fbbf24;font-size:13px;text-align:center;min-height:20px">Ждём подключения...</div>' +
    '<button id="ocBack" class="btn gray" style="max-width:320px;margin-top:16px">← Назад</button>';

  document.getElementById('ocBack').onclick = function(){
    if(mqttClient){ try { mqttClient.end(); } catch(e){} }

    showMain();
  };

  if(typeof mqtt === 'undefined'){
    setTimeout(startHosting, 800);
    return;
  }

  try {
    mqttClient = mqtt.connect(MQTT_BROKER, {
      clientId: 'host_' + Math.random().toString(36).slice(2, 10),
      keepalive: 30,
      clean: true,
      connectTimeout: 10000
    });
  } catch(e){
    mqttStatus('Ошибка: ' + e.message, '#ef4444');
    return;
  }

  var topic = MQTT_APP + '/room/' + mqttRoomCode;

  mqttClient.on('connect', function(){
    mqttClient.subscribe(topic);
    mqttStatus('🟢 Комната создана!', '#22c55e');
    logMsg('🌐 Комната: ' + mqttRoomCode);
  });

  mqttClient.on('message', function(t, payload){

function connectMqtt(code){
  mqttRoomCode = code;
  mqttStatus('Подключение...', '#fbbf24');

  if(typeof mqtt === 'undefined'){
    setTimeout(function(){ connectMqtt(code); }, 800);
    return;
  }

  try {
    mqttClient = mqtt.connect(MQTT_BROKER, {
      clientId: 'guest_' + Math.random().toString(36).slice(2, 10),
      keepalive: 30,
      clean: true,
      connectTimeout: 10000
    });
  } catch(e){
    mqttStatus('Ошибка: ' + e.message, '#ef4444');
    return;
  }

  var topic = MQTT_APP + '/room/' + code;

  mqttClient.on('connect', function(){
    mqttClient.subscribe(topic);
    mqttStatus('🟢 Подключено! Ищу хоста...', '#22c55e');
    sendNet({type: 'guest_join'});
    setTimeout(function(){
      sendNet({type: 'hello', name: profile.name || 'Игрок', avatar: profile.avatar});
      showOnlinePickScreen();
    }, 700);
  });

  mqttClient.on('message', function(t, payload){
    try {
      var data = JSON.parse(payload.toString());
      handleOnlineMsg(data);
    } catch(e){}
  });

  mqttClient.on('error', function(err){
    mqttStatus('Ошибка MQTT: ' + err.message, '#ef4444');
  });
}

function sendNet(data){
  if(!mqttClient) return;
  try {
    mqttClient.publish(MQTT_APP + '/room/' + mqttRoomCode, JSON.stringify(data));
  } catch(e){}
}

function renderOnlinePick(){
  var div = document.getElementById('onlinePickScr');
  if(!div) return;
  var need = (MODE_PRESETS[gameMode] || MODE_PRESETS['5v5']).count;

  var poolEl = div.querySelector('#osPool');
  poolEl.innerHTML = '';
  Object.keys(F).forEach(function(n){
    var used = onlineMyPicks.indexOf(n) >= 0;
    var b = document.createElement('button');
    b.textContent = (ICONS[n] || '🐜') + ' ' + n;
    b.style.cssText = 'padding:5px 8px;background:#3b82f6;color:#fff;border:0;border-radius:4px;font-size:11px;font-family:inherit;opacity:' + (used ? '0.3' : '1');
    b.disabled = used || onlineMyReady;
    b.onclick = function(){
      if(onlineMyReady) return;
      if(onlineMyPicks.length >= need) return;
      onlineMyPicks.push(n);
      renderOnlinePick();
    };
    poolEl.appendChild(b);
  });

  var picksEl = div.querySelector('#osPicks');
  picksEl.innerHTML = onlineMyPicks.length
    ? onlineMyPicks.map(function(n, i){
        return '<span data-i="' + i + '" style="display:inline-block;background:#22c55e;padding:4px 10px;margin:3px;border-radius:5px;cursor:pointer">' +
          (ICONS[n] || '🐜') + ' ' + n + ' ✖</span>';
      }).join('')
    : '<i style="color:#64748b">Пока пусто</i>';

  picksEl.querySelectorAll('[data-i]').forEach(function(el){
    el.onclick = function(){

      onlineMyPicks.splice(parseInt(el.getAttribute('data-i')), 1);

        stat.textContent = 'Нужно ещё ' + (need - onlineMyPicks.length) + ' фигур';
        stat.style.color = '#ef4444';
        return;

      onlineMyReady = true;
      sendNet({type: 'picks', picks: onlineMyPicks, name: profile.name});
      logMsg('🎨 Мой состав: ' + onlineMyPicks.join(', '));
      renderOnlinePick();
    };
  }

  var oppEl = div.querySelector('#osOpp');
  if(oppEl){
    oppEl.innerHTML = onlineOppAvatar + ' Противник: <b>' + onlineOppName + '</b>' +
      (onlineOppReady ? ' ✅' : '');
  }

  var stat2 = div.querySelector('#osStat');
  if(onlineMyReady && onlineOppReady){
    stat2.textContent = '✅ Оба готовы! Запуск...';
    stat2.style.color = '#22c55e';

}

// ===== СНИМОК / ПРИМЕНЕНИЕ =====
function captureOnlineState(){
  return {
    fig: fig.map(function(f){
      var o = {};
      for(var k in f){
        if(k === 'px' || k === 'py' || k === '_animating') continue;
        o[k] = f[k];
      }
      return o;
    }),
    ball: ball, turn: turn, sc: sc, over: over,
    webs: webs, presses: presses, holds: holds,
    hoops: hoops, gameMode: gameMode,
    clearFigId: window.__clearFigId
  };
}

function applyOnlineState(state){
  if(!state) return;
  onlineStateApplying = true;
  try {
    fig = state.fig || [];
    ball = state.ball;
    turn = state.turn;
    sc = state.sc || [0,0];
    over = !!state.over;
    webs = state.webs || [];
    presses = state.presses || [];
    holds = state.holds || {};
    hoops = state.hoops || hoops;
    if(state.gameMode) gameMode = state.gameMode;
    window.__clearFigId = state.clearFigId || null;

    fig.forEach(function(f){
      f.px = undefined;
      f.py = undefined;
      f._animating = false;
      if(!f.dribbleCd) f.dribbleCd = {};
      if(!f.teamCd) f.teamCd = {};
      if(!f.abilityCd) f.abilityCd = {};
      if(f.penalty === undefined) f.penalty = 0;
    });

    sel = null;
    hl = [];
    mode = 'sel';
    pab = null;
    ui(); draw();
  } finally {
    onlineStateApplying = false;
  }
}

function broadcastState(){
  if(!onlineMatchActive || onlineStateApplying) return;
  sendNet({type: 'state', state: captureOnlineState()});
}

// ===== Перехват startAb =====
var _startAb_new = startAb;
startAb = function(ab){
  var f = byId(sel);
  if(!f) return _startAb_new(ab);

  if(!f.abilityCd) f.abilityCd = {};
  var cd = f.abilityCd[ab.n] || 0;
  if(cd > 0){ logMsg('⏳ ' + ab.n + ': кулдаун ' + cd); return; }
  if(ab.u && f.us.indexOf(ab.n) >= 0){ logMsg('⏳ ' + ab.n + ' уже использована'); return; }

  // ===== Пост-ап (Жук-носорог) =====
  if(ab.m === 'post_up'){
    // Ищем защитника в радиусе 1
    var def = fig.find(function(g){
      return g.t !== f.t && g.c >= 0 && dist(g.c, g.r, f.c, f.r) === 1;
    });
    if(!def){ logMsg('Нужен защитник рядом'); return; }

    f.o -= ab.c;
    f.abilityCd[ab.n] = ABILITY_CD.post_up;

    var r1 = f.s + Math.floor(Math.random()*6) + 1;
    var r2 = def.s + Math.floor(Math.random()*6) + 1;
    logMsg('🦏 Пост-ап ' + r1 + ' vs ' + r2);

    if(r1 > r2){
      // Оттолкнуть и получить бонус
      var a = toAx(f.c, f.r), b = toAx(def.c, def.r);
      var dq = Math.sign(b.q - a.q), dr = Math.sign(b.r - a.r);
      var tp = toOff(b.q + dq, b.r + dr);
      if(tp.c >= 0 && tp.c < COLS && tp.r >= 0 && tp.r < ROWS && !figAt(tp.c, tp.r)){
        def.c = tp.c; def.r = tp.r;
        def.px = undefined; def.py = undefined;
      }
      f.shootBonus = (f.shootBonus || 0) + 2;
      logMsg('✓ Оттолкнул! +2 к броску');
      popText('💪', cen(f.c, f.r).x, cen(f.c, f.r).y - 30, '#f59e0b', 26);
      burst(cen(f.c, f.r).x, cen(f.c, f.r).y, '#f59e0b', 15, 3);
    } else {
      logMsg('✗ Не оттолкнул');
    }
    if(f.o <= 0) end(); else { ui(); draw(); }
    return;
  }

  // ===== Разворот (Жук-олень) =====
  if(ab.m === 'stance'){
    f.o -= ab.c;
    f.z += 2;
    f.defBuff = (f.defBuff || 0) + 2;
    f.abilityCd[ab.n] = ABILITY_CD.stance;
    logMsg('🛡 Разворот! +2 к защите');
    popText('🛡 +2', cen(f.c, f.r).x, cen(f.c, f.r).y - 30, '#0ea5e9', 18);
    if(f.o <= 0) end(); else { ui(); draw(); }
    return;
  }

  // ===== Быстрый релиз (Шершень) =====
  if(ab.m === 'quick_release'){
    if(ball !== f.i){ logMsg('Нужен мяч'); return; }
    f.o -= ab.c;
    f.abilityCd[ab.n] = ABILITY_CD.quick_release;
    f.quickRelease = 1;
    logMsg('⚡ Быстрый релиз! След. бросок не блокируется');
    popText('⚡', cen(f.c, f.r).x, cen(f.c, f.r).y - 30, '#fbbf24', 20);
    if(f.o <= 0) end(); else { ui(); draw(); }
    return;
  }

  // ===== Видение площадки (Сверчок) =====
  if(ab.m === 'vision'){
    f.o -= ab.c;
    f.abilityCd[ab.n] = ABILITY_CD.vision;
    var cnt = 0;
    fig.forEach(function(g){
      if(g.t === f.t && g.c >= 0){
        g.shootBonus = (g.shootBonus || 0) + 2;
        cnt++;
      }
    });
    logMsg('👁 Видение! +2 к броску всей команде (' + cnt + ')');
    burst(cen(f.c, f.r).x, cen(f.c, f.r).y, '#22c55e', 20, 4);
    if(f.o <= 0) end(); else { ui(); draw(); }
    return;
  }

  // ===== Смена рук (Водомерка) =====
  if(ab.m === 'sure_handles'){
    if(ball !== f.i){ logMsg('Нужен мяч'); return; }
    var defs = fig.filter(function(g){
      return g.t !== f.t && g.c >= 0 && dist(g.c, g.r, f.c, f.r) === 1;
    });
    if(!defs.length){ logMsg('Нет защитника рядом'); return; }

    f.o -= ab.c;
    f.abilityCd[ab.n] = ABILITY_CD.sure_handles;

    // Находим гекс за защитником
    var def0 = defs[0];
    var myAx = toAx(f.c, f.r);
    var dirs = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
    var target = null;
    dirs.forEach(function(d){
      var midOff = toOff(myAx.q + d[0], myAx.r + d[1]);
      if(midOff.c < 0 || midOff.c >= COLS || midOff.r < 0 || midOff.r >= ROWS) return;
      var midFig = figAt(midOff.c, midOff.r);
      if(!midFig || midFig.i !== def0.i) return;
      for(var st = 1; st <= 2; st++){
        var tOff = toOff(myAx.q + d[0]*(1+st), myAx.r + d[1]*(1+st));
        if(tOff.c < 0 || tOff.c >= COLS || tOff.r < 0 || tOff.r >= ROWS) break;
        if(figAt(tOff.c, tOff.r)) continue;
        if(!target) target = tOff;
      }
    });
    if(!target){ logMsg('Негде пройти'); f.o += ab.c; return; }

    var fromC = f.c, fromR = f.r;
    f.c = target.c;
    f.r = target.r;
    f.px = undefined; f.py = undefined;
    f.mv = true;
    ghostTrail(f, fromC, fromR, target.c, target.r, 'rgba(6,182,212,0.7)', 8);
    logMsg('🌊 Смена рук — прошёл сквозь!');
    popText('🌊', cen(target.c, target.r).x, cen(target.c, target.r).y - 30, '#06b6d4', 22);
    if(f.o <= 0) end(); else { ui(); draw(); }
    return;
  }

  // ===== Разворот-фейдэвей (Оса-охотница) =====
  if(ab.m === 'fadeaway'){
    if(ball !== f.i){ logMsg('Нужен мяч'); return; }
    f.o -= ab.c;
    f.abilityCd[ab.n] = ABILITY_CD.fadeaway;
    f.fadeawayShot = 1;
    logMsg('🎯 Разворот! След. бросок не блокируется');
    popText('🎯', cen(f.c, f.r).x, cen(f.c, f.r).y - 30, '#dc2626', 20);
    if(f.o <= 0) end(); else { ui(); draw(); }
    return;
  }

  // ===== Постер-данк (Жук-титан) =====
  if(ab.m === 'poster_dunk'){
    if(ball !== f.i){ logMsg('Нужен мяч'); return; }
    var hoop = hoops[1 - f.t];
    var dHoop = dist(f.c, f.r, hoop.c, hoop.r);
    if(dHoop > 1){ logMsg('Слишком далеко от кольца'); return; }

    var def = fig.find(function(g){
      return g.t !== f.t && g.c >= 0 && dist(g.c, g.r, f.c, f.r) === 1;
    });
    if(!def){ logMsg('Нужен защитник рядом'); return; }

    f.o -= ab.c;
    f.abilityCd[ab.n] = ABILITY_CD.poster_dunk;

    var hp = cen(hoop.c, hoop.r);
    var scPx = cen(f.c, f.r);
    ball = null;

    if(Math.random() < 0.5){
      // ПОСТЕР + фол
      def.fouls = (def.fouls || 0) + 1;
      logMsg('💥 ПОСТЕР-ДАНК + ФОЛ на ' + def.n + '!');
      popText('💥 ПОСТЕР!', scPx.x, scPx.y - 40, '#ef4444', 26);
      flyBall(scPx.x, scPx.y, hp.x, hp.y, function(){
        sc[f.t] += 2;
        popText('+2!', hp.x, hp.y - 22, '#22c55e', 30);
        burst(hp.x, hp.y, '#ef4444', 30, 4);
        burst(hp.x, hp.y, '#fbbf24', 20, 3);
        logMsg('💥 +2 и штрафной');
        if(def.fouls >= 5) sendToPenalty(def, 3);
        setTimeout(function(){
          shootFreeThrows(f.t, 1);
          if(sc[f.t] >= 21){ over = true; ui(); draw(); return; }
          resetPositions(f.t);
        }, 700);
      });
    } else {
      // Обычный данк
      flyBall(scPx.x, scPx.y, hp.x, hp.y, function(){
        sc[f.t] += 2;
        popText('+2!', hp.x, hp.y - 22, '#22c55e', 28);
        logMsg('✓ ДАНК! +2');
        setTimeout(function(){
          if(sc[f.t] >= 21){ over = true; ui(); draw(); return; }
          resetPositions(f.t);
        }, 600);
      });
    }
    return;
  }

  // ===== Смена темпа (Огн.муха) =====
  if(ab.m === 'reset_cd'){
    if(ball !== f.i){ logMsg('Нужен мяч'); return; }
    f.o -= ab.c;
    f.abilityCd[ab.n] = ABILITY_CD.reset_cd;

    // Сбросить все кулдауны дриблинга
    if(f.dribbleCd){
      Object.keys(f.dribbleCd).forEach(function(k){
        f.dribbleCd[k] = 0;
      });
    }
    logMsg('🔥 Смена темпа! Все приёмы дриблинга готовы');
    popText('🔥 RESET', cen(f.c, f.r).x, cen(f.c, f.r).y - 30, '#f97316', 18);
    if(f.o <= 0) end(); else { ui(); draw(); }
    return;
  }

  // ===== Вспышка (Огн.муха) =====
  if(ab.m === 'flash_steal'){
    var bh = byId(ball);
    if(!bh || bh.t === f.t){ logMsg('Нет мяча у врага'); return; }
    if(dist(f.c, f.r, bh.c, bh.r) > 2){ logMsg('Слишком далеко'); return; }

    f.o -= ab.c;
    f.us.push(ab.n);
    f.abilityCd[ab.n] = 99;

    ball = f.i;
    delete holds[bh.i];
    logMsg('⚡ Вспышка! Мяч у ' + f.n);
    popText('⚡ УКРАЛ!', cen(f.c, f.r).x, cen(f.c, f.r).y - 30, '#f97316', 22);
    burst(cen(bh.c, bh.r).x, cen(bh.c, bh.r).y, '#f97316', 20, 4);

    if(f.o <= 0) end(); else { ui(); draw(); }
    return;
  }

  return _startAb_new(ab);
};

// Скрин-мастер (Жук-носорог) + Кетч-энд-шут (Шершень) + Флоатер-мастер (Оса)
var _doShoot_new = doShoot;
doShoot = function(){
  var f = byId(sel);
  if(f){
    // Скрин-мастер: +1 за каждого союзника рядом
    var screenBonus = 0;
    fig.forEach(function(g){
      if(g.t === f.t && g.i !== f.i && g.c >= 0 && dist(g.c, g.r, f.c, f.r) <= 1){
        if((g.ab || []).some(function(a){ return a.tag === 'screen_master'; })) screenBonus += 1;
      }
    });
    if(screenBonus){
      f.b += screenBonus;
      logMsg('🦏 Скрин-мастер +' + screenBonus);
      var r = _doShoot_new();
      setTimeout(function(){ f.b -= screenBonus; }, 200);
      return r;
    }

    // Кетч-энд-шут: +2 если получал пас в этом ходу
    if((f.ab || []).some(function(a){ return a.tag === 'catch_shoot'; }) && f.receivedPass){
      f.b += 2;
      logMsg('🎯 Кетч-энд-шут +2');
      f.receivedPass = 0;
      var r2 = _doShoot_new();
      setTimeout(function(){ f.b -= 2; }, 200);
      return r2;
    }

    // Быстрый релиз / Фейдэвей — не блокируется
    if(f.quickRelease || f.fadeawayShot){
      var saveCheckBlock = checkBlock;
      checkBlock = function(){ return null; };
      f.quickRelease = 0;
      f.fadeawayShot = 0;
      var r3 = _doShoot_new();
      setTimeout(function(){ checkBlock = saveCheckBlock; }, 100);
      return r3;
    }
  }
  return _doShoot_new();
};

// Флоатер-мастер
var _doFloater_new = doFloater;
doFloater = function(){
  var f = byId(sel);
  if(f && (f.ab || []).some(function(a){ return a.tag === 'floater_master'; })){
    f.b += 1;
    logMsg('🎯 Флоатер-мастер +1');
    var r = _doFloater_new();
    setTimeout(function(){ f.b -= 1; }, 200);
    return r;
  }
  return _doFloater_new();
};

// Стена (Жук-олень) — блок со 2 гексов
var _checkBlock_new = checkBlock;
checkBlock = function(shooter){
  var blockers = fig.filter(function(g){
    if(g.t === shooter.t || g.c < 0) return false;
    var d = dist(g.c, g.r, shooter.c, shooter.r);
    // Обычный блок с 1 гекса
    if(d === 1) return true;
    // Стена — со 2 гексов
    if(d === 2 && (g.ab || []).some(function(a){ return a.tag === 'wall'; })) return true;
    return false;
  });

  for(var i = 0; i < blockers.length; i++){
    var b = blockers[i];
    if(b.o < 1) continue;
    var d = dist(b.c, b.r, shooter.c, shooter.r);
    // Штраф за дистанцию
    var pen = (d === 2) ? -1 : 0;
    var bonus = (b.ab && b.ab.some(function(a){ return a.n === 'Стоппер'; })) ? 1 : 0;
    var atk = b.s + bonus + pen + Math.floor(Math.random()*6) + 1;
    var def = shooter.s + Math.floor(Math.random()*6) + 1;
    logMsg('🛡 Блок ' + b.n + ' (дист. ' + d + ') ' + atk + ' vs ' + def);
    if(atk >= def){
      b.o = Math.max(0, b.o - 1);
      return b;
    }
  }
  return null;
};

// Разгон (Сверчок) — пас без перехвата после движения 3+
var _doPass_new = doPass;
doPass = function(targetId){
  var f = byId(sel);
  if(f && (f.ab || []).some(function(a){ return a.tag === 'rush'; }) && f.movedGexs >= 3){
    f.movedGexs = 0;
    // Обходим проверку перехвата
    var t = byId(targetId);
    if(t){
      var from = cen(f.c, f.r), to = cen(t.c, t.r);
      ball = null;
      f.o -= 1;
      flyBall(from.x, from.y, to.x, to.y, function(){
        ball = targetId;
        if(t) t.receivedPass = 1;
        logMsg('🦗 Разгон: пас без перехвата');
        mode='sel'; hl=[];
        if(f.o <= 0) end(); else { reHL(); ui(); draw(); }
      });
      return;
    }
  }
  return _doPass_new(targetId);
};

// Отслеживание движения (для Разгона)
var _hc_move = handleClick;
handleClick = function(c, r){
  var f = sel !== null ? byId(sel) : null;
  var beforeC = f ? f.c : 0, beforeR = f ? f.r : 0;
  _hc_move(c, r);
  if(f && (f.c !== beforeC || f.r !== beforeR)){
    f.movedGexs = (f.movedGexs || 0) + 1;
  }
};

// Иммунитет (Жук-титан) — не отбрасывается и не замораживается
var _execAb_immune = execAb;
execAb = function(t){
  if(t.m === 'enemy'){
    var target = byId(t.id);
    if(target && (target.ab || []).some(function(a){ return a.tag === 'immune'; })){
      if(pab && (pab.m === 'push' || pab.m === 'freeze')){
        logMsg('💪 ' + target.n + ': иммунитет!');
        popText('🛡 IMMUNE', cen(target.c, target.r).x, cen(target.c, target.r).y - 30, '#a855f7', 18);
        pab = null; mode = 'sel'; hl = [];
        var f = byId(sel);
        if(f && f.o <= 0) end(); else { reHL(); ui(); draw(); }
        return;
      }
    }
  }
  return _execAb_immune(t);
};

   ПАТЧ C: ИИ УЧИТЫВАЕТ ОСОБЕННОСТИ ФИГУР
   ============================================================ */

// Таблица предпочтений: какую тактику любит фигура
function aiGetStyle(f){
  var style = {preferThree: 0, preferDunk: 0, preferFloater: 0, preferPost: 0, preferPass: 0};
  if(!f.ab) return style;

  // Снайперы трёшек
  if(f.b >= 5 || (f.ab || []).some(function(a){ return a.tag === 'catch_shoot'; })) style.preferThree += 2;
  if((f.ab || []).some(function(a){ return a.n === 'Дальнобой'; })) style.preferThree += 1;
  if(f.n === 'Водомерка' || f.n === 'Шершень' || f.n === 'Оса-охотница') style.preferThree += 1;

  // Данкеры
  if(f.s >= 5) style.preferDunk += 1;
  if(f.n === 'Жук-титан' || f.n === 'Жук-носорог') style.preferDunk += 2;

  // Флоатеры
  if((f.ab || []).some(function(a){ return a.tag === 'floater_master'; })) style.preferFloater += 2;

  // Пост / сила
  if(f.s >= 6) style.preferPost += 2;

  // Разыгрывающие
  if((f.ab || []).some(function(a){ return a.n === 'Видение' || a.n === 'Имп.пас'; })) style.preferPass += 2;
  if(f.n === 'Сверчок' || f.n === 'Королева ос') style.preferPass += 1;

  return style;
}

// Проверка: фигура открыта для броска?
function aiIsOpenForThree(f, hoop){
  var d = dist(f.c, f.r, hoop.c, hoop.r);
  if(d < 4) return false;
  // Нет защитников в радиусе 2
  var near = fig.filter(function(g){
    return g.t !== f.t && g.c >= 0 && dist(g.c, g.r, f.c, f.r) <= 1;
  });
  return near.length === 0;
}

// Проверка: трёшка "открыта через заслон"?
function aiHasScreenFor(f, hoop){
  // Есть ли союзник с скрин-мастером рядом?
  var hasScreen = fig.some(function(g){
    return g.t === f.t && g.i !== f.i && g.c >= 0 && dist(g.c, g.r, f.c, f.r) <= 1
      && (g.ab || []).some(function(a){ return a.tag === 'screen_master'; });
  });
  return hasScreen;
}

// Перехват aiGeniusWithBall для сложного ИИ
var _aiGeniusWithBall_style = aiGeniusWithBall;
aiGeniusWithBall = async function(f, h){
  var style = aiGetStyle(f);
  var d = dist(f.c, f.r, h.c, h.r);
  var near = aiEnemiesAround(f, 1);
  var pressure = near.length >= 1;
  var doubleTeam = near.length >= 2;

  // ПРОВЕРКА СТИЛЯ: если любит трёшки и открыт — бросать!
  if(style.preferThree > 0 && d >= 4 && d <= 6 && !doubleTeam && f.o >= 2){
    var isOpen = aiIsOpenForThree(f, h);
    var hasScreen = aiHasScreenFor(f, h);

    if(isOpen || hasScreen){
      // Бонус за стиль
      var bonusText = isOpen ? 'открыт' : 'через заслон';
      logMsg('🧠 ' + f.n + ': трёшка ' + bonusText);
      doShoot();
      await aiSleep(1400);
      return 'shot';
    }
  }

  // ПРОВЕРКА СТИЛЯ: любит данки + защитник рядом → постер
  if(style.preferDunk > 0 && d <= 1 && f.o >= 2){
    if(f.n === 'Жук-титан' && pressure){
      var hasPoster = (f.ab || []).some(function(a){ return a.n === 'Постер-данк'; });
      var posterReady = f.abilityCd && (!f.abilityCd['Постер-данк'] || f.abilityCd['Постер-данк'] === 0);
      if(hasPoster && posterReady && f.o >= 2){
        logMsg('🧠 ' + f.n + ': ПОСТЕР-ДАНК!');
        var hoop = hoops[1 - f.t];
        var def = near[0];

        f.o -= 2;
        f.abilityCd['Постер-данк'] = ABILITY_CD.poster_dunk;

        var hp = cen(hoop.c, hoop.r);
        var scPx = cen(f.c, f.r);
        ball = null;

        if(Math.random() < 0.5){
          def.fouls = (def.fouls || 0) + 1;
          flyBall(scPx.x, scPx.y, hp.x, hp.y, function(){
            sc[f.t] += 2;
            popText('💥 ПОСТЕР!', hp.x, hp.y - 40, '#ef4444', 28);
            burst(hp.x, hp.y, '#ef4444', 30, 4);
            if(def.fouls >= 5) sendToPenalty(def, 3);
            setTimeout(function(){
              shootFreeThrows(f.t, 1);
              if(sc[f.t] >= 21){ over = true; ui(); draw(); return; }
              resetPositions(f.t);
            }, 700);
          });
        } else {
          flyBall(scPx.x, scPx.y, hp.x, hp.y, function(){
            sc[f.t] += 2;
            setTimeout(function(){
              if(sc[f.t] >= 21){ over = true; ui(); draw(); return; }
              resetPositions(f.t);
            }, 600);
          });
        }
        await aiSleep(1500);
        return 'shot';
      }
    }
  }

  // ПРОВЕРКА СТИЛЯ: пост-ап для силовых
  if(style.preferPost > 0 && pressure && f.o >= 2 && d <= 2){
    var hasPost = (f.ab || []).some(function(a){ return a.n === 'Пост-ап'; });
    var postReady = f.abilityCd && (!f.abilityCd['Пост-ап'] || f.abilityCd['Пост-ап'] === 0);
    if(hasPost && postReady){
      logMsg('🧠 ' + f.n + ': Пocт-ап');
      var ab = f.ab.find(function(a){ return a.n === 'Пост-ап'; });
      pab = ab;
      f.o -= ab.c;
      f.abilityCd[ab.n] = ABILITY_CD.post_up;

      var def2 = near[0];
      var r1 = f.s + Math.floor(Math.random()*6) + 1;
      var r2 = def2.s + Math.floor(Math.random()*6) + 1;

      if(r1 > r2){
        var a = toAx(f.c, f.r), b = toAx(def2.c, def2.r);
        var dq = Math.sign(b.q - a.q), dr = Math.sign(b.r - a.r);
        var tp = toOff(b.q + dq, b.r + dr);
        if(tp.c >= 0 && tp.c < COLS && tp.r >= 0 && tp.r < ROWS && !figAt(tp.c, tp.r)){
          def2.c = tp.c; def2.r = tp.r;
          def2.px = undefined; def2.py = undefined;
        }
        f.shootBonus = (f.shootBonus || 0) + 2;
        logMsg('🧠 Пост-ап успех!');
      }
      pab = null;
      ui(); draw();
      await aiSleep(500);
      return 'move';
    }
  }

  // Проверка на видение (Сверчок) если команда отстаёт
  if(style.preferPass > 0 && f.o >= 3){
    var myScore = sc[f.t], oppScore = sc[1 - f.t];
    var visionReady = (f.ab || []).some(function(a){ return a.n === 'Видение'; });
    var visionCd = f.abilityCd && (!f.abilityCd['Видение'] || f.abilityCd['Видение'] === 0);
    if(visionReady && visionCd && (myScore < oppScore || f.o >= 4)){
      // Кастуем видение
      f.o -= 2;
      f.abilityCd['Видение'] = ABILITY_CD.vision;
      var cnt = 0;
      fig.forEach(function(g){
        if(g.t === f.t && g.c >= 0){
          g.shootBonus = (g.shootBonus || 0) + 2;
          cnt++;
        }
      });
      logMsg('🧠 Видение! +2 всей команде');
      ui(); draw();
      await aiSleep(400);
      return 'move';
    }
  }

  // Возврат к базовой логике
  return await _aiGeniusWithBall_style(f, h);
};

// Перехват для среднего ИИ тоже
var _aiWithBall_style = aiWithBall;
aiWithBall = async function(f){
  var style = aiGetStyle(f);
  var h = hoops[0];
  var d = aiHoopDist(f.c, f.r);

  // Снайперы бросают трёшки если открыты
  if(style.preferThree > 0 && d >= 4 && d <= 6 && f.o >= 2 && aiChance(0.7)){
    var near = aiEnemiesAround(f, 1);
    if(!near.length){
      logMsg('🧠 ' + f.n + ': открытая трёшка');
      doShoot();
      await aiSleep(1200);
      return 'shot';
    }
  }

  return await _aiWithBall_style(f);
};

var _renderPool_withNew = renderPool;
renderPool = function(){
  _renderPool_withNew();

  // Находим кнопки новых фигур и добавляем маркер
  var pool = document.getElementById('pool');
  if(!pool) return;

  var buttons = pool.querySelectorAll('button');
  Array.prototype.forEach.call(buttons, function(b){
    var txt = b.textContent || '';
    for(var i = 0; i < NEW_FIG_NAMES.length; i++){
      var n = NEW_FIG_NAMES[i];
      if(txt.indexOf(n) >= 0 && txt.indexOf('✨') < 0){
        // Добавляем звёздочку новизны
        if(F[n].p && b.textContent){
          b.innerHTML = '✨ ' + F[n].p + ' ' + n;
          b.style.border = '1px solid #fbbf24';
        }
        break;
      }
    }
  });

  // Показываем счётчик
  var existing = document.getElementById('newFigsHint');
  if(!existing){
    var hint = document.createElement('div');
    hint.id = 'newFigsHint';
    hint.style.cssText = 'color:#fbbf24;font-size:11px;width:100%;text-align:center;margin:4px 0';
    hint.textContent = '✨ ' + NEW_FIG_NAMES.length + ' новых фигур добавлено';
    pool.parentNode.insertBefore(hint, pool);
  }
};

/* ============================================================
   ПАТЧ: ПУЛЫ ФИГУР ПО ПОЗИЦИЯМ
   ============================================================ */

var POS_ORDER = ['PG','SG','SF','PF','C'];
var POS_FULL = {PG:'Разыгрывающие', SG:'Атакующие', SF:'Лёгкие форварды', PF:'Тяжёлые форварды', C:'Центровые'};
var POS_COLOR = {PG:'#3b82f6', SG:'#f59e0b', SF:'#22c55e', PF:'#ef4444', C:'#a855f7'};

// Хелпер: сгруппировать по позициям
function groupFigsByPos(){
  var groups = {PG:[], SG:[], SF:[], PF:[], C:[]};
  Object.keys(F).forEach(function(n){
    var pos = F[n].p;
    if(groups[pos]) groups[pos].push(n);
  });
  return groups;
}

// Хелпер: рендер одной группы с заголовком
function renderPosGroup(container, pos, names, need, isUsed, onPick, myPicks){
  if(!names.length) return;

  var header = document.createElement('div');
  header.style.cssText = 'width:100%;display:flex;align-items:center;gap:6px;margin:8px 0 4px;font-size:12px;font-weight:bold;color:' + POS_COLOR[pos];
  header.innerHTML =
    '<span style="background:' + POS_COLOR[pos] + ';color:#fff;padding:2px 8px;border-radius:6px;font-size:11px">' + pos + '</span>' +
    '<span style="color:#94a3b8;font-weight:normal;font-size:11px">' + POS_FULL[pos] + '</span>';
  container.appendChild(header);

  var row = document.createElement('div');
  row.style.cssText = 'display:flex;flex-wrap:wrap;gap:3px;width:100%;margin-bottom:4px';

  names.forEach(function(n){
    var used = isUsed(n);
    var b = document.createElement('button');
    b.textContent = (ICONS[n] || '🐜') + ' ' + n;
    b.disabled = used;
    b.style.cssText = 'padding:5px 8px;background:' + POS_COLOR[pos] + ';color:#fff;border:0;border-radius:4px;font-size:11px;cursor:pointer;font-family:inherit;opacity:' + (used ? '0.25' : '1');
    b.onclick = function(){ onPick(n); };
    row.appendChild(b);
  });

  container.appendChild(row);
}

// ===== ПЕРЕОПРЕДЕЛЯЕМ renderPool (локал + ИИ) =====
var _renderPool_positions = renderPool;
renderPool = function(){
  var need = (MODE_PRESETS[gameMode] || MODE_PRESETS['5v5']).count;
  var isAI = aiEnabled;
  var pool = document.getElementById('pool');
  if(!pool) return;
  pool.innerHTML = '';

  // Фигуры, которые уже выбраны
  var usedSet = {};
  teamGreen.forEach(function(n){ usedSet[n] = true; });
  teamRed.forEach(function(n){ usedSet[n] = true; });

  // Группы
  var groups = groupFigsByPos();

  POS_ORDER.forEach(function(pos){
    renderPosGroup(
      pool,
      pos,
      groups[pos],
      need,
      function(n){ return !!usedSet[n]; },
      function(n){
        if(pickingTeam === 0 && teamGreen.length < need){
          teamGreen.push(n);
          if(teamGreen.length >= need && !isAI) pickingTeam = 1;
        } else if(!isAI && pickingTeam === 1 && teamRed.length < need){
          teamRed.push(n);
        }
        renderPool();
        updateSetupButtons();
      }
    );
  });

  // Зелёные (chips)
  var tg = document.getElementById('tg');
  if(tg){
    tg.innerHTML = teamGreen.length
      ? teamGreen.map(function(n, i){
          return '<span class="chip g" data-g="' + i + '">' + (ICONS[n]||'🐜') + ' ' + n + ' ×</span>';
        }).join('')
      : '—';
    tg.querySelectorAll('[data-g]').forEach(function(el){
      el.onclick = function(){
        teamGreen.splice(parseInt(el.getAttribute('data-g')), 1);
        pickingTeam = 0;
        renderPool(); updateSetupButtons();
      };
    });
  }

  // Красные (chips)
  var tr = document.getElementById('tr');
  if(tr){
    if(isAI){
      tr.innerHTML = '<i style="color:#94a3b8">ИИ выберет сам</i>';
    } else {
      tr.innerHTML = teamRed.length
        ? teamRed.map(function(n, i){
            return '<span class="chip r" data-r="' + i + '">' + (ICONS[n]||'🐜') + ' ' + n + ' ×</span>';
          }).join('')
        : '—';
      tr.querySelectorAll('[data-r]').forEach(function(el){
        el.onclick = function(){
          teamRed.splice(parseInt(el.getAttribute('data-r')), 1);
          pickingTeam = 1;
          renderPool(); updateSetupButtons();
        };
      });
    }
  }

  var who = document.getElementById('who');
  if(who){
    who.textContent = isAI
      ? 'Зелёные (ты) — ' + gameMode
      : (pickingTeam === 0 ? 'Зелёные' : 'Красные') + ' (' + gameMode + ')';
  }
};

// ===== ПЕРЕОПРЕДЕЛЯЕМ renderOnlinePick (онлайн) =====
var _renderOnlinePick_positions = renderOnlinePick;
renderOnlinePick = function(){
  var div = document.getElementById('onlinePickScr');
  if(!div) return;
  var need = (MODE_PRESETS[gameMode] || MODE_PRESETS['5v5']).count;

  // Перебираем группу по позициям
  var groups = groupFigsByPos();

  var poolEl = div.querySelector('#osPool');
  poolEl.innerHTML = '';
  poolEl.style.cssText = 'display:flex;flex-direction:column;gap:2px;margin-bottom:14px';

  POS_ORDER.forEach(function(pos){
    if(!groups[pos].length) return;

    var header = document.createElement('div');
    header.style.cssText = 'display:flex;align-items:center;gap:6px;margin:8px 0 4px;font-size:12px;font-weight:bold;color:' + POS_COLOR[pos];
    header.innerHTML =
      '<span style="background:' + POS_COLOR[pos] + ';color:#fff;padding:2px 8px;border-radius:6px;font-size:11px">' + pos + '</span>' +
      '<span style="color:#94a3b8;font-weight:normal;font-size:11px">' + POS_FULL[pos] + '</span>';
    poolEl.appendChild(header);

    var row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;gap:3px;width:100%;margin-bottom:4px';

    groups[pos].forEach(function(n){
      var used = onlineMyPicks.indexOf(n) >= 0;
      var b = document.createElement('button');
      b.textContent = (ICONS[n] || '🐜') + ' ' + n;
      b.style.cssText = 'padding:5px 8px;background:' + POS_COLOR[pos] + ';color:#fff;border:0;border-radius:4px;font-size:11px;font-family:inherit;opacity:' + (used ? '0.25' : '1') + ';cursor:pointer';
      b.disabled = used || onlineMyReady;
      b.onclick = function(){
        if(onlineMyReady) return;
        if(onlineMyPicks.length >= need) return;
        onlineMyPicks.push(n);
        renderOnlinePick();
      };
      row.appendChild(b);
    });

    poolEl.appendChild(row);
  });

  // Выбранные
  var picksEl = div.querySelector('#osPicks');
  picksEl.innerHTML = onlineMyPicks.length
    ? onlineMyPicks.map(function(n, i){
        return '<span data-i="' + i + '" style="display:inline-block;background:#22c55e;padding:4px 10px;margin:3px;border-radius:5px;cursor:pointer">' +
          (ICONS[n] || '🐜') + ' ' + n + ' ✖</span>';
      }).join('')
    : '<i style="color:#64748b">Пока пусто</i>';

  picksEl.querySelectorAll('[data-i]').forEach(function(el){
    el.onclick = function(){
      if(onlineMyReady) return;
      onlineMyPicks.splice(parseInt(el.getAttribute('data-i')), 1);
      renderOnlinePick();
    };
  });

  // Кнопка готов
  var btn = div.querySelector('#osReady');
  if(onlineMyReady){
    btn.textContent = '✅ Готово! Ждём противника...';
    btn.style.background = '#22c55e';
    btn.disabled = true;
  } else {
    btn.textContent = 'Готов (' + onlineMyPicks.length + '/' + need + ')';
    btn.style.background = onlineMyPicks.length === need ? '#22c55e' : '#e94560';
    btn.onclick = function(){
      if(onlineMyReady) return;
      if(onlineMyPicks.length < need){
        var stat = div.querySelector('#osStat');
        stat.textContent = 'Нужно ещё ' + (need - onlineMyPicks.length) + ' фигур';
        stat.style.color = '#ef4444';
        return;
      }
      onlineMyReady = true;
      sendNet({type: 'picks', picks: onlineMyPicks, name: profile.name});
      logMsg('🎨 Мой состав: ' + onlineMyPicks.join(', '));
      renderOnlinePick();
    };
  }

  // Инфо о противнике
  var oppEl = div.querySelector('#osOpp');
  if(oppEl){
    oppEl.innerHTML = onlineOppAvatar + ' Противник: <b>' + onlineOppName + '</b>' +
      (onlineOppReady ? ' ✅' : '');
  }

  var stat2 = div.querySelector('#osStat');
  if(onlineMyReady && onlineOppReady){
    stat2.textContent = '✅ Оба готовы! Запуск...';
    stat2.style.color = '#22c55e';
    setTimeout(startOnlineMatch, 800);
  } else if(onlineMyReady){
    stat2.textContent = 'Ты готов. Ждём противника...';
    stat2.style.color = '#fbbf24';
  } else if(onlineOppReady){
    stat2.textContent = 'Противник готов! Собери свой состав.';
    stat2.style.color = '#fbbf24';
  }
};
