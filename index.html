let dribbleType = '';

// ===== ПОСТРОЕНИЕ ЦЕЛЕЙ ПРОХОДА =====
// Ищем гекс ЗА защитником ближе к кольцу
function buildDribbleTargets(maxDist){
  const f = byId(sel);
  const targets = [];
  if(!f) return targets;

  const myAx = toAx(f.c, f.r);
  const dirs = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];

  dirs.forEach(d => {
    // Соседняя клетка — там должен быть защитник
    const midOff = toOff(myAx.q + d[0], myAx.r + d[1]);
    if(midOff.c < 0 || midOff.c >= COLS ||
       midOff.r < 0 || midOff.r >= ROWS) return;

    const def = figAt(midOff.c, midOff.r);
    if(!def || def.t === f.t) return;

    // Ищем гекс ЗА защитником
    for(let st = 1; st <= maxDist; st++){
      const tOff = toOff(
        myAx.q + d[0] * (1 + st),
        myAx.r + d[1] * (1 + st)
      );
      if(tOff.c < 0 || tOff.c >= COLS ||
         tOff.r < 0 || tOff.r >= ROWS) break;
      if(figAt(tOff.c, tOff.r)) break;

      targets.push({
        c: tOff.c,
        r: tOff.r,
        m: 'dribble',
        defId: def.i,
        steps: st
      });
    }
  });
  return targets;
}

// ===== ВЫБОР ПРИЁМА =====
pickDribble = function(dr){
  const f = byId(sel);
  if(!f || ball !== f.i) return;
  if(f.o < dr.c){ logMsg('Мало ОД'); return; }

  if(!f.dribbleCd) f.dribbleCd = {};
  if(f.dribbleCd[dr.m] > 0){
    logMsg('⏳ ' + dr.n + ' на кулдауне ' + f.dribbleCd[dr.m]);
    return;
  }
  if(f.d < dr.req){
    logMsg('⚠ ' + dr.n + ' требует Дри ' + dr.req);
    return;
  }

  // Проверка — есть ли защитник рядом
  if(dr.needDef){
    const defs = fig.filter(g =>
      g.t !== f.t && g.c >= 0 && dist(g.c, g.r, f.c, f.r) === 1
    );
    if(!defs.length){
      logMsg('Нет защитника рядом');
      return;
    }
  }

  // === ДВИЖЕНИЯ (cross, spin, euro, ankle) ===
  if(dr.move){
    dribbleType = dr.m;
    mode = 'dribbleTarget';
    hl = buildDribbleTargets(dr.dist);

    if(!hl.length){
      logMsg('Негде пройти');
      mode = 'sel'; hl = [];
      ui(); draw();
      return;
    }
    ui(); draw();
    return;
  }

  // === ЭФФЕКТЫ БЕЗ ДВИЖЕНИЯ (between, stepback, hesi) ===
  f.o -= dr.c;

  if(dr.m === 'between'){
    f.shootBonus = (f.shootBonus || 0) + 2;
    logMsg('🏀 Между ног: +2 к броску');
    popText('+2', cen(f.c, f.r).x, cen(f.c, f.r).y - 25, '#22c55e', 16);
  }
  else if(dr.m === 'stepback'){
    // Отход назад
    const back = f.t === 0 ? {dc: 0, dr: 1} : {dc: 0, dr: -1};
    const tc = f.c + back.dc, tr = f.r + back.dr;
    if(tc < 0 || tc >= COLS || tr < 0 || tr >= ROWS || figAt(tc, tr)){
      logMsg('Негде отойти');
      f.o += dr.c;
    } else {
      f.c = tc; f.r = tr;
      f.px = undefined; f.py = undefined;
      f.shootBonus = (f.shootBonus || 0) + 3;
      logMsg('🚶 Степ-бэк: +3 к броску');
      popText('+3', cen(f.c, f.r).x, cen(f.c, f.r).y - 25, '#fbbf24', 16);
    }
  }
  else if(dr.m === 'hesi'){
    const defs = fig.filter(g =>
      g.t !== f.t && g.c >= 0 && dist(g.c, g.r, f.c, f.r) === 1
    );
    const def = defs[0];
    if(def){
      const atk = f.d + Math.floor(Math.random() * 6) + 1;
      const dfn = def.z + Math.floor(Math.random() * 6) + 1;
      logMsg('💫 Хезитейшн ' + atk + ' vs ' + dfn);
      if(atk >= dfn){
        def.o = Math.max(0, def.o - 1);
        logMsg('✓ ' + def.n + ' −1 ОД');
        popText('−1 ОД', cen(def.c, def.r).x, cen(def.c, def.r).y - 30, '#3b82f6', 14);
      } else {
        logMsg('✗');
      }
    }
  }

  // Кулдаун
  const cd = f.d <= 2 ? 1 : (f.d <= 4 ? 2 : 3);
  f.dribbleCd[dr.m] = cd;
  logMsg('⏳ ' + dr.n + ': кулдаун ' + cd);

  mode = 'sel';
  if(f.o <= 0) end();
  else { reHL(); ui(); draw(); }
};

// ===== ПЛАВНОЕ ДВИЖЕНИЕ (анимация) =====
function smoothMove(f, fromC, fromR, toC, toR, duration, curve, ghostColor){
  return new Promise(resolve => {
    const fromPx = cen(fromC, fromR);
    const toPx = cen(toC, toR);
    const FRAMES = 22;
    const dt = duration / FRAMES;

    f._animating = true;
    let i = 0;

    function step(){
      if(i > FRAMES){
        f.px = toPx.x;
        f.py = toPx.y;
        f._animating = false;
        render();
        resolve();
        return;
      }
      const t = i / FRAMES;
      // ease-in-out
      const ease = t < 0.5
        ? 2 * t * t
        : 1 - Math.pow(-2 * t + 2, 2) / 2;

      let px = fromPx.x + (toPx.x - fromPx.x) * ease;
      let py = fromPx.y + (toPx.y - fromPx.y) * ease;

      // Кривая
      if(curve){
        const off = curve(t);
        px += off[0];
        py += off[1];
      }

      f.px = px;
      f.py = py;

      // Ghost
      if(ghostColor && i > 0 && i % 3 === 0){
        fx.push({
          type: 'ghost',
          x: px, y: py,
          color: ghostColor,
          life: 20, maxLife: 20,
          size: S * 0.5
        });
      }

      render();
      i++;
      setTimeout(step, dt);
    }
    step();
  });
}

// ===== ВЫПОЛНЕНИЕ ДРИБЛИНГА =====
execDribble = async function(t){
  const f = byId(sel);
  if(!f) return;
  const def = byId(t.defId);
  const dr = DRIBBLES.find(d => d.m === dribbleType);
  if(!dr) return;
  if(f.o < dr.c){ logMsg('Мало ОД'); return; }
  if(f.dribbleCd[dr.m] > 0){ logMsg('⏳ кулдаун'); return; }

  window.__animLock = true;

  try {
    const fromC = f.c, fromR = f.r;
    const fromPx = cen(fromC, fromR);
    const toPx = cen(t.c, t.r);
    const dx = toPx.x - fromPx.x;
    const dy = toPx.y - fromPx.y;
    const len = Math.hypot(dx, dy) || 1;
    const perpX = -dy / len;
    const perpY = dx / len;
    const flip = Math.random() < 0.5 ? 1 : -1;

    // Бросок кубика
    const roll = Math.floor(Math.random() * 6) + 1;
    const defRoll = Math.floor(Math.random() * 6) + 1;
    const atkBonus = (f.bl > 0) ? -2 : 0;
    const pen = (dribbleType === 'ankle') ? -3 : 0;
    const atk = f.d + atkBonus + pen + roll;
    const dfn = def ? def.z + defRoll : 99;
    const success = atk >= dfn;
    logMsg(dr.n + ': ' + atk + ' vs ' + dfn);

    // === АНИМАЦИЯ ПО ТИПУ ===

    if(dribbleType === 'cross'){
      await smoothMove(f, fromC, fromR, t.c, t.r, 420, tt => {
        if(tt < 0.35){
          const k = tt / 0.35;
          const amp = Math.sin(k * Math.PI * 2) * 14;
          return [perpX * amp, perpY * amp];
        }
        return [0, 0];
      }, 'rgba(34,197,94,0.5)');
    }
    else if(dribbleType === 'spin'){
      await smoothMove(f, fromC, fromR, t.c, t.r, 550, tt => {
        const a = Math.sin(tt * Math.PI);
        return [perpX * 22 * flip * a, perpY * 22 * flip * a];
      }, 'rgba(168,85,247,0.6)');
    }
    else if(dribbleType === 'ankle'){
      // Двойной финт
      await smoothMove(f, fromC, fromR, fromC, fromR, 200, tt => {
        const amp = Math.sin(tt * Math.PI * 2) * 12;
        return [perpX * amp, perpY * amp];
      }, null);
      await smoothMove(f, fromC, fromR, fromC, fromR, 200, tt => {
        const amp = Math.sin(tt * Math.PI * 2) * 12 * -flip;
        return [perpX * amp, perpY * amp];
      }, null);
      await smoothMove(f, fromC, fromR, t.c, t.r, 320, null, 'rgba(239,68,68,0.6)');
    }
    else if(dribbleType === 'euro'){
      await smoothMove(f, fromC, fromR, t.c, t.r, 500, tt => {
        const a = Math.sin(tt * Math.PI);
        return [perpX * 14 * flip * a, perpY * 14 * flip * a];
      }, 'rgba(245,158,11,0.55)');
    }
    else {
      await smoothMove(f, fromC, fromR, t.c, t.r, 400, null, 'rgba(168,85,247,0.5)');
    }

    // === ПРИМЕНЕНИЕ РЕЗУЛЬТАТА ===
    if(success){
      f.c = t.c;
      f.r = t.r;
      f.o -= dr.c;
      f.mv = true;

      logMsg('✓ ' + dr.n + '!');
      popText(dr.n.toUpperCase() + '!', toPx.x, toPx.y - 34, '#22c55e', 15);
      burst(toPx.x, toPx.y, '#22c55e', 10, 2);

      if(dribbleType === 'spin' && def){
        def.o = Math.max(0, def.o - 1);
        logMsg('→ ' + def.n + ' -1 ОД');
      }
      else if(dribbleType === 'euro'){
        f.shootBonus = (f.shootBonus || 0) + 2;
        logMsg('→ +2 к броску');
      }
      else if(dribbleType === 'ankle' && def){
        // АНКЛ-БРЕЙКЕР — защитник падает и пропускает ход
        def.fr = 1;
        def.o = 0;
        def.a = true;
        logMsg('🦴 ' + def.n + ' УПАЛ! Пропускает ход');
        popText('💫 УПАЛ', cen(def.c, def.r).x, cen(def.c, def.r).y - 30, '#ef4444', 20);
        burst(cen(def.c, def.r).x, cen(def.c, def.r).y, '#ef4444', 12, 3);
      }
    }
    else {
      f.o = Math.max(0, f.o - 1);
      logMsg('✗ ' + dr.n + ' провалился');
      popText('✗', fromPx.x, fromPx.y - 30, '#ef4444', 22);
    }

    // Кулдаун
    const cd = f.d <= 2 ? 1 : (f.d <= 4 ? 2 : 3);
    f.dribbleCd[dribbleType] = cd;
    logMsg('⏳ ' + dr.n + ': кулдаун ' + cd);
  }
  finally {
    window.__animLock = false;
    mode = 'sel';
    hl = [];
    if(f.o <= 0) end();
    else { reHL(); ui(); draw(); }
  }
};

        b.style.opacity = '0.3';
      } else if(f.o < dr.c){
        b.textContent = dr.n + ' (' + dr.c + ' ОД)';
        b.disabled = true;
        b.style.opacity = '0.5';
      } else {
        b.textContent = dr.n + ' (' + dr.c + ')';
        b.onclick = () => pickDribble(dr);
      }
      act.appendChild(b);
    });

    const back = document.createElement('button');
    back.textContent = '← Назад';
    back.className = 'cancel';
    back.onclick = () => { mode = 'sel'; ui(); draw(); };
    act.appendChild(back);
    return;
  }

  // Выбор цели для прохода
  if(mode === 'dribbleTarget'){
    act.innerHTML = '';
    const title = document.createElement('div');
    title.textContent = 'Выбери гекс для прохода';
    title.style.cssText = 'color:#c084fc;font-weight:bold;font-size:13px;width:100%;margin-bottom:4px';
    act.appendChild(title);
    const back = document.createElement('button');
    back.textContent = '← Отмена';
    back.className = 'cancel';
    back.onclick = () => { mode = 'sel'; hl = []; reHL(); ui(); draw(); };
    act.appendChild(back);
    return;
  }
};

// ===== АЛЕЙ-УП =====
function startAlley(){
  const f = byId(sel);
  if(!f || ball !== f.i || f.o < 2) return;
  if(!f.teamCd) f.teamCd = {};
  if(f.teamCd.alley > 0){
    logMsg('⏳ Алей-уп: кулдаун ' + f.teamCd.alley);
    return;
  }

  const h = hoops[1 - f.t];
  const ally = fig.find(g =>
    g.t === f.t && g.i !== f.i && g.c >= 0 &&
    dist(g.c, g.r, h.c, h.r) <= 1
  );
  if(!ally){ logMsg('⚠ Нет союзника у кольца'); return; }

  f.o -= 2;
  f.teamCd.alley = TEAM_CD.alley;

  // Перехват паса
  let int = null, br = 0;
  fig.forEach(g => {
    if(g.t === f.t || g.c < 0) return;
    const minD = Math.min(
      dist(g.c, g.r, f.c, f.r),
      dist(g.c, g.r, ally.c, ally.r)
    );
    if(minD > 2) return;
    const roll = g.z + Math.floor(Math.random() * 6) + 1;
    if(roll > br){ br = roll; int = g; }
  });

  if(int && br >= f.d + Math.floor(Math.random() * 6) + 1){
    ball = int.i;
    logMsg('🚫 Перехват алей-паса: ' + int.n);
    if(f.o <= 0) end();
    else { ui(); draw(); }
    return;
  }

  const from = cen(f.c, f.r);
  const hp = cen(h.c, h.r);
  ball = null;

  flyBall(from.x, from.y, hp.x, hp.y, () => {
    let pen = 0;
    fig.forEach(o => {
      if(o.t !== ally.t && o.c >= 0 &&
         dist(o.c, o.r, ally.c, ally.r) <= 1) pen = 2;
    });
    const roll = Math.floor(Math.random() * 6) + 1;
    const tot = ally.b + 5 + roll;
    const win = tot >= (5 + pen);
    logMsg('🏀 Алей-уп ' + ally.n + ': ' + tot + ' vs ' + (5 + pen));

    if(win){
      popText('АЛЕЙ-УП +2!', hp.x, hp.y - 30, '#22c55e', 22);
      sc[f.t] += 2;
      burst(hp.x, hp.y, '#22c55e', 15, 4);
      burst(hp.x, hp.y, '#fbbf24', 10, 3);
      setTimeout(() => {
        if(sc[f.t] >= 21){
          over = true;
          logMsg('🏆 Победа!');
          sel = null; hl = [];
          ui(); draw();
          return;
        }
        resetPositions(f.t);
      }, 700);
    } else {
      popText('Мимо', hp.x, hp.y - 30, '#ef4444', 22);
      setTimeout(() => { rebound(f.t); end(); }, 400);
    }
  });
}

function doPickAndRoll(){
  const f = byId(sel);
  if(!f || f.o < 1) return;
  if(!f.teamCd) f.teamCd = {};
  if(f.teamCd.pickroll > 0){
    logMsg('⏳ Пик-н-ролл: кулдаун ' + f.teamCd.pickroll);
    return;
  }

  const ally = fig.find(g =>
    g.t === f.t && g.i !== f.i && g.c >= 0 &&
    dist(g.c, g.r, f.c, f.r) <= 2
  );
  if(!ally){ logMsg('⚠ Нет союзника рядом'); return; }

  const enemy = fig.find(g =>
    g.t !== f.t && g.c >= 0 &&
    dist(g.c, g.r, ally.c, ally.r) <= 2
  );
  if(!enemy){ logMsg('⚠ Нет врага для скрина'); return; }

  f.o -= 1;
  f.teamCd.pickroll = TEAM_CD.pickroll;
  enemy.o = Math.max(0, enemy.o - 1);

  logMsg('🤝 Пик-н-ролл: ' + ally.n + ' скрин на ' + enemy.n);
  const p = cen(ally.c, ally.r);
  popText('🚧 СКРИН', p.x, p.y - 32, '#06b6d4', 16);
  const ep = cen(enemy.c, enemy.r);
  popText('-1 ОД', ep.x, ep.y - 30, '#ef4444', 14);

  if(f.o <= 0) end();

// ===== БЫСТРЫЙ ОТРЫВ =====
function doFastBreak(){
  const f = byId(sel);
  if(!f || ball !== f.i || f.o < 2) return;
  if(!f.teamCd) f.teamCd = {};
  if(f.teamCd.fastbreak > 0){
    logMsg('⏳ Отрыв: кулдаун ' + f.teamCd.fastbreak);
    return;
  }

  const h = hoops[1 - f.t];
  const myAx = toAx(f.c, f.r);
  const dirs = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
  let best = null, bd = dist(f.c, f.r, h.c, h.r);

  dirs.forEach(d => {
    const tOff = toOff(myAx.q + d[0] * 2, myAx.r + d[1] * 2);
    if(tOff.c < 0 || tOff.c >= COLS ||
       tOff.r < 0 || tOff.r >= ROWS) return;
    if(figAt(tOff.c, tOff.r)) return;

    const mid = toOff(myAx.q + d[0], myAx.r + d[1]);
    const midFig = figAt(mid.c, mid.r);
    if(midFig && midFig.t !== f.t) return;

    const dh = dist(tOff.c, tOff.r, h.c, h.r);
    if(dh < bd){ bd = dh; best = tOff; }
  });

  if(!best){ logMsg('⚠ Некуда бежать'); return; }

  f.o -= 2;
  f.teamCd.fastbreak = TEAM_CD.fastbreak;
  const fromC = f.c, fromR = f.r;
  ghostTrail(f, fromC, fromR, best.c, best.r, 'rgba(6,182,212,0.8)', 8);
  f.c = best.c;
  f.r = best.r;
  f.px = undefined; f.py = undefined;
  f.mv = true;

  logMsg('🚀 Отрыв!');
  const p = cen(best.c, best.r);
  popText('🚀 ОТРЫВ', p.x, p.y - 30, '#06b6d4', 18);
  burst(p.x, p.y, '#06b6d4', 10, 3);

  if(f.o <= 0) end();
  else { ui(); draw(); }
}

// ===== ДЛИННЫЙ ПАС =====
let longPassMode = false;
let longPassCaster = null;

function startLongPass(){
  const f = byId(sel);
  if(!f || ball !== f.i || f.o < 2) return;
  if(!f.teamCd) f.teamCd = {};
  if(f.teamCd.longpass > 0){
    logMsg('⏳ Длинный пас: кулдаун ' + f.teamCd.longpass);
    return;
  }

  mode = 'pass';
  hl = fig.filter(g =>
    g.t === f.t && g.i !== f.i && g.c >= 0 &&
    dist(f.c, f.r, g.c, g.r) <= 6
  ).map(g => ({c: g.c, r: g.r, m: 'pass', id: g.i}));

  if(!hl.length){
    logMsg('⚠ Нет союзников');
    mode = 'sel';
    return;
  }
  longPassMode = true;
  longPassCaster = f.i;
  ui(); draw();
}

// Перехват doPass для длинного паса
const _doPass_long = doPass;
doPass = function(targetId){
  if(longPassMode){
    longPassMode = false;
    const f = byId(longPassCaster);
    const t = byId(targetId);
    if(!f || !t){
      longPassCaster = null;
      return _doPass_long(targetId);
    }
    longPassCaster = null;

    const d = dist(f.c, f.r, t.c, t.r);
    if(d <= 3){
      return _doPass_long(targetId);
    }

    if(!f.teamCd) f.teamCd = {};
    f.teamCd.longpass = TEAM_CD.longpass;
    logMsg('⏳ Длинный пас: кулдаун ' + TEAM_CD.longpass);

    // Перехват (риск выше)
    let int = null, br = 0;
    fig.forEach(g => {
      if(g.t === f.t || g.c < 0) return;
      const minD = Math.min(
        dist(g.c, g.r, f.c, f.r),
        dist(g.c, g.r, t.c, t.r)
      );
      if(minD > 2) return;
      const roll = g.z + Math.floor(Math.random() * 6) + 1 + 3;
      if(roll > br){ br = roll; int = g; }
    });

    if(int){
      const pr = f.d + Math.floor(Math.random() * 6) + 1 - 1;
      if(br >= pr){
        f.o -= 2;
        ball = int.i;
        logMsg('🚫 ПЕРЕХВАТ длинного паса: ' + int.n);
        mode = 'sel'; hl = [];
        if(f.o <= 0) end();
        else { ui(); draw(); }
        return;
      }
    }

    const from = cen(f.c, f.r);
    const to = cen(t.c, t.r);
    ball = null;
    f.o -= 2;

    flyBall(from.x, from.y, to.x, to.y, () => {
      ball = targetId;
      t.receivedPass = 1;
      logMsg('🎯 Длинный пас ' + f.n + ' → ' + t.n);
      popText('🎯', to.x, to.y - 30, '#3b82f6', 22);
      mode = 'sel'; hl = [];
      if(f.o <= 0) end();
      else { ui(); draw(); }
    });
    return;
  }
  return _doPass_long(targetId);
};
/* ============================================================
   ЧАСТЬ 11: ИИ
   ============================================================ */

function aiSleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function aiChance(p){ return Math.random() < p; }

// ===== УРОВЕНЬ СЛОЖНОСТИ =====
function aiLevel(){
  if(aiDifficulty === 'hard')
    return {smart: 1.0, pass: 0.9, dribble: 0.9, abilities: 1.0, defense: 1.0};
  if(aiDifficulty === 'easy')
    return {smart: 0.4, pass: 0.4, dribble: 0.2, abilities: 0.2, defense: 0.4};
  return {smart: 0.75, pass: 0.7, dribble: 0.6, abilities: 0.7, defense: 0.75};
}

function aiEnemiesAround(f, r){
  return fig.filter(g =>
    g.t !== f.t && g.c >= 0 && dist(g.c, g.r, f.c, f.r) <= (r || 1)
  );
}
function aiAlliesOf(f){
  return fig.filter(g => g.t === f.t && g.i !== f.i && g.c >= 0);
}
function aiHoopDist(c, r){
  return dist(c, r, hoops[0].c, hoops[0].r);
}
function aiIsOut3(f){
  return dist(f.c, f.r, hoops[0].c, hoops[0].r) >= 4;
}

// ===== АНАЛИЗ СИТУАЦИИ =====
function aiAnalyze(){
  const bh = byId(ball);
  const diff = sc[1] - sc[0];
  return {
    ball: bh,
    diff: diff,
    desperate: diff < -6,
    leading: diff > 6,
    close: Math.abs(diff) <= 3,
    late: Math.max(sc[0], sc[1]) >= 15
  };
}

// ===== 1v1 CLEAR =====
function aiMustClear(f){
  if(gameMode !== '1v1') return false;
  if(!clearPending[f.t]) return false;
  return !aiIsOut3(f);
}

async function aiDoClear(f){
  if(f.o < 1) return false;
  const h = hoops[0];
  const opts = nb(f.c, f.r).filter(p => !figAt(p[0], p[1]));
  if(!opts.length) return false;

  let best = null, bestD = 999;
  opts.forEach(p => {
    const dh = dist(p[0], p[1], h.c, h.r);
    if(dh >= 4 && dh < bestD){ bestD = dh; best = p; }
  });
  if(!best){
    opts.forEach(p => {
      const dh = dist(p[0], p[1], h.c, h.r);
      const myD = dist(f.c, f.r, h.c, h.r);
      if(dh > myD && dh < bestD){ bestD = dh; best = p; }
    });
  }
  if(!best) return false;

  const fromC = f.c, fromR = f.r;
  f.c = best[0]; f.r = best[1];
  f.px = undefined; f.py = undefined;
  f.o -= 1;
  f.mv = true;
  ghostTrail(f, fromC, fromR, best[0], best[1], 'rgba(251,191,36,0.5)', 4);

  if(aiIsOut3(f)){
    clearPending[f.t] = false;
    logMsg('🤖 ' + f.n + ': за дугой');
  }

  ui(); draw();
  await aiSleep(300);
  return true;
}

// ===== ПЕРЕМЕЩЕНИЕ К ЦЕЛИ =====
async function aiMoveTo(f, tc, tr, cost){
  const opts = nb(f.c, f.r).filter(p => !figAt(p[0], p[1]));
  if(!opts.length) return false;
  opts.sort((a, b) => dist(a[0], a[1], tc, tr) - dist(b[0], b[1], tc, tr));
  const step = opts[0];
  const fromC = f.c, fromR = f.r;
  f.c = step[0]; f.r = step[1];
  f.o -= (cost || 1);
  f.mv = true;
  ghostTrail(f, fromC, fromR, f.c, f.r, 'rgba(239,68,68,0.3)', 3);
  ui(); draw();
  await aiSleep(220);
  return true;
}

// ===== ИИ: С МЯЧОМ =====
async function aiWithBall(f){
  const lvl = aiLevel();
  const sit = aiAnalyze();
  const h = hoops[0];
  const d = aiHoopDist(f.c, f.r);
  const near = aiEnemiesAround(f, 1);
  const pressure = near.length >= 1;
  const doubleTeam = near.length >= 2;

  // 1v1 clear — приоритет!
  if(aiMustClear(f)){
    if(await aiDoClear(f)) return 'move';
    return null;
  }

  // Отличный бросок
  const tgt = d <= 1 ? 5 : d <= 3 ? 7 : 9;
  const pen = pressure ? 2 : 0;
  let bonus = 0;
  if((f.ab || []).some(a => a.n === 'Снайпер') && !f.mv) bonus += 2;
  if((f.ab || []).some(a => a.n === 'Дальнобой') && d >= 4) bonus += 1;
  if(f.shootBonus) bonus += f.shootBonus;
  if(f.bl > 0) bonus -= 2;
  const need = (tgt + pen) - (f.b + bonus + 3.5);
  const ch = need <= -3 ? 0.95 : need <= -1 ? 0.85 : need <= 1 ? 0.65 : need <= 3 ? 0.45 : need <= 5 ? 0.25 : 0.08;

  // Отличный бросок
  if(ch >= 0.72 && !doubleTeam && f.o >= 2 && d <= 5){
    if(d <= 1 && f.s >= 4){ doDunk(); await aiSleep(1100); return 'shot'; }
    if(d <= 3){ doShoot(); await aiSleep(1100); return 'shot'; }
    if(d <= 5 && ch >= 0.65){ doShoot(); await aiSleep(1100); return 'shot'; }
  }

  // Способности (движение)
  if(pressure && !doubleTeam && aiChance(lvl.abilities) && f.ab){
    const ab = f.ab.find(a =>
      (a.m === 'jump' || a.m === 'phase' || a.m === 'dash' || a.m === 'slide') &&
      !(a.u && f.us.indexOf(a.n) >= 0) &&
      f.o >= a.c &&
      (!f.abilityCd || !f.abilityCd[a.n] || f.abilityCd[a.n] === 0)
    );
    if(ab){
      const myAx = toAx(f.c, f.r);
      const dirs = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
      let best = null, bd = 99;
      dirs.forEach(dd => {
        for(let st = 1; st <= 3; st++){
          const tOff = toOff(myAx.q + dd[0]*st, myAx.r + dd[1]*st);
          if(tOff.c < 0 || tOff.c >= COLS ||
             tOff.r < 0 || tOff.r >= ROWS) break;
          if(figAt(tOff.c, tOff.r)) continue;
          const dh = aiHoopDist(tOff.c, tOff.r);
          if(dh < bd){ bd = dh; best = tOff; }
        }
      });
      if(best){
        pab = ab;
        execAb({c: best.c, r: best.r, m: ab.m});
        await aiSleep(350);
        return 'move';
      }
    }
  }

  // Дриблинг
  if(pressure && !doubleTeam && f.o >= 2 && aiChance(lvl.dribble)){
    const myAx = toAx(f.c, f.r);
    const myHD = aiHoopDist(f.c, f.r);
    const dirs = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
    let targets = [];
    dirs.forEach(dd => {
      const midOff = toOff(myAx.q + dd[0], myAx.r + dd[1]);
      if(midOff.c < 0 || midOff.c >= COLS ||
         midOff.r < 0 || midOff.r >= ROWS) return;
      const midFig = figAt(midOff.c, midOff.r);
      if(!midFig || midFig.t === f.t) return;
      for(let st = 1; st <= 2; st++){
        const tOff = toOff(myAx.q + dd[0]*(1+st), myAx.r + dd[1]*(1+st));
        if(tOff.c < 0 || tOff.c >= COLS ||
           tOff.r < 0 || tOff.r >= ROWS) break;
        if(figAt(tOff.c, tOff.r)) continue;
        const dh = aiHoopDist(tOff.c, tOff.r);
        if(dh < myHD) targets.push({c: tOff.c, r: tOff.r});
      }
    });
    if(targets.length){
      const best = targets[Math.floor(Math.random() * targets.length)];
      const roll = Math.floor(Math.random() * 6) + 1;
      const defRoll = Math.floor(Math.random() * 6) + 1;
      const atk = f.d + roll;
      const dfn = near[0].z + defRoll;
      f.o -= 1;
      logMsg('🤖 ' + f.n + ': дриблинг ' + atk + ' vs ' + dfn);
      if(atk >= dfn){
        f.c = best.c; f.r = best.r;
        f.px = undefined; f.py = undefined;
        logMsg('✓ Прошёл');
      } else {
        f.o = Math.max(0, f.o - 1);
        logMsg('✗');
      }
      ui(); draw();
      await aiSleep(380);
      return 'move';
    }
  }

  // Пас
  if((doubleTeam || pressure || ch < 0.4) && f.o >= 1 && aiChance(lvl.pass)){
    const allies = aiAlliesOf(f).filter(a =>
      dist(f.c, f.r, a.c, a.r) <= 4
    );
    if(allies.length){
      // Ищем открытого
      const open = allies.filter(a => {
        let ne = 99;
        fig.forEach(g => {
          if(g.t !== f.t && g.c >= 0) ne = Math.min(ne, dist(g.c, g.r, a.c, a.r));
        });
        return ne >= 2;
      });
      const target = open.length ? open[0] : allies[0];
      doPass(target.i);
      await aiSleep(380);
      return 'move';
    }
  }

  // Средний бросок
  if(ch >= 0.5 && !doubleTeam && f.o >= 2 && d <= 5){
    doShoot();
    await aiSleep(1000);
    return 'shot';
  }

  // Отчаянный
  if(sit.desperate && f.o >= 2 && d <= 8){
    doShoot();
    await aiSleep(1000);
    return 'shot';
  }

  // Тянет время
  if(sit.leading && f.o >= 1 && !pressure){
    f.o -= 1;
    ui(); draw();
    await aiSleep(220);
    return 'move';
  }

  // Движение к кольцу
  if(f.o >= 1 && await aiMoveTo(f, h.c, h.r, 1)) return 'move';
  return null;
}

// ===== ИИ: ЗАЩИТА =====
async function aiDefend(f){
  const lvl = aiLevel();
  const bh = byId(ball);
  if(!bh || bh.t === f.t) return null;
  const d = dist(f.c, f.r, bh.c, bh.r);

  // Способности
  if(d <= 1 && aiChance(lvl.abilities * 0.8) && f.ab){
    const avail = f.ab.filter(a =>
      !a.p && !(a.u && f.us.indexOf(a.n) >= 0) &&
      f.o >= a.c &&
      (!f.abilityCd || !f.abilityCd[a.n] || f.abilityCd[a.n] === 0)
    );
    const deb = avail.find(a =>
      a.m === 'blind' || a.m === 'freeze' || a.m === 'sting' || a.m === 'push'
    );
    if(deb){
      pab = deb;
      execAb({c: bh.c, r: bh.r, m: 'enemy', id: bh.i});
      await aiSleep(380);
      return 'move';
    }
  }

  // Отбор
  if(d <= 1 && f.o >= 1 && aiChance(lvl.defense * 0.8)){
    doSteal();
    await aiSleep(380);
    return 'steal';
  }

  // Опека
  if(d >= 2 && d <= 3 && f.o >= 1 && aiChance(0.3) && aiDifficulty !== 'easy'){
    // Проверяем — не опекают ли уже
    const markedIds = Object.keys(oppMarks).map(k => parseInt(k));
    if(markedIds.indexOf(bh.i) < 0 && aiIsValuableTarget(bh)){
      f.o -= 1;
      oppMarks[bh.i] = f.i;
      logMsg('🤖 🎯 Опека на ' + bh.n);
      popText('🎯', cen(bh.c, bh.r).x, cen(bh.c, bh.r).y - 30, '#dc2626', 18);
      ui(); draw();
      await aiSleep(280);
      return 'move';
    }
  }

  // Давление
  if(f.o >= 1 && aiChance(0.35) && aiDifficulty !== 'easy'){
    const ownH = hoops[1];
    const dOwn = dist(f.c, f.r, ownH.c, ownH.r);
    if(dOwn <= 4 && !presses.some(p => p.c === f.c && p.r === f.r)){
      presses.push({c: f.c, r: f.r, team: f.t, owner: f.i});
      f.o -= 1;
      logMsg('🤖 🛡 Давление');
      ui(); draw();
      await aiSleep(220);
      return 'move';
    }
  }

  // Позиция
  if(f.o >= 1){
    const oH = hoops[1];
    const opts = nb(f.c, f.r).filter(p => !figAt(p[0], p[1]));
    let best = null, bs = -1e9;
    opts.forEach(p => {
      const dm = dist(p[0], p[1], bh.c, bh.r);
      const dh = dist(p[0], p[1], oH.c, oH.r);
      const btw = dm + dh - dist(bh.c, bh.r, oH.c, oH.r);
      const score = -dm*2.8 - dh*0.4 - btw*0.6;
      if(score > bs){ bs = score; best = p; }
    });
    if(best){
      f.c = best[0]; f.r = best[1]; f.o -= 1;
      f.px = undefined; f.py = undefined;
      ui(); draw();
      await aiSleep(200);
      return 'move';
    }
  }
  return null;
}

// Проверка — важная ли цель для опеки
function aiIsValuableTarget(t){
  if(!t) return false;
  // Опекаем если: высокий бросок, рядом с кольцом
  const dH = dist(t.c, t.r, hoops[1].c, hoops[1].r);
  return (t.b >= 5 || dH <= 4);
}

// ===== ИИ: БЕЗ МЯЧА (АТАКА) =====
async function aiOffBall(f){
  const bh = byId(ball);
  if(!bh) return null;

  if(bh.t === f.t){
    // Открыться ближе к кольцу
    if(f.o >= 1){
      const opts = nb(f.c, f.r).filter(p => !figAt(p[0], p[1]));
      let best = null, bs = -1e9;
      opts.forEach(p => {
        const dh = aiHoopDist(p[0], p[1]);
        let pressure = 0;
        fig.forEach(g => {
          if(g.t !== f.t && g.c >= 0 &&
             dist(g.c, g.r, p[0], p[1]) <= 1) pressure += 2;
        });
        const score = -dh * 1.8 - pressure * 3;
        if(score > bs){ bs = score; best = p; }
      });
      if(best){
        f.c = best[0]; f.r = best[1]; f.o -= 1;
        f.px = undefined; f.py = undefined;
        ui(); draw();
        await aiSleep(200);
        return 'move';
      }
    }
    return null;
  }

  return await aiDefend(f);
}

// ===== ИИ: ОДИН ШАГ =====
async function aiStep(f){
  if(ball === f.i) return await aiWithBall(f);
  const bh = byId(ball);
  if(bh && bh.t !== f.t) return await aiDefend(f);
  return await aiOffBall(f);
}

// ===== ИИ: ИГРА ФИГУРОЙ =====
async function aiPlayFigure(f){
  let guard = 20;
  while(f.o > 0 && turn === 1 && !over && guard-- > 0){
    const r = await aiStep(f);
    if(!r) break;
    if(r === 'shot') break;
    await aiSleep(160);
  }
}

// ===== ИИ: ИГРА ВСЕЙ КОМАНДОЙ =====
playAllAI = async function(){
  if(aiRunning) return;
  aiRunning = true;
  logMsg('🤖 ИИ (' + aiDifficulty + ')...');

  const maxMoves = doubleMoveEnabled ? 2 : 1;
  let moved = 0;

  let guard = 20;
  while(turn === 1 && !over && guard-- > 0 && moved < maxMoves){
    const cands = fig.filter(x =>
      x.t === 1 && !x.a && x.c >= 0 && x.penalty === 0 && x.fr === 0
    );
    if(!cands.length) break;

    // Выбор фигуры
    let f = null;
    if(aiDifficulty === 'easy'){
      // Лёгкий — случайная или с мячом
      f = cands.find(x => ball === x.i) || cands[0];
    } else {
      // Умный — самая ценная
      let bestScore = -999;
      cands.forEach(cand => {
        let score = 0;
        if(ball === cand.i) score += 100;
        score += cand.o * 5;
        const dh = aiHoopDist(cand.c, cand.r);
        score += (10 - dh) * 3;
        const bo = byId(ball);
        if(bo && bo.t === 0){
          const dm = dist(cand.c, cand.r, bo.c, bo.r);
          score += (8 - dm) * 4;
        }
        if(score > bestScore){ bestScore = score; f = cand; }
      });
    }
    if(!f) break;

    sel = f.i;
    reHL(); ui(); draw();
    await aiSleep(220);

    await aiPlayFigure(f);

    if(!f.a && !over){
      f.a = true;
      f.o = 0;
      moved++;
      movesThisTurn = moved;
      await aiSleep(150);
    }
  }

  // Завершаем ход
  if(turn === 1 && !over){
    fig.forEach(g => {
      if(g.t === 1 && !g.a && g.c >= 0){ g.a = true; g.o = 0; }
    });
    switchTurn();
  }

  aiRunning = false;
};

// ===== РЕНДЕР ПУЛА ФИГУР (по позициям) =====
function renderPool(){
  const need = (MODE_PRESETS[gameMode] || MODE_PRESETS['5v5']).count;
  const isAI = aiEnabled;
  const pool = document.getElementById('pool');
  if(!pool) return;
  pool.innerHTML = '';

  const usedSet = {};
  teamGreen.forEach(n => usedSet[n] = true);
  teamRed.forEach(n => usedSet[n] = true);

  const groups = getGroupsByPos();

  POS_ORDER.forEach(pos => {
    if(!groups[pos].length) return;

    // Заголовок группы
    const header = document.createElement('div');
    header.className = 'pos-header';
    header.innerHTML =
      '<span class="pos-badge" style="background:' + POS_COLOR[pos] + '">' + pos + '</span>' +
      '<span style="color:#94a3b8;font-weight:normal">' + POS_FULL[pos] + '</span>';
    pool.appendChild(header);

    // Ряд кнопок
    const row = document.createElement('div');
    row.className = 'pos-row';

    groups[pos].forEach(n => {
      const used = !!usedSet[n];
      const b = document.createElement('button');
      b.textContent = (ICONS[n] || '🐜') + ' ' + n;
      b.disabled = used;
      b.style.background = POS_COLOR[pos];
      b.onclick = () => {
        if(pickingTeam === 0 && teamGreen.length < need){
          teamGreen.push(n);
          if(teamGreen.length >= need && !isAI) pickingTeam = 1;
        } else if(!isAI && pickingTeam === 1 && teamRed.length < need){
          teamRed.push(n);
        }
        renderPool();
        updateSetupButtons();
      };
      row.appendChild(b);
    });

    pool.appendChild(row);
  });

  // ===== Зелёные (chips) =====
  const tg = document.getElementById('tg');
  if(tg){
    tg.innerHTML = teamGreen.length
      ? teamGreen.map((n, i) =>
          '<span class="chip g" data-g="' + i + '">' + (ICONS[n] || '🐜') + ' ' + n + ' ×</span>'
        ).join('')
      : '—';
    tg.querySelectorAll('[data-g]').forEach(el => {
      el.onclick = () => {
        teamGreen.splice(parseInt(el.getAttribute('data-g')), 1);
        pickingTeam = 0;
        renderPool(); updateSetupButtons();
      };
    });
  }

  // ===== Красные (chips) =====
  const tr = document.getElementById('tr');
  if(tr){
    if(isAI){
      tr.innerHTML = '<i style="color:#94a3b8">ИИ выберет сам</i>';
    } else {
      tr.innerHTML = teamRed.length
        ? teamRed.map((n, i) =>
            '<span class="chip r" data-r="' + i + '">' + (ICONS[n] || '🐜') + ' ' + n + ' ×</span>'
          ).join('')
        : '—';
      tr.querySelectorAll('[data-r]').forEach(el => {
        el.onclick = () => {
          teamRed.splice(parseInt(el.getAttribute('data-r')), 1);
          pickingTeam = 1;
          renderPool(); updateSetupButtons();
        };
      });
    }
  }

  // ===== Кто выбирает =====
  const who = document.getElementById('who');
  if(who){
    who.textContent = isAI
      ? 'Зелёные (ты) — ' + gameMode
      : (pickingTeam === 0 ? 'Зелёные' : 'Красные') + ' (' + gameMode + ')';
  }
}

// ===== СТАРТ ИГРЫ =====
function startGame(){
  const need = (MODE_PRESETS[gameMode] || MODE_PRESETS['5v5']).count;

  if(teamGreen.length < need){
    alert('Нужно ' + need + ' фигур Зелёным');
    return;
  }

  if(aiEnabled){
    const pool = Object.keys(F).filter(n => teamGreen.indexOf(n) < 0);
    for(let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    teamRed = pool.slice(0, need);
  } else if(teamRed.length < need){
    alert('Нужно ' + need + ' фигур Красным');
    return;
  }

  document.getElementById('setup').classList.remove('show');
  document.getElementById('game').classList.add('show');

  initGame(teamGreen.slice(0, need), teamRed.slice(0, need));

  if(!aiEnabled && showPassScreen){
    setTimeout(showPassScreenFn, 500);
  }
}

function showTeamPicker(afterDone, afterCancel){
  showScreen('scrTeamPick');
  const cont = document.getElementById('teamPickContent');
  const teams = allTeams();
  const need = (MODE_PRESETS[gameMode] || MODE_PRESETS['5v5']).count;

  let myPick = (team1 && team1 !== 'manual') ? team1.id : 'manual';
  let oppPick = (team2 && team2 !== 'manual') ? team2.id : 'manual';

  function hasLineup(t){
    if(!t || !t.lineups) return false;
    const l = t.lineups[gameMode];
    return l && l.length === need;
  }

  function render(){
    let h = '<h1 style="font-size:20px;text-align:center;margin:0 0 4px">🏀 Выбор команд</h1>';
    h += '<div class="sub">Режим: ' + gameMode + ' · нужно ' + need + ' фигур</div>';

    // Моя команда
    h += '<div style="font-weight:bold;color:#22c55e;margin-bottom:6px">🟢 Твоя команда</div>';
    h += '<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:14px">';

    h += '<button data-my="manual" class="team-card' + (myPick === 'manual' ? ' sel-mine' : '') + '">';
    h += '<span class="team-dot" style="background:#22c55e;display:flex;align-items:center;justify-content:center;font-size:14px">🎨</span>';
    h += '<span style="flex:1;font-weight:bold">Собрать вручную</span>';
    if(myPick === 'manual') h += '<span style="color:#22c55e">✓</span>';
    h += '</button>';

    teams.forEach(t => {
      const ok = hasLineup(t);
      const sel = myPick === t.id;
      h += '<button data-my="' + t.id + '" ' + (ok ? '' : 'disabled') + ' class="team-card' + (sel ? ' sel-mine' : '') + '">';
      h += '<span class="team-dot" style="background:' + t.c1 + ';border:2px solid ' + t.c2 + '"></span>';
      h += '<span style="flex:1;font-weight:bold">' + t.name + '</span>';
      if(!ok) h += '<span style="font-size:10px;color:#fbbf24">нет состава</span>';
      if(sel) h += '<span style="color:#22c55e">✓</span>';
      h += '</button>';
    });
    h += '</div>';

    // Команда соперника
    h += '<div style="font-weight:bold;color:#ef4444;margin-bottom:6px">🔴 Команда соперника</div>';
    h += '<div style="display:flex;flex-direction:column;gap:4px;margin-bottom:16px">';

    h += '<button data-opp="manual" class="team-card' + (oppPick === 'manual' ? ' sel-opp' : '') + '">';
    h += '<span class="team-dot" style="background:#ef4444;display:flex;align-items:center;justify-content:center;font-size:14px">🎨</span>';
    h += '<span style="flex:1;font-weight:bold">Собрать вручную</span>';
    if(oppPick === 'manual') h += '<span style="color:#ef4444">✓</span>';
    h += '</button>';

    teams.forEach(t => {
      const ok = hasLineup(t);
      const sel = oppPick === t.id;
      h += '<button data-opp="' + t.id + '" ' + (ok ? '' : 'disabled') + ' class="team-card' + (sel ? ' sel-opp' : '') + '">';
      h += '<span class="team-dot" style="background:' + t.c1 + ';border:2px solid ' + t.c2 + '"></span>';
      h += '<span style="flex:1;font-weight:bold">' + t.name + '</span>';
      if(!ok) h += '<span style="font-size:10px;color:#fbbf24">нет состава</span>';
      if(sel) h += '<span style="color:#ef4444">✓</span>';
      h += '</button>';
    });
    h += '</div>';

    h += '<button id="tpGo" class="btn green" style="max-width:500px">✅ Готово</button>';
    h += '<button id="tpCancel" class="btn gray" style="max-width:500px;margin-top:8px">← Назад</button>';

    cont.innerHTML = h;

    cont.querySelectorAll('[data-my]').forEach(b => {
      b.onclick = () => { myPick = b.getAttribute('data-my'); render(); };
    });
    cont.querySelectorAll('[data-opp]').forEach(b => {
      b.onclick = () => { oppPick = b.getAttribute('data-opp'); render(); };
    });

    document.getElementById('tpGo').onclick = () => {
      if(myPick === 'manual'){
        team1 = 'manual';
        teamGreen = [];
      } else {
        team1 = getTeamById(myPick);
        try { localStorage.setItem('ib_team1', myPick); } catch(e){}
        teamGreen = (team1.lineups[gameMode] || []).slice();
      }
      if(oppPick === 'manual'){
        team2 = 'manual';
        teamRed = [];
      } else {
        team2 = getTeamById(oppPick);
        try { localStorage.setItem('ib_team2', oppPick); } catch(e){}
        teamRed = (team2.lineups[gameMode] || []).slice();
      }
      pickingTeam = teamGreen.length >= need ? 1 : 0;
      if(afterDone) afterDone();
    };

    document.getElementById('tpCancel').onclick = () => {
      if(afterCancel) afterCancel();
    };
  }

  render();
}

// ===== СОХРАНЕНИЕ =====
function saveGameToStorage(){
  try {
    const data = {
      fig: fig.map(f => {
        const o = {};
        for(const k in f){
          if(k === 'px' || k === 'py' || k === '_animating') continue;
          o[k] = f[k];
        }
        return o;
      }),
      ball: ball, turn: turn, sc: sc, over: over,
      webs: webs, presses: presses, holds: holds,
      gameMode: gameMode,
      teamGreen: teamGreen, teamRed: teamRed,
      pA: pA, pB: pB, hoops: hoops,
      oppMarks: oppMarks, clearPending: clearPending,
      movesThisTurn: movesThisTurn
    };
    localStorage.setItem('ib_game', JSON.stringify(data));
    logMsg('💾 Сохранено');
  } catch(e){
    alert('Ошибка сохранения: ' + e.message);
  }
}

function loadGameFromStorage(){
  const raw = localStorage.getItem('ib_game');
  if(!raw){ alert('Нет сохранения'); return false; }

  try {
    const d = JSON.parse(raw);

    fig = d.fig || [];
    ball = d.ball;
    turn = d.turn || 0;
    sc = d.sc || [0, 0];
    over = !!d.over;
    webs = d.webs || [];
    presses = d.presses || [];
    holds = d.holds || {};
    gameMode = d.gameMode || '5v5';
    teamGreen = d.teamGreen || [];
    teamRed = d.teamRed || [];
    pA = d.pA || [];
    pB = d.pB || [];
    hoops = d.hoops || [{c: 4, r: 0}, {c: 4, r: 11}];
    oppMarks = d.oppMarks || {};
    clearPending = d.clearPending || {0: false, 1: false};
    movesThisTurn = d.movesThisTurn || 0;

    // Восстановление фигур
    fig.forEach(f => {
      f.px = undefined;
      f.py = undefined;
      f._animating = false;
      if(!f.dribbleCd) f.dribbleCd = {};
      if(!f.teamCd) f.teamCd = {};
      if(!f.abilityCd) f.abilityCd = {};
      if(f.penalty === undefined) f.penalty = 0;
    });

    sel = null;
    hl = [];
    mode = 'sel';
    pab = null;

    hideAllScreens();
    document.getElementById('game').classList.add('show');
    setupCanvas();
    ui(); draw();
    logMsg('📂 Загружено');
    return true;
  } catch(e){
    alert('Ошибка загрузки: ' + e.message);
    return false;
  }
}

function connectMqtt(code){
  mqttRoomCode = code;
  mqttStatus('Подключение...', '#fbbf24');

  if(typeof mqtt === 'undefined'){
    setTimeout(() => connectMqtt(code), 800);
    return;
  }

  try {
    mqttClient = mqtt.connect(MQTT_BROKER, {
      clientId: 'guest_' + Math.random().toString(36).slice(2, 10),
      keepalive: 30,
      clean: true,
      connectTimeout: 10000
    });
  } catch(e){
    mqttStatus('Ошибка: ' + e.message, '#ef4444');
    return;
  }

  const topic = MQTT_APP + '/room/' + code;

  mqttClient.on('connect', () => {
    mqttClient.subscribe(topic);
    mqttStatus('🟢 Подключено! Ищу хоста...', '#22c55e');
    sendNet({type: 'guest_join'});
    setTimeout(() => {
      sendNet({type: 'hello', name: profile.name || 'Игрок', avatar: profile.avatar});
      showOnlinePickScreen();
    }, 700);
  });

  mqttClient.on('message', (t, payload) => {
    try {
      const data = JSON.parse(payload.toString());
      handleOnlineMsg(data);
    } catch(e){}
  });

  mqttClient.on('error', err => {
    mqttStatus('Ошибка MQTT: ' + err.message, '#ef4444');
  });
}

function sendNet(data){
  if(!mqttClient) return;
  try {
    mqttClient.publish(MQTT_APP + '/room/' + mqttRoomCode, JSON.stringify(data));
  } catch(e){}
}

function renderOnlinePick(){
  const div = document.getElementById('onlinePickScr');
  if(!div) return;
  const need = (MODE_PRESETS[gameMode] || MODE_PRESETS['5v5']).count;

  const poolEl = div.querySelector('#osPool');
  poolEl.innerHTML = '';

  const groups = getGroupsByPos();

  POS_ORDER.forEach(pos => {
    if(!groups[pos].length) return;

    const header = document.createElement('div');
    header.className = 'pos-header';
    header.innerHTML =
      '<span class="pos-badge" style="background:' + POS_COLOR[pos] + '">' + pos + '</span>' +
      '<span style="color:#94a3b8;font-weight:normal;font-size:11px">' + POS_FULL[pos] + '</span>';
    poolEl.appendChild(header);

    const row = document.createElement('div');
    row.className = 'pos-row';

    groups[pos].forEach(n => {
      const used = onlineMyPicks.indexOf(n) >= 0;
      const b = document.createElement('button');
      b.textContent = (ICONS[n] || '🐜') + ' ' + n;
      b.style.background = POS_COLOR[pos];
      b.disabled = used || onlineMyReady;
      b.onclick = () => {
        if(onlineMyReady) return;
        if(onlineMyPicks.length >= need) return;
        onlineMyPicks.push(n);
        renderOnlinePick();
      };
      row.appendChild(b);
    });

    poolEl.appendChild(row);
  });

  // Выбранные
  const picksEl = div.querySelector('#osPicks');
  picksEl.innerHTML = onlineMyPicks.length
    ? onlineMyPicks.map((n, i) =>
        '<span data-i="' + i + '" style="display:inline-block;background:#22c55e;padding:4px 10px;margin:3px;border-radius:5px;cursor:pointer">' +
        (ICONS[n] || '🐜') + ' ' + n + ' ✖</span>'
      ).join('')
    : '<i style="color:#64748b">Пока пусто</i>';

  picksEl.querySelectorAll('[data-i]').forEach(el => {
    el.onclick = () => {
      if(onlineMyReady) return;
      onlineMyPicks.splice(parseInt(el.getAttribute('data-i')), 1);
      renderOnlinePick();
    };
  });

  // Кнопка готов
  const btn = div.querySelector('#osReady');
  if(onlineMyReady){
    btn.textContent = '✅ Готово! Ждём противника...';
    btn.style.background = '#22c55e';
    btn.disabled = true;
  } else {
    btn.textContent = 'Готов (' + onlineMyPicks.length + '/' + need + ')';
    btn.style.background = onlineMyPicks.length === need ? '#22c55e' : '#e94560';
    btn.onclick = () => {
      if(onlineMyReady) return;
      if(onlineMyPicks.length < need){
        const stat = div.querySelector('#osStat');
        stat.textContent = 'Нужно ещё ' + (need - onlineMyPicks.length) + ' фигур';
        stat.style.color = '#ef4444';
        return;
      }
      onlineMyReady = true;
      sendNet({type: 'picks', picks: onlineMyPicks, name: profile.name});
      logMsg('🎨 Мой состав готов');
      renderOnlinePick();
    };
  }

  // Инфо о противнике
  const oppEl = div.querySelector('#osOpp');
  if(oppEl){
    oppEl.innerHTML = onlineOppAvatar + ' Противник: <b>' + onlineOppName + '</b>' +
      (onlineOppReady ? ' ✅' : '');
  }

  const stat2 = div.querySelector('#osStat');
  if(onlineMyReady && onlineOppReady){
    stat2.textContent = '✅ Оба готовы! Запуск...';
    stat2.style.color = '#22c55e';
    if(!window.__startingOnline){
      window.__startingOnline = true;
      setTimeout(startOnlineMatch, 800);
    }
  } else if(onlineMyReady){
    stat2.textContent = 'Ты готов. Ждём противника...';
    stat2.style.color = '#fbbf24';
  } else if(onlineOppReady){
    stat2.textContent = 'Противник готов! Собери свой состав.';
    stat2.style.color = '#fbbf24';
  }
}

// ===== ОБРАБОТКА СООБЩЕНИЙ =====
function handleOnlineMsg(data){
  if(!data || !data.type) return;

  if(data.type === 'hello'){
    onlineOppName = data.name || 'Противник';
    onlineOppAvatar = data.avatar || '🐝';
    logMsg('👋 ' + onlineOppName + ' подключился');
    if(onlinePickScreen) renderOnlinePick();
    return;
  }

  if(data.type === 'picks'){
    onlineOppPicks = data.picks || [];
    onlineOppReady = true;
    if(data.name) onlineOppName = data.name;
    logMsg('🎨 ' + onlineOppName + ' выбрал состав');
    if(onlinePickScreen) renderOnlinePick();
    return;
  }

  if(data.type === 'state'){
    applyOnlineState(data.state);
    return;
  }

  if(data.type === 'request_state'){
    if(onlineMatchActive && myTeamIdx === 0){
      sendNet({type: 'state', state: captureOnlineState()});
    }
    return;
  }
}

function startOnlineMatch(){
  const div = document.getElementById('onlinePickScr');
  if(div) div.remove();

  window.__startingOnline = false;

  const need = (MODE_PRESETS[gameMode] || MODE_PRESETS['5v5']).count;
  const myPicks = onlineMyPicks.slice(0, need);
  const oppPicks = (onlineOppPicks || []).slice(0, need);

  if(myTeamIdx === 0){
    teamGreen = myPicks;
    teamRed = oppPicks;
  } else {
    teamGreen = oppPicks;
    teamRed = myPicks;
  }

  hideAllScreens();
  document.getElementById('game').classList.add('show');

  initGame(teamGreen, teamRed);

  onlineMatchActive = true;
  onlineStateApplying = false;

  logMsg('🌐 Онлайн-матч!');
  logMsg('Ты — ' + (myTeamIdx === 0 ? '🟢 Зелёные' : '🔴 Красные'));

  // Гость запрашивает состояние
  if(myTeamIdx === 1){
    setTimeout(() => sendNet({type: 'request_state'}), 1000);
  }

  setTimeout(() => { ui(); draw(); }, 100);
}

// ===== СНИМОК / ПРИМЕНЕНИЕ =====
function captureOnlineState(){
  return {
    fig: fig.map(f => {
      const o = {};
      for(const k in f){
        if(k === 'px' || k === 'py' || k === '_animating') continue;
        o[k] = f[k];
      }
      return o;
    }),
    ball: ball, turn: turn, sc: sc, over: over,
    webs: webs, presses: presses, holds: holds,
    oppMarks: oppMarks, clearPending: clearPending,
    hoops: hoops, gameMode: gameMode,
    movesThisTurn: movesThisTurn
  };
}

function applyOnlineState(state){
  if(!state) return;
  onlineStateApplying = true;
  try {
    fig = state.fig || [];
    ball = state.ball;
    turn = state.turn;
    sc = state.sc || [0, 0];
    over = !!state.over;
    webs = state.webs || [];
    presses = state.presses || [];
    holds = state.holds || {};
    oppMarks = state.oppMarks || {};
    clearPending = state.clearPending || {0: false, 1: false};
    hoops = state.hoops || hoops;
    if(state.gameMode) gameMode = state.gameMode;
    movesThisTurn = state.movesThisTurn || 0;

    fig.forEach(f => {
      f.px = undefined;
      f.py = undefined;
      f._animating = false;
      if(!f.dribbleCd) f.dribbleCd = {};
      if(!f.teamCd) f.teamCd = {};
      if(!f.abilityCd) f.abilityCd = {};
      if(f.penalty === undefined) f.penalty = 0;
    });

    sel = null;
    hl = [];
    mode = 'sel';
    pab = null;
    ui(); draw();
  } finally {
    onlineStateApplying = false;
  }
}

function broadcastState(){
  if(!onlineMatchActive || onlineStateApplying) return;
  sendNet({type: 'state', state: captureOnlineState()});
}

function aiLevel(){
  if(aiDifficulty === 'hard')
    return {smart: 1.0, pass: 0.9, dribble: 0.95, abilities: 1.0, defense: 1.0, team: 0.85};
  if(aiDifficulty === 'easy')
    return {smart: 0.4, pass: 0.4, dribble: 0.25, abilities: 0.25, defense: 0.4, team: 0.15};
  return {smart: 0.75, pass: 0.7, dribble: 0.65, abilities: 0.7, defense: 0.75, team: 0.5};
}

function aiEnemies(f, r){
  return fig.filter(g => g.t !== f.t && g.c >= 0 && dist(g.c, g.r, f.c, f.r) <= (r || 1));
}
function aiAllies(f){
  return fig.filter(g => g.t === f.t && g.i !== f.i && g.c >= 0);
}
function aiHoopDist(c, r){ return dist(c, r, hoops[0].c, hoops[0].r); }
function aiOwnHoopDist(c, r){ return dist(c, r, hoops[1].c, hoops[1].r); }
function aiIsOut3(f){ return aiHoopDist(f.c, f.r) >= 4; }

function aiAnalyze(){
  const bh = byId(ball);
  const diff = sc[1] - sc[0];
  return {
    ball: bh, diff: diff,
    desperate: diff < -5,
    leading: diff > 5,
    late: Math.max(sc[0], sc[1]) >= 15,
    hasBall: bh && bh.t === 1
  };
}

// ===== 1v1 CLEAR =====
function aiMustClear(f){
  if(gameMode !== '1v1') return false;
  if(!clearPending[f.t]) return false;
  return !aiIsOut3(f);
}

async function aiDoClear(f){
  if(f.o < 1) return false;
  const h = hoops[0];
  const opts = nb(f.c, f.r).filter(p => !figAt(p[0], p[1]));
  if(!opts.length) return false;
  let best = null, bestD = 999;
  opts.forEach(p => {
    const dh = dist(p[0], p[1], h.c, h.r);
    if(dh >= 4 && dh < bestD){ bestD = dh; best = p; }
  });
  if(!best){
    opts.forEach(p => {
      const dh = dist(p[0], p[1], h.c, h.r);
      if(dh > aiHoopDist(f.c, f.r) && dh < bestD){ bestD = dh; best = p; }
    });
  }
  if(!best) return false;
  const fromC = f.c, fromR = f.r;
  f.c = best[0]; f.r = best[1];
  f.px = undefined; f.py = undefined;
  f.o -= 1; f.mv = true;
  ghostTrail(f, fromC, fromR, best[0], best[1], 'rgba(251,191,36,0.5)', 4);
  if(aiIsOut3(f)){
    clearPending[f.t] = false;
    logMsg('🤖 ' + f.n + ': за дугой');
  }
  ui(); draw();
  await aiSleep(280);
  return true;
}

async function aiMoveTo(f, tc, tr, cost){
  const opts = nb(f.c, f.r).filter(p => !figAt(p[0], p[1]));
  if(!opts.length) return false;
  opts.sort((a, b) => dist(a[0], a[1], tc, tr) - dist(b[0], b[1], tc, tr));
  const step = opts[0];
  const fromC = f.c, fromR = f.r;
  f.c = step[0]; f.r = step[1];
  f.o -= (cost || 1); f.mv = true;
  ghostTrail(f, fromC, fromR, f.c, f.r, 'rgba(239,68,68,0.3)', 3);
  ui(); draw();
  await aiSleep(220);
  return true;
}

// ===== ИИ: ДРИБЛИНГ =====
async function aiTryDribble(f){
  if(!f.dribbleCd) f.dribbleCd = {};
  if(f.o < 2 || f.d < 3) return false;
  const def = aiEnemies(f, 1)[0];
  if(!def) return false;

  const myAx = toAx(f.c, f.r);
  const myHD = aiHoopDist(f.c, f.r);
  const dirs = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
  const targets = [];

  dirs.forEach(d => {
    const midOff = toOff(myAx.q + d[0], myAx.r + d[1]);
    if(midOff.c < 0 || midOff.c >= COLS || midOff.r < 0 || midOff.r >= ROWS) return;
    const midFig = figAt(midOff.c, midOff.r);
    if(!midFig || midFig.i !== def.i) return;
    for(let st = 1; st <= 2; st++){
      const tOff = toOff(myAx.q + d[0]*(1+st), myAx.r + d[1]*(1+st));
      if(tOff.c < 0 || tOff.c >= COLS || tOff.r < 0 || tOff.r >= ROWS) break;
      if(figAt(tOff.c, tOff.r)) continue;
      const dh = aiHoopDist(tOff.c, tOff.r);
      if(dh < myHD) targets.push({c: tOff.c, r: tOff.r, gain: myHD - dh});
    }
  });
  if(!targets.length) return false;
  targets.sort((a, b) => b.gain - a.gain);
  const best = targets[0];

  const list = [
    {m: 'ankle', req: 4, cost: 3, chance: 0.45},
    {m: 'spin',  req: 3, cost: 2, chance: 0.65},
    {m: 'euro',  req: 3, cost: 2, chance: 0.6},
    {m: 'cross', req: 1, cost: 1, chance: 0.85}
  ];

  for(const item of list){
    if(f.d < item.req) continue;
    if(f.dribbleCd[item.m] > 0) continue;
    if(f.o < item.cost) continue;
    if(!aiChance(item.chance)) continue;

    const dr = DRIBBLES.find(x => x.m === item.m);
    if(!dr) continue;

    const roll = Math.floor(Math.random()*6) + 1;
    const defRoll = Math.floor(Math.random()*6) + 1;
    const pen = (item.m === 'ankle') ? -3 : 0;
    const atk = f.d + pen + roll;
    const dfn = def.z + defRoll;
    const success = atk >= dfn;

    f.o -= dr.c;
    logMsg('🤖 ' + f.n + ': ' + dr.n + ' (' + atk + ' vs ' + dfn + ')');

    if(success){
      const fromC = f.c, fromR = f.r;
      f.c = best.c; f.r = best.r;
      f.px = undefined; f.py = undefined; f.mv = true;
      ghostTrail(f, fromC, fromR, best.c, best.r, 'rgba(168,85,247,0.7)', 5);

      if(item.m === 'spin') def.o = Math.max(0, def.o - 1);
      else if(item.m === 'euro') f.shootBonus = (f.shootBonus || 0) + 2;
      else if(item.m === 'ankle'){
        def.fr = 1; def.o = 0; def.a = true;
        logMsg('🦴 ' + def.n + ' УПАЛ!');
        popText('💫', cen(def.c, def.r).x, cen(def.c, def.r).y - 30, '#ef4444', 20);
      }
      logMsg('✓ Прошёл');
    } else {
      f.o = Math.max(0, f.o - 1);
      logMsg('✗ Провал');
    }
    const cd = f.d <= 2 ? 1 : (f.d <= 4 ? 2 : 3);
    f.dribbleCd[item.m] = cd;
    ui(); draw();
    await aiSleep(400);
    return true;
  }
  return false;
}

// ===== ИИ: СПОСОБНОСТИ ФИГУРЫ В АТАКЕ =====
async function aiTryOffensiveAbility(f){
  if(!f.ab || !f.ab.length) return false;
  if(f.o < 1) return false;

  const avail = f.ab.filter(a =>
    !a.p && !(a.u && f.us.indexOf(a.n) >= 0) &&
    f.o >= a.c &&
    (!f.abilityCd || !f.abilityCd[a.n] || f.abilityCd[a.n] === 0)
  );
  if(!avail.length) return false;

  const d = aiHoopDist(f.c, f.r);
  const near = aiEnemies(f, 1);
  const pressure = near.length >= 1;

  // Баффы для броска
  if(d <= 5 && f.o >= 2 && aiChance(0.35)){
    const buff = avail.find(a =>
      a.m === 'shoot_bonus3' || a.m === 'no_pressure' ||
      a.m === 'tyrant' || a.m === 'quickstep' || a.m === 'stance'
    );
    if(buff){
      f.o -= buff.c;
      if(buff.m === 'shoot_bonus3') f.shootBonus = (f.shootBonus || 0) + 3;
      else if(buff.m === 'no_pressure') f.noPressure = 1;
      else if(buff.m === 'tyrant'){ f.z += 2; f.s += 2; f.tyrantBuff = 1; }
      else if(buff.m === 'quickstep') f.quickStep = 2;
      else if(buff.m === 'stance'){ f.z += 2; f.defBuff = 2; }
      if(!f.abilityCd) f.abilityCd = {};
      f.abilityCd[buff.n] = ABILITY_CD[buff.m] || 3;
      logMsg('🤖 ' + f.n + ': ' + buff.n);
      ui(); draw();
      await aiSleep(250);
      return true;
    }
  }

  // Проход способностью
  if(pressure && aiChance(0.7)){
    const moveAb = avail.find(a =>
      a.m === 'jump' || a.m === 'phase' || a.m === 'dash' || a.m === 'slide'
    );
    if(moveAb){
      const h = hoops[0];
      const myAx = toAx(f.c, f.r);
      const dirs = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
      const rg = moveAb.m === 'jump' ? 3 : moveAb.m === 'slide' ? 3 : 2;
      let target = null, bestScore = -1e9;
      dirs.forEach(dd => {
        for(let st = 1; st <= rg; st++){
          const tOff = toOff(myAx.q + dd[0]*st, myAx.r + dd[1]*st);
          if(tOff.c < 0 || tOff.c >= COLS || tOff.r < 0 || tOff.r >= ROWS) break;
          if(figAt(tOff.c, tOff.r)) continue;
          let enemies = 0;
          fig.forEach(g => {
            if(g.t !== f.t && g.c >= 0 && dist(g.c, g.r, tOff.c, tOff.r) <= 1) enemies++;
          });
          const score = -aiHoopDist(tOff.c, tOff.r) * 3 - enemies * 2;
          if(score > bestScore){ bestScore = score; target = tOff; }
        }
      });
      if(target){
        f.o -= moveAb.c;
        const fromC = f.c, fromR = f.r;
        ghostTrail(f, fromC, fromR, target.c, target.r, 'rgba(168,85,247,0.7)', 5);
        f.c = target.c; f.r = target.r;
        f.px = undefined; f.py = undefined; f.mv = true;
        if(moveAb.u) f.us.push(moveAb.n);
        if(!f.abilityCd) f.abilityCd = {};
        f.abilityCd[moveAb.n] = ABILITY_CD[moveAb.m] || 3;
        logMsg('🤖 ' + f.n + ': ' + moveAb.n);
        ui(); draw();
        await aiSleep(380);
        return true;
      }
    }
  }

  // Дебафф врагу
  if(pressure && aiChance(0.55)){
    const deb = avail.find(a =>
      a.m === 'blind' || a.m === 'freeze' || a.m === 'sting' || a.m === 'push'
    );
    if(deb){
      const e = near[0];
      try {
        pab = deb;
        execAb({c: e.c, r: e.r, m: 'enemy', id: e.i});
        await aiSleep(380);
        return true;
      } catch(err){ pab = null; }
    }
  }

  // Видение площадки
  if(d <= 6 && aiChance(0.4)){
    const vision = avail.find(a => a.m === 'vision');
    if(vision){
      f.o -= vision.c;
      if(!f.abilityCd) f.abilityCd = {};
      f.abilityCd[vision.n] = ABILITY_CD.vision || 3;
      fig.forEach(g => {
        if(g.t === f.t && g.c >= 0) g.shootBonus = (g.shootBonus || 0) + 2;
      });
      logMsg('🤖 ' + f.n + ': Видение');
      ui(); draw();
      await aiSleep(280);
      return true;
    }
  }

  // Смена темпа
  if(aiChance(0.4)){
    const reset = avail.find(a => a.m === 'reset_cd');
    if(reset){
      f.o -= reset.c;
      if(f.dribbleCd) Object.keys(f.dribbleCd).forEach(k => f.dribbleCd[k] = 0);
      if(!f.abilityCd) f.abilityCd = {};
      f.abilityCd[reset.n] = ABILITY_CD.reset_cd || 3;
      logMsg('🤖 ' + f.n + ': Смена темпа');
      ui(); draw();
      await aiSleep(220);
      return true;
    }
  }

  // Пост-ап
  if(d <= 2 && pressure && aiChance(0.7)){
    const post = avail.find(a => a.m === 'post_up');
    if(post){
      f.o -= post.c;
      if(!f.abilityCd) f.abilityCd = {};
      f.abilityCd[post.n] = ABILITY_CD.post_up || 3;
      const def = near[0];
      const r1 = f.s + Math.floor(Math.random()*6) + 1;
      const r2 = def.s + Math.floor(Math.random()*6) + 1;
      if(r1 > r2){
        const a = toAx(f.c, f.r), b = toAx(def.c, def.r);
        const dq = Math.sign(b.q - a.q), dr = Math.sign(b.r - a.r);
        const tp = toOff(b.q + dq, b.r + dr);
        if(tp.c >= 0 && tp.c < COLS && tp.r >= 0 && tp.r < ROWS && !figAt(tp.c, tp.r)){
          def.c = tp.c; def.r = tp.r;
          def.px = undefined; def.py = undefined;
        }
        f.shootBonus = (f.shootBonus || 0) + 2;
      }
      logMsg('🤖 Пост-ап');
      ui(); draw();
      await aiSleep(300);
      return true;
    }
  }

  // Быстрый релиз / Фейдэвей
  if(d <= 4 && f.o >= 2 && aiChance(0.4)){
    const rel = avail.find(a => a.m === 'quick_release' || a.m === 'fadeaway');
    if(rel){
      f.o -= rel.c;
      if(rel.m === 'quick_release') f.quickRelease = 1;
      else f.fadeawayShot = 1;
      if(!f.abilityCd) f.abilityCd = {};
      f.abilityCd[rel.n] = 3;
      logMsg('🤖 ' + rel.n);
      ui(); draw();
      await aiSleep(200);
      return true;
    }
  }

  return false;
}

// ===== КОМАНДНЫЕ =====
async function aiTryTeamAbility(f){
  if(!f.teamCd) f.teamCd = {};

  // Алей-уп
  if(ball === f.i && f.o >= 2 && (!f.teamCd.alley || f.teamCd.alley === 0)){
    const h = hoops[0];
    const ally = aiAllies(f).find(a => dist(a.c, a.r, h.c, h.r) <= 1);
    if(ally && aiChance(0.6)){
      try { startAlley(); await aiSleep(800); return true; }
      catch(e){ console.error(e); }
    }
  }

  // Пик-н-ролл
  if(f.o >= 1 && (!f.teamCd.pickroll || f.teamCd.pickroll === 0)){
    const near = aiEnemies(f, 1);
    if(near.length >= 1 && aiChance(0.5)){
      const ally = aiAllies(f).find(a => dist(a.c, a.r, f.c, f.r) <= 2);
      if(ally){
        const enemy = aiEnemies(f, 2).find(e => dist(e.c, e.r, ally.c, ally.r) <= 2);
        if(enemy){
          try { doPickAndRoll(); await aiSleep(500); return true; }
          catch(e){ console.error(e); }
        }
      }
    }
  }

  // Отрыв
  if(ball === f.i && f.o >= 2 && (!f.teamCd.fastbreak || f.teamCd.fastbreak === 0)){
    const d = aiHoopDist(f.c, f.r);
    const near = aiEnemies(f, 1);
    if(d >= 3 && near.length === 0 && aiChance(0.5)){
      try { doFastBreak(); await aiSleep(600); return true; }
      catch(e){ console.error(e); }
    }
  }

  // Длинный пас
  if(ball === f.i && f.o >= 2 && (!f.teamCd.longpass || f.teamCd.longpass === 0)){
    const allies = aiAllies(f).filter(a => {
      const d = dist(f.c, f.r, a.c, a.r);
      if(d < 4 || d > 6) return false;
      let ne = 99;
      fig.forEach(g => {
        if(g.t !== f.t && g.c >= 0) ne = Math.min(ne, dist(g.c, g.r, a.c, a.r));
      });
      return ne >= 2;
    });
    if(allies.length && aiChance(0.4)){
      const target = allies[0];
      f.teamCd.longpass = TEAM_CD.longpass;
      f.o -= 2;
      logMsg('🤖 Длинный пас → ' + target.n);
      ball = target.i;
      delete holds[f.i];
      target.receivedPass = 1;
      ui(); draw();
      await aiSleep(500);
      return true;
    }
  }

  return false;
}

// ===== ОПЕКА + ДАВЛЕНИЕ =====
async function aiTryMarkAndPress(f){
  if(!f.o) return false;
  if(ball === f.i) return false;

  // Опека
  if(f.o >= 1 && aiChance(0.4)){
    const markedIds = Object.keys(oppMarks).map(k => parseInt(k));
    const target = aiEnemies(f, 1).find(g => markedIds.indexOf(g.i) < 0);
    if(target){
      const dH = dist(target.c, target.r, hoops[1].c, hoops[1].r);
      if(target.b >= 5 || dH <= 4){
        f.o -= 1;
        oppMarks[target.i] = f.i;
        logMsg('🤖 🎯 Опека: ' + target.n);
        popText('🎯', cen(target.c, target.r).x, cen(target.c, target.r).y - 30, '#dc2626', 18);
        ui(); draw();
        await aiSleep(280);
        return true;
      }
    }
  }

  // Давление
  if(f.o >= 1 && aiChance(0.35)){
    const dOwn = aiOwnHoopDist(f.c, f.r);
    if(dOwn <= 4 && !presses.some(p => p.c === f.c && p.r === f.r)){
      presses.push({c: f.c, r: f.r, team: f.t, owner: f.i});
      f.o -= 1;
      logMsg('🤖 🛡 Давление');
      ui(); draw();
      await aiSleep(220);
      return true;
    }
  }

  return false;
}

// ===== ИИ: С МЯЧОМ =====
async function aiWithBall(f){
  const lvl = aiLevel();
  const sit = aiAnalyze();
  const h = hoops[0];
  const d = aiHoopDist(f.c, f.r);
  const near = aiEnemies(f, 1);
  const pressure = near.length >= 1;
  const doubleTeam = near.length >= 2;
  const defendersAtHoop = fig.filter(g =>
    g.t !== f.t && g.c >= 0 && dist(g.c, g.r, h.c, h.r) <= 2
  ).length;

  // 1v1 clear
  if(aiMustClear(f)){
    if(await aiDoClear(f)) return 'move';
    return null;
  }

  // ===== 1. ОТЛИЧНЫЙ БРОСОК =====
  let tgt = d <= 1 ? 5 : d <= 3 ? 7 : 9;
  let pen = pressure ? 2 : 0;
  let bonus = 0;
  if((f.ab || []).some(a => a.n === 'Снайпер') && !f.mv) bonus += 2;
  if((f.ab || []).some(a => a.n === 'Дальнобой') && d >= 4) bonus += 1;
  if((f.ab || []).some(a => a.tag === 'catch_shoot') && f.receivedPass) bonus += 2;
  if(f.shootBonus) bonus += f.shootBonus;
  if(f.bl > 0) bonus -= 2;
  const need = (tgt + pen) - (f.b + bonus + 3.5);
  const ch = need <= -3 ? 0.95 : need <= -1 ? 0.85 : need <= 1 ? 0.65 : need <= 3 ? 0.45 : need <= 5 ? 0.25 : 0.08;

  if(ch >= 0.75 && !doubleTeam && f.o >= 2 && d <= 5){
    if(d <= 1 && f.s >= 4 && aiChance(0.7)){ doDunk(); await aiSleep(1100); return 'shot'; }
    if(d <= 1 && aiChance(0.4)){ doDunk(); await aiSleep(1100); return 'shot'; }
    if(d >= 1 && d <= 2 && aiChance(0.4)){ doFloater(); await aiSleep(1100); return 'shot'; }
    doShoot(); await aiSleep(1100); return 'shot';
  }

  // ===== 2. КОМАНДНАЯ СПОСОБНОСТЬ =====
  if(f.o >= 2 && aiChance(lvl.team)){
    if(await aiTryTeamAbility(f)) return 'move';
  }

  // ===== 3. СПОСОБНОСТЬ ФИГУРЫ =====
  if(f.o >= 1 && aiChance(lvl.abilities * 0.7)){
    if(await aiTryOffensiveAbility(f)) return 'move';
  }

  // ===== 4. ДРИБЛИНГ =====
  if(pressure && !doubleTeam && f.o >= 2 && aiChance(lvl.dribble)){
    if(await aiTryDribble(f)) return 'move';
  }

  // ===== 5. ПАС =====
  if((doubleTeam || pressure || ch < 0.4) && f.o >= 1 && aiChance(lvl.pass)){
    const allies = aiAllies(f).filter(a => dist(f.c, f.r, a.c, a.r) <= 4);
    if(allies.length){
      const scored = allies.map(a => {
        const dH = aiHoopDist(a.c, a.r);
        let ne = 99;
        fig.forEach(g => {
          if(g.t !== f.t && g.c >= 0) ne = Math.min(ne, dist(g.c, g.r, a.c, a.r));
        });
        return {ally: a, score: -dH * 2 + ne * 2};
      }).sort((x, y) => y.score - x.score);
      doPass(scored[0].ally.i);
      await aiSleep(380);
      return 'move';
    }
  }

  // ===== 6. СРЕДНИЙ БРОСОК =====
  if(ch >= 0.5 && !doubleTeam && f.o >= 2 && d <= 5){
    doShoot(); await aiSleep(1000); return 'shot';
  }

  // ===== 7. ОТЧАЯННЫЙ =====
  if(sit.desperate && f.o >= 2 && d <= 8){
    doShoot(); await aiSleep(1000); return 'shot';
  }

  // ===== 8. ТЯНЕТ ВРЕМЯ =====
  if(sit.leading && sit.late && f.o >= 1 && !pressure){
    f.o -= 1;
    logMsg('🤖 Тянет время');
    ui(); draw();
    await aiSleep(220);
    return 'move';
  }

  // ===== 9. ОТХОД ОТ КРАСКИ =====
  if(defendersAtHoop >= 2 && d <= 3 && f.o >= 1){
    const opts = nb(f.c, f.r).filter(p => !figAt(p[0], p[1]));
    let best = null, bestD = d;
    opts.forEach(p => {
      const dh = dist(p[0], p[1], h.c, h.r);
      if(dh >= 3 && dh <= 5 && dh > bestD){ bestD = dh; best = p; }
    });
    if(best){
      f.c = best[0]; f.r = best[1]; f.o -= 1;
      f.px = undefined; f.py = undefined;
      logMsg('🤖 Отход');
      ui(); draw();
      await aiSleep(220);
      return 'move';
    }
  }

  // ===== 10. ДВИЖЕНИЕ =====
  if(f.o >= 1 && await aiMoveTo(f, h.c, h.r, 1)) return 'move';
  return null;
}

// ===== ИИ: ЗАЩИТА =====
async function aiDefend(f){
  const lvl = aiLevel();
  const bh = byId(ball);
  if(!bh || bh.t === f.t) return null;
  const d = dist(f.c, f.r, bh.c, bh.r);

  // Отбор
  if(d <= 1 && f.o >= 1 && aiChance(lvl.defense * 0.9)){
    doSteal();
    await aiSleep(380);
    return 'steal';
  }

  // Дебаффы
  if(d <= 1 && f.o >= 1 && aiChance(lvl.abilities * 0.8) && f.ab){
    const avail = f.ab.filter(a =>
      !a.p && !(a.u && f.us.indexOf(a.n) >= 0) && f.o >= a.c &&
      (!f.abilityCd || !f.abilityCd[a.n] || f.abilityCd[a.n] === 0)
    );
    const deb = avail.find(a =>
      a.m === 'blind' || a.m === 'freeze' || a.m === 'sting' || a.m === 'push'
    );
    if(deb){
      try {
        pab = deb;
        execAb({c: bh.c, r: bh.r, m: 'enemy', id: bh.i});
        await aiSleep(380);
        return 'move';
      } catch(e){ pab = null; }
    }
  }

  // Опека / давление
  if(aiChance(lvl.smart * 0.5)){
    if(await aiTryMarkAndPress(f)) return 'move';
  }

  // Позиция
  if(f.o >= 1){
    const oH = hoops[1];
    const opts = nb(f.c, f.r).filter(p => !figAt(p[0], p[1]));
    let best = null, bs = -1e9;
    opts.forEach(p => {
      const dm = dist(p[0], p[1], bh.c, bh.r);
      const dh = dist(p[0], p[1], oH.c, oH.r);
      const btw = dm + dh - dist(bh.c, bh.r, oH.c, oH.r);
      let s = -dm*2.8 - dh*0.4 - btw*0.6;
      if(oppMarks[f.i] !== undefined){
        const marked = byId(oppMarks[f.i]);
        if(marked) s -= dist(p[0], p[1], marked.c, marked.r) * 1.5;
      }
      if(s > bs){ bs = s; best = p; }
    });
    if(best){
      f.c = best[0]; f.r = best[1]; f.o -= 1;
      f.px = undefined; f.py = undefined;
      ui(); draw();
      await aiSleep(200);
      return 'move';
    }
  }
  return null;
}

// ===== ИИ: БЕЗ МЯЧА (атака) =====
async function aiOffBall(f){
  const bh = byId(ball);
  if(!bh) return null;

  if(bh.t === f.t){
    if(f.o >= 1){
      const opts = nb(f.c, f.r).filter(p => !figAt(p[0], p[1]));
      let best = null, bs = -1e9;
      opts.forEach(p => {
        const dh = aiHoopDist(p[0], p[1]);
        let pressure = 0;
        fig.forEach(g => {
          if(g.t !== f.t && g.c >= 0 && dist(g.c, g.r, p[0], p[1]) <= 1) pressure += 2;
        });
        const s = -dh * 1.8 - pressure * 3;
        if(s > bs){ bs = s; best = p; }
      });
      if(best){
        f.c = best[0]; f.r = best[1]; f.o -= 1;
        f.px = undefined; f.py = undefined;
        ui(); draw();
        await aiSleep(200);
        return 'move';
      }
    }
    return null;
  }

  return await aiDefend(f);
}

// ===== ИИ: ОДИН ШАГ =====
async function aiStep(f){
  if(ball === f.i) return await aiWithBall(f);
  const bh = byId(ball);
  if(bh && bh.t !== f.t) return await aiDefend(f);
  return await aiOffBall(f);
}

// ===== ИИ: ИГРА ФИГУРОЙ =====
async function aiPlayFigure(f){
  let guard = 25;
  while(f.o > 0 && turn === 1 && !over && guard-- > 0){
    const r = await aiStep(f);
    if(!r) break;
    if(r === 'shot') break;
    await aiSleep(160);
  }
}

// ===== ИИ: ИГРА ВСЕЙ КОМАНДОЙ =====
playAllAI = async function(){
  if(aiRunning) return;
  aiRunning = true;
  logMsg('🤖 ИИ (' + aiDifficulty + ')...');

  const maxMoves = doubleMoveEnabled ? 2 : 1;
  let moved = 0;

  try {
    let guard = 20;
    while(turn === 1 && !over && guard-- > 0 && moved < maxMoves){
      const cands = fig.filter(x =>
        x.t === 1 && !x.a && x.c >= 0 && x.penalty === 0 && x.fr === 0
      );
      if(!cands.length) break;

      // Выбор фигуры
      let f = null;
      if(aiDifficulty === 'easy'){
        f = cands.find(x => ball === x.i) || cands[0];
      } else {
        let bestScore = -999;
        cands.forEach(cand => {
          let score = 0;
          if(ball === cand.i) score += 100;
          score += cand.o * 5;
          const dh = aiHoopDist(cand.c, cand.r);
          score += (10 - dh) * 3;
          const bo = byId(ball);
          if(bo && bo.t === 0){
            const dm = dist(cand.c, cand.r, bo.c, bo.r);
            score += (8 - dm) * 4;
          }
          if(score > bestScore){ bestScore = score; f = cand; }
        });
      }
      if(!f) break;

      sel = f.i;
      reHL(); ui(); draw();
      await aiSleep(200);

      await aiPlayFigure(f);

      if(!f.a && !over){
        f.a = true;
        f.o = 0;
        moved++;
        movesThisTurn = moved;
        await aiSleep(120);
      }
    }

    // Завершаем ход
    if(turn === 1 && !over){
      fig.forEach(g => {
        if(g.t === 1 && !g.a && g.c >= 0){ g.a = true; g.o = 0; }
      });
      switchTurn();
    }
  } catch(e){
    console.error('AI error:', e);
    logMsg('⚠ Ошибка ИИ, пропуск хода');
    try {
      fig.forEach(g => {
        if(g.t === 1 && !g.a && g.c >= 0){ g.a = true; g.o = 0; }
      });
      if(turn === 1 && !over) switchTurn();
    } catch(e2){}
  } finally {
    aiRunning = false;
  }
};

  }
};

function getTeamPositions(teamIdx, attacking, swap){
  var f = FORMATIONS[gameMode] || FORMATIONS['5v5'];
  var positions;

  if(teamIdx === 0){
    positions = attacking ? f.greenAttack : f.greenDefendDown;
  } else {
    positions = attacking ? f.redAttack : f.redDefendUp;
  }

  if(!swap){
    return positions.map(function(p){ return [p[0], ROWS - 1 - p[1]]; });
  }
  return positions;
}

function applyFormation(ballOwnerTeam){
  var swap = true;
  try {
    var s = localStorage.getItem('ib_greenBottom');
    swap = (s === null) ? true : (s === '1');
  } catch(e){}

  var greenAttacking = ballOwnerTeam === 0;
  var greenPos = getTeamPositions(0, greenAttacking, swap);
  var redPos = getTeamPositions(1, !greenAttacking, swap);

  var greenFig = fig.filter(function(f){ return f.t === 0; });
  var redFig = fig.filter(function(f){ return f.t === 1; });

  greenFig.forEach(function(f, i){
    if(greenPos[i]){
      f.c = greenPos[i][0];
      f.r = greenPos[i][1];
      f.px = undefined;
      f.py = undefined;
      f._animating = false;
    }
  });

  redFig.forEach(function(f, i){
    if(redPos[i]){
      f.c = redPos[i][0];
      f.r = redPos[i][1];
      f.px = undefined;
      f.py = undefined;
      f._animating = false;
    }
  });

  pA = greenPos.slice();
  pB = redPos.slice();
  render();
}

var stealLimit = 2;
var stealsThisTurn = {0: 0, 1: 0};

function resetStealLimit(){
  stealsThisTurn = {0: 0, 1: 0};
}

function canSteal(teamIdx){
  return stealsThisTurn[teamIdx] < stealLimit;
}

// Сброс при смене хода
var _switchTurn_steal = switchTurn;
switchTurn = function(){
  resetStealLimit();
  _switchTurn_steal();
};

  resetStealLimit();
  _newRound_steal();
};

// ===== 2. НЕРФ ОТБОРА =====
var _doSteal_nerf = doSteal;
doSteal = function(){
  var f = byId(sel);
  if(!f) return _doSteal_nerf();

  // Лимит
  if(!canSteal(f.t)){
    logMsg('⏳ Лимит отборов исчерпан (2 за ход)');
    return;
  }

  // Нерф: -2 к атаке отбора
  var bh = byId(ball);
  if(!bh || dist(f.c, f.r, bh.c, bh.r) !== 1) return _doSteal_nerf();
  if(f.o < 1) return _doSteal_nerf();

  // Ослепление
  if(f.bl > 0){ logMsg('✦ Ослеплён'); return; }

  f.o -= 1;
  stealsThisTurn[f.t] = (stealsThisTurn[f.t] || 0) + 1;

  var atk = f.z - 2 + Math.floor(Math.random()*6) + 1;
  var def = bh.d + Math.floor(Math.random()*6) + 1 + (holds[bh.i] ? 2 : 0);
  logMsg('🤚 Отбор ' + f.n + ' ' + atk + ' vs ' + bh.n + ' ' + def + ' [' + stealsThisTurn[f.t] + '/' + stealLimit + ']');

  if(atk >= def){
    ball = f.i;
    delete holds[bh.i];
    logMsg('✓ Мяч у ' + f.n);
    popText('ОТБОР!', cen(f.c, f.r).x, cen(f.c, f.r).y - 25, '#22c55e', 18);
    // Автосмена формации
    setTimeout(function(){ if(typeof applyFormation === 'function') applyFormation(f.t); }, 300);
  } else {
    logMsg('✗ Не удалось');
    if(atk <= def - 4){
      f.fouls++;
      logMsg('⚠ ФОЛ! ' + f.n + ' (' + f.fouls + '/5)');
      if(f.fouls >= 5) sendToPenalty(f, 3);
    }
  }
  if(f.o <= 0) end();
  else { reHL(); ui(); draw(); }
};

var _doPass_nerf = doPass;
doPass = function(targetId){
  var f = byId(sel);
  if(!f || ball !== f.i || f.o < 1) return _doPass_nerf(targetId);
  var t = byId(targetId);
  if(!t) return;

  var hasCamou = (f.ab || []).some(function(a){ return a.tag === 'camouflage'; }) || f.camouflage;

  if(!hasCamou){
    var int = null, br = 0;
    fig.forEach(function(g){
      if(g.t === f.t || g.c < 0) return;
      // Нерф: только вплотную (1 гекс) — было 1
      var minD = Math.min(
        dist(g.c, g.r, f.c, f.r),
        dist(g.c, g.r, t.c, t.r)
      );
      if(minD > 1) return; // было 1, теперь тоже 1 — но шансы ниже
      // Нерф бонуса: +1 вместо +2
      var roll = g.z + Math.floor(Math.random()*6) + 1 + 1;
      if(roll > br){ br = roll; int = g; }
    });

    if(int){
      // Нерф: пасующий получает +3 (было без бонуса)
      var pr = f.d + 3 + Math.floor(Math.random()*6) + 1;
      logMsg('Перехват ' + int.n + ' ' + br + ' vs пас ' + pr);
      if(br >= pr){
        f.o -= 1;
        ball = int.i;
        delete holds[f.i];
        logMsg('🚫 ПЕРЕХВАТ! ' + int.n);
        mode = 'sel'; hl = [];
        // Автосмена формации
        setTimeout(function(){ if(typeof applyFormation === 'function') applyFormation(int.t); }, 300);
        if(f.o <= 0) end();
        else { reHL(); ui(); draw(); }
        return;
      }
    }
  } else {
    f.camouflage = 0;
  }

  // Обычный пас
  _doPass_nerf(targetId);
};

// ===== 1. ПЕРЕХВАТ КАК ОТДЕЛЬНЫЙ СТАТ =====
function getSteal(f){
  // Перехват = Защ - 1 (минимум 0)
  return Math.max(0, f.z - 1);
}

// ===== 2. ОПАСНОСТЬ ПАСА =====
var pendingPassId = null;
var passDangerLevel = 0;

function calcPassDanger(from, to){
  var danger = 0;
  fig.forEach(function(g){
    if(g.t === from.t || g.c < 0) return;
    var dFrom = dist(g.c, g.r, from.c, from.r);
    var dTo = dist(g.c, g.r, to.c, to.r);
    var midC = Math.round((from.c + to.c) / 2);
    var midR = Math.round((from.r + to.r) / 2);
    var dMid = dist(g.c, g.r, midC, midR);
    var m = Math.min(dFrom, dTo, dMid);
    if(m <= 1) danger += 3;
    else if(m <= 2) danger += 1;
  });
  return danger;
}

function dangerColor(d){
  if(d === 0) return '#22c55e';
  if(d <= 2) return '#fbbf24';
  return '#ef4444';
}
function dangerLabel(d){
  if(d === 0) return '🟢 Безопасно';
  if(d <= 2) return '🟡 Средне';
  return '🔴 Опасно!';
}

// ===== 3. ПЕРЕХВАТ ЧЕРЕЗ getSteal (перезапись doPass) =====
var _doPass_steal = doPass;
doPass = function(targetId){
  var f = byId(sel);
  if(!f || ball !== f.i || f.o < 1) return _doPass_steal(targetId);
  var t = byId(targetId);
  if(!t) return;

  var hasCamou = (f.ab || []).some(function(a){ return a.tag === 'camouflage'; }) || f.camouflage;

  if(!hasCamou){
    var int = null, br = 0;
    fig.forEach(function(g){
      if(g.t === f.t || g.c < 0) return;
      var minD = Math.min(
        dist(g.c, g.r, f.c, f.r),
        dist(g.c, g.r, t.c, t.r)
      );
      if(minD > 1) return;
      // Используем ПЕРЕХВАТ (не Защ)
      var roll = getSteal(g) + Math.floor(Math.random()*6) + 1 + 1;
      if(roll > br){ br = roll; int = g; }
    });

    if(int){
      var pr = f.d + 3 + Math.floor(Math.random()*6) + 1;
      logMsg('Перехват ' + int.n + ' (пер:' + getSteal(int) + ') ' + br + ' vs пас ' + pr);
      if(br >= pr){
        f.o -= 1;
        ball = int.i;
        delete holds[f.i];
        logMsg('🚫 ПЕРЕХВАТ! ' + int.n);
        mode = 'sel'; hl = [];
        pendingPassId = null;
        if(typeof applyFormation === 'function') setTimeout(function(){ applyFormation(int.t); }, 300);
        if(f.o <= 0) end();
        else { reHL(); ui(); draw(); }
        return;
      }
    }
  } else {
    f.camouflage = 0;
  }

  _doPass_steal(targetId);
};

// ===== 4. ПАС С ПОДТВЕРЖДЕНИЕМ =====
var _hmc_passConfirm = handleModeClick;
handleModeClick = function(col, row){
  if(mode === 'pass'){
    var f = byId(sel);
    if(!f) return;

    var h = hl.find(function(hh){ return hh.c === col && hh.r === row; });

    // Клик мимо — отмена
    if(!h || h.id === undefined){
      pendingPassId = null;
      mode = 'sel'; hl = []; reHL(); ui(); draw();
      return;
    }

    // Повторный клик на того же — пас!
    if(pendingPassId === h.id){
      var tid = h.id;
      pendingPassId = null;
      passDangerLevel = 0;
      doPass(tid);
      return;
    }

    // Первый клик — выбор цели + опасность
    pendingPassId = h.id;
    var target = byId(h.id);
    if(target){

  // ЖЁСТКАЯ проверка sel
  if(sel !== null){
    var curCheck = byId(sel);
    if(!curCheck || curCheck.t !== turn || curCheck.a || curCheck.fr > 0 || curCheck.penalty > 0){
      sel = null;
      hl = [];
      ui(); draw();
      return;
    }
  }

  var fa = figAt(col, row);

  // Клик по фигуре ИИ — игнор
  if(fa && fa.t !== turn) return;

  // Клик по своей фигуре
  if(fa && fa.t === turn && !fa.a){
    if(fa.fr > 0){ logMsg('💫 ' + fa.n + ' упал'); return; }
    if(fa.penalty > 0){ logMsg('🚫 ' + fa.n + ' в штрафном'); return; }
    if(sel !== null){
      var cur = byId(sel);
      if(cur && cur.o < cur.mo) return;
    }
    sel = fa.i;
    reHL(); ui(); draw();
    return;
  }

  // Движение
  if(sel !== null && hl.some(function(h){ return h.c === col && h.r === row; })){
    var f = byId(sel);
    if(!f) return;

    // Двойная страховка
    if(f.t !== turn){
      sel = null; hl = []; ui(); draw();
      return;
    }

    if(figAt(col, row)) return;

    var press = presses.find(function(p){
      return p.c === col && p.r === row && p.team !== f.t;
    });
    var cost = (ball === f.i) ? 2 : 1;
    if(press) cost += 1;

    if(f.o < cost){ logMsg('Мало ОД'); return; }

    var fromC = f.c, fromR = f.r;
    f.c = col; f.r = row;
    f.o -= cost; f.mv = true;

    ghostTrail(f, fromC, fromR, col, row,
      f.t === 0 ? 'rgba(34,197,94,0.35)' : 'rgba(239,68,68,0.35)', 4);

    if(press){
      popText('⚡ -1 ОД', cen(col, row).x, cen(col, row).y - 30, '#fbbf24', 14);
      burst(cen(col, row).x, cen(col, row).y, '#fbbf24', 8, 2);
    }

    if(gameMode === '1v1' && clearPending[f.t] &&
       dist(f.c, f.r, hoops[0].c, hoops[0].r) >= 4){
      clearPending[f.t] = false;
      logMsg('✓ За дугой');
    }

    if(f.o <= 0) end();
    else { reHL(); ui(); draw(); }
    return;
  }

  // Клик мимо — сброс
  if(sel !== null){
    var cur2 = byId(sel);
    if(cur2 && cur2.o === cur2.mo){
      sel = null; hl = []; ui(); draw();
    }
  }
};
