applyFormation = function(ballOwnerTeam){
  var swap = true;
  try {
    var s = localStorage.getItem('ib_greenBottom');
    swap = (s === null) ? true : (s === '1');
  } catch(e){}

  var rot = ROTATIONS[activeRotation] || ROTATIONS[0];
  var count = (MODE_PRESETS[gameMode] || MODE_PRESETS['5v5']).count;

  var mirror = function(pos){
    return pos.map(function(p){ return [p[0], ROWS - 1 - p[1]]; });
  };

  var greenAtt = rot.greenAtt.slice(0, count);
  var redDef = rot.redDef.slice(0, count);

  // Зеркалим атаку красных
  var redAtt = mirror(greenAtt);
  var greenDef = mirror(redDef);

  var greenPos, redPos;
  if(ballOwnerTeam === 0){
    greenPos = greenAtt;
    redPos = redDef;
  } else {
    greenPos = greenDef;
    redPos = redAtt;
  }

  if(!swap){
    greenPos = mirror(greenPos);
    redPos = mirror(redPos);
  }

  var greenFig = fig.filter(function(x){ return x.t === 0; });
  var redFig = fig.filter(function(x){ return x.t === 1; });

  greenFig.forEach(function(fg, i){
    if(greenPos[i]){
      fg.c = greenPos[i][0]; fg.r = greenPos[i][1];
      fg.px = undefined; fg.py = undefined;
      fg._animating = false;
    }
  });

  redFig.forEach(function(fg, i){
    if(redPos[i]){
      fg.c = redPos[i][0]; fg.r = redPos[i][1];
      fg.px = undefined; fg.py = undefined;
      fg._animating = false;
    }
  });

  pA = greenPos.slice();
  pB = redPos.slice();
  render();
};

function startMark(){
  var f = byId(sel);
  if(!f || f.o < 1) return;
  if(ball === f.i){ logMsg('Сначала отдай мяч'); return; }

  mode = 'mark';
  hl = [];
  fig.forEach(function(g){
    if(g.t !== f.t && g.c >= 0 && dist(g.c, g.r, f.c, f.r) <= 1){
      hl.push({c: g.c, r: g.r, m: 'enemy', id: g.i});
    }
  });
  if(!hl.length){
    logMsg('Нет врагов рядом');
    mode = 'sel';
    return;
  }
  ui(); draw();
}

function doMark(targetId){
  var f = byId(sel);
  var t = byId(targetId);
  if(!f || !t) return;
  if(f.o < 1) return;

  f.o -= 1;
  oppMarks[targetId] = f.i;
  logMsg('🎯 ' + f.n + ' опекает ' + t.n);
  popText('🎯 ОПЕКА', cen(t.c, t.r).x, cen(t.c, t.r).y - 34, '#dc2626', 14);

  mode = 'sel'; hl = [];
  if(f.o <= 0) end();

}

    var r = _doShoot_markFix();
    setTimeout(function(){ f.b += 1; }, 200);

  }

};

// ===== 2. УМНЫЙ ИИ =====
// ИИ НЕ идёт отбирать в проходе, держит позицию защиты

function aiLevel(){
  if(aiDifficulty === 'hard')
    return {smart: 1.0, pass: 0.9, dribble: 0.9, abilities: 1.0, defense: 1.0, team: 0.85};
  if(aiDifficulty === 'easy')
    return {smart: 0.4, pass: 0.4, dribble: 0.25, abilities: 0.25, defense: 0.4, team: 0.15};
  return {smart: 0.75, pass: 0.7, dribble: 0.65, abilities: 0.7, defense: 0.75, team: 0.5};
}

function aiEnemies(f, r){
  return fig.filter(function(g){
    return g.t !== f.t && g.c >= 0 && dist(g.c, g.r, f.c, f.r) <= (r || 1);
  });
}
function aiAllies(f){
  return fig.filter(function(g){ return g.t === f.t && g.i !== f.i && g.c >= 0; });
}
function aiHoopDist(c, r){ return dist(c, r, hoops[0].c, hoops[0].r); }
function aiOwnHoopDist(c, r){ return dist(c, r, hoops[1].c, hoops[1].r); }

// Проверка лимита отбора
function aiCanSteal(f){
  if(f.stealsThisTurn === undefined) f.stealsThisTurn = 0;
  return f.stealsThisTurn < 2;
}

// ===== ИИ: ЗАЩИТА (умная) =====
aiDefend = async function(f){
  var lvl = aiLevel();
  var bh = byId(ball);
  if(!bh || bh.t === f.t) return null;
  var d = dist(f.c, f.r, bh.c, bh.r);

  // Мяч у игрока бежит к кольцу — держим позицию
  var attackHoop = hoops[0];
  var dToHoop = dist(bh.c, bh.r, attackHoop.c, attackHoop.r);

  // Игрок в проходе (близко к кольцу)
  if(dToHoop <= 3 && d > 1){
    // НЕ идём отбирать — встаём между игроком и кольцом
    if(f.o >= 1){
      var opts = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
      var best = null, bs = -1e9;
      opts.forEach(function(p){
        var dm = dist(p[0], p[1], bh.c, bh.r);
        var dh = dist(p[0], p[1], attackHoop.c, attackHoop.r);
        var btw = dm + dh - dist(bh.c, bh.r, attackHoop.c, attackHoop.r);
        var s = -btw * 3 - dh * 1;
        if(s > bs){ bs = s; best = p; }
      });
      if(best){
        f.c = best[0]; f.r = best[1]; f.o -= 1;
        f.px = undefined; f.py = undefined;
        ui(); draw();
        await aiSleep(180);
        return 'move';
      }
    }
    return null;
  }

  // Отбор только вплотную
  if(d <= 1 && f.o >= 1 && aiCanSteal(f) && aiChance(lvl.defense * 0.9)){
    f.stealsThisTurn = (f.stealsThisTurn || 0) + 1;
    doSteal();
    await aiSleep(380);
    return 'steal';
  }

  // Способности вплотную
  if(d <= 1 && f.o >= 1 && f.ab && aiChance(lvl.abilities * 0.8)){
    var avail = f.ab.filter(function(a){
      return !a.p && !(a.u && f.us.indexOf(a.n) >= 0) && f.o >= a.c &&
        (!f.abilityCd || !f.abilityCd[a.n] || f.abilityCd[a.n] === 0);
    });
    var deb = avail.find(function(a){
      return a.m === 'blind' || a.m === 'freeze' || a.m === 'sting' || a.m === 'push';
    });
    if(deb){
      try {
        pab = deb;
        execAb({c: bh.c, r: bh.r, m: 'enemy', id: bh.i});
        await aiSleep(380);
        return 'move';
      } catch(e){ pab = null; }
    }
  }

  // Позиция между мячом и кольцом
  if(f.o >= 1){
    var oH = hoops[1];
    var opts2 = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
    var best2 = null, bs2 = -1e9;
    opts2.forEach(function(p){
      var dm = dist(p[0], p[1], bh.c, bh.r);
      var dh = dist(p[0], p[1], oH.c, oH.r);
      var btw = dm + dh - dist(bh.c, bh.r, oH.c, oH.r);
      var s = -dm * 2.5 - dh * 0.4 - btw * 0.6;
      if(s > bs2){ bs2 = s; best2 = p; }
    });
    if(best2){
      f.c = best2[0]; f.r = best2[1]; f.o -= 1;
      f.px = undefined; f.py = undefined;
      ui(); draw();
      await aiSleep(200);
      return 'move';
    }
  }
  return null;
};

// ===== ИИ: С МЯЧОМ =====
async function aiWithBall(f){
  var lvl = aiLevel();
  var h = hoops[0];
  var d = aiHoopDist(f.c, f.r);
  var near = aiEnemies(f, 1);
  var pressure = near.length >= 1;
  var doubleTeam = near.length >= 2;
  var defendersAtHoop = fig.filter(function(g){
    return g.t !== f.t && g.c >= 0 && dist(g.c, g.r, h.c, h.r) <= 2;
  }).length;

  // 1v1 clear
  if(gameMode === '1v1' && clearPending[f.t] && d < 4){
    if(f.o >= 1){
      var opts = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
      var best = null, bd = -1;
      opts.forEach(function(p){
        var dh = dist(p[0], p[1], h.c, h.r);
        if(dh >= 4 && dh > bd){ bd = dh; best = p; }
      });
      if(best){
        f.c = best[0]; f.r = best[1]; f.o -= 1;
        f.px = undefined; f.py = undefined;
        clearPending[f.t] = false;
        logMsg('🤖 за дугу');
        ui(); draw();
        await aiSleep(280);
        return 'move';
      }
    }
    return null;
  }

  // Оценка броска
  var tgt = d <= 1 ? 5 : d <= 3 ? 7 : 9;
  var pen = pressure ? 2 : 0;
  var bonus = 0;
  if((f.ab || []).some(function(a){ return a.n === 'Снайпер'; }) && !f.mv) bonus += 2;
  if((f.ab || []).some(function(a){ return a.n === 'Дальнобой'; }) && d >= 4) bonus += 1;
  if(f.shootBonus) bonus += f.shootBonus;
  if(f.bl > 0) bonus -= 2;
  var need = (tgt + pen) - (f.b + bonus + 3.5);
  var ch = need <= -3 ? 0.95 : need <= -1 ? 0.85 : need <= 1 ? 0.65 : need <= 3 ? 0.45 : need <= 5 ? 0.25 : 0.08;

  // 1) Отличный бросок
  if(ch >= 0.72 && !doubleTeam && f.o >= 2 && d <= 5){
    if(d <= 1 && f.s >= 4 && aiChance(0.7)){ doDunk(); await aiSleep(1100); return 'shot'; }
    if(d <= 1 && aiChance(0.4)){ doDunk(); await aiSleep(1100); return 'shot'; }
    if(d >= 1 && d <= 2 && aiChance(0.4)){ doFloater(); await aiSleep(1100); return 'shot'; }
    doShoot(); await aiSleep(1100); return 'shot';
  }

  // 2) Командные
  if(f.o >= 2 && aiChance(lvl.team)){
    if(await aiTryTeamAbility(f)) return 'move';
  }

  // 3) Способности
  if(f.o >= 1 && aiChance(lvl.abilities * 0.7)){
    if(await aiTryOffensiveAbility(f)) return 'move';
  }

  // 4) Дриблинг
  if(pressure && !doubleTeam && f.o >= 2 && aiChance(lvl.dribble)){
    if(await aiTryDribble(f)) return 'move';
  }

  // 5) Пас
  if((doubleTeam || pressure || ch < 0.4) && f.o >= 1 && aiChance(lvl.pass)){
    var allies = aiAllies(f).filter(function(a){
      return dist(f.c, f.r, a.c, a.r) <= 4;
    });
    if(allies.length){
      var scored = allies.map(function(a){
        var dH = aiHoopDist(a.c, a.r);
        var ne = 99;
        fig.forEach(function(g){
          if(g.t !== f.t && g.c >= 0) ne = Math.min(ne, dist(g.c, g.r, a.c, a.r));
        });
        return {ally: a, score: -dH * 2 + ne * 2};
      }).sort(function(x, y){ return y.score - x.score; });
      doPass(scored[0].ally.i);
      await aiSleep(380);
      return 'move';
    }
  }

  // 6) Средний бросок
  if(ch >= 0.5 && !doubleTeam && f.o >= 2 && d <= 5){
    doShoot(); await aiSleep(1000); return 'shot';
  }

  // 7) Отчаянный
  var sit = {desperate: (sc[1] - sc[0]) < -5};
  if(sit.desperate && f.o >= 2 && d <= 8){
    doShoot(); await aiSleep(1000); return 'shot';
  }

  // 8) Тянет время
  if(sc[1] > sc[0] + 5 && Math.max(sc[0], sc[1]) >= 15 && f.o >= 1 && !pressure){
    f.o -= 1;
    ui(); draw();
    await aiSleep(220);
    return 'move';
  }

  // 9) Отход от краски
  if(defendersAtHoop >= 2 && d <= 3 && f.o >= 1){
    var opts3 = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
    var best3 = null, bestD3 = d;
    opts3.forEach(function(p){
      var dh = dist(p[0], p[1], h.c, h.r);
      if(dh >= 3 && dh <= 5 && dh > bestD3){ bestD3 = dh; best3 = p; }
    });
    if(best3){
      f.c = best3[0]; f.r = best3[1]; f.o -= 1;
      f.px = undefined; f.py = undefined;
      ui(); draw();
      await aiSleep(220);
      return 'move';
    }
  }

  // 10) Движение к кольцу
  if(f.o >= 1){
    var opts4 = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
    if(opts4.length){
      opts4.sort(function(a, b){
        return dist(a[0], a[1], h.c, h.r) - dist(b[0], b[1], h.c, h.r);
      });
      var step = opts4[0];
      f.c = step[0]; f.r = step[1]; f.o -= 1;
      f.px = undefined; f.py = undefined;
      f.mv = true;
      ui(); draw();
      await aiSleep(200);
      return 'move';
    }
  }
  return null;
}

// ===== ИИ: БЕЗ МЯЧА =====
async function aiOffBall(f){
  var bh = byId(ball);
  if(!bh) return null;

  if(bh.t === f.t){
    if(f.o >= 1){
      var opts = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
      var best = null, bs = -1e9;
      opts.forEach(function(p){
        var dh = aiHoopDist(p[0], p[1]);
        var pressure = 0;
        fig.forEach(function(g){
          if(g.t !== f.t && g.c >= 0 && dist(g.c, g.r, p[0], p[1]) <= 1) pressure += 2;
        });
        var s = -dh * 1.8 - pressure * 3;
        if(s > bs){ bs = s; best = p; }
      });
      if(best){
        f.c = best[0]; f.r = best[1]; f.o -= 1;
        f.px = undefined; f.py = undefined;
        ui(); draw();
        await aiSleep(200);
        return 'move';
      }
    }
    return null;
  }
  return await aiDefend(f);
}

// ===== ИИ: ОДИН ШАГ =====
async function aiStep(f){
  if(ball === f.i) return await aiWithBall(f);
  var bh = byId(ball);
  if(bh && bh.t !== f.t) return await aiDefend(f);
  return await aiOffBall(f);
}

// ===== ИИ: ИГРА ФИГУРОЙ =====
async function aiPlayFigure(f){
  var guard = 25;
  while(f.o > 0 && turn === 1 && !over && guard-- > 0){
    var r = await aiStep(f);
    if(!r) break;
    if(r === 'shot') break;
    await aiSleep(160);
  }
}

// ===== ИИ: ИГРА КОМАНДОЙ =====
playAllAI = async function(){
  if(aiRunning) return;
  aiRunning = true;
  logMsg('🤖 ИИ (' + aiDifficulty + ')...');

  var maxMoves = doubleMoveEnabled ? 2 : 1;
  var moved = 0;

  try {
    var guard = 20;
    while(turn === 1 && !over && guard-- > 0 && moved < maxMoves){
      var cands = fig.filter(function(x){
        return x.t === 1 && !x.a && x.c >= 0 && x.penalty === 0 && x.fr === 0;
      });
      if(!cands.length) break;

      var f = null;
      if(aiDifficulty === 'easy'){
        f = cands.find(function(x){ return ball === x.i; }) || cands[0];
      } else {
        var bestScore = -999;
        cands.forEach(function(cand){
          var score = 0;
          if(ball === cand.i) score += 100;
          score += cand.o * 5;
          score += (10 - aiHoopDist(cand.c, cand.r)) * 3;
          var bo = byId(ball);
          if(bo && bo.t === 0){
            score += (8 - dist(cand.c, cand.r, bo.c, bo.r)) * 4;
          }
          if(score > bestScore){ bestScore = score; f = cand; }
        });
      }
      if(!f) break;

      sel = f.i;
      reHL(); ui(); draw();
      await aiSleep(220);

      await aiPlayFigure(f);

      if(!f.a && !over){
        f.a = true;
        f.o = 0;
        moved++;
        movesThisTurn = moved;
        await aiSleep(120);
      }
    }

    if(turn === 1 && !over){
      fig.forEach(function(g){
        if(g.t === 1 && !g.a && g.c >= 0){ g.a = true; g.o = 0; }
      });
      switchTurn();
    }
  } catch(e){
    console.error('AI error:', e);
    try {
      fig.forEach(function(g){
        if(g.t === 1 && !g.a && g.c >= 0){ g.a = true; g.o = 0; }
      });
      if(turn === 1 && !over) switchTurn();
    } catch(e2){}
  } finally {
    aiRunning = false;
    sel = null;
    hl = [];
  }
};

// ===== 1. УСИЛЕНИЕ СРЕДНИХ БРОСКОВ =====
// Мид (2-3 гекса) — легче на +1 к цели
// Трёха (4-5) — легче на +1

// ===== 2. ДАНК-ПРЫЖОК (визуальная анимация прыжка к кольцу) =====
function dunkJumpAnimation(f, hoop, onDone){
  // Анимация: фигура прыгает к кольцу и обратно
  var startPx = cen(f.c, f.r);
  var hoopPx = cen(hoop.c, hoop.r);
  var midX = (startPx.x + hoopPx.x) / 2;
  var midY = (startPx.y + hoopPx.y) / 2 - S * 1.2;

  f._animating = true;
  var FRAMES = 24;
  var i = 0;

  function step(){
    if(i > FRAMES){
      f.px = startPx.x;
      f.py = startPx.y;
      f._animating = false;
      render();
      if(onDone) onDone();
      return;
    }
    var t = i / FRAMES;
    var u = 1 - t;
    // Квадратичная кривая Безье через верхнюю точку
    var px = u*u * startPx.x + 2*u*t * midX + t*t * hoopPx.x;
    var py = u*u * startPx.y + 2*u*t * midY + t*t * hoopPx.y;

    f.px = px;
    f.py = py;

    // Траил
    if(i > 0 && i % 3 === 0){
      fx.push({
        type: 'ghost',
        x: px, y: py,
        color: 'rgba(249,115,22,0.5)',
        life: 18, maxLife: 18,
        size: S * 0.5
      });
    }

    render();
    i++;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ===== 3. ДАНК С ПРЫЖКОМ =====
var _doDunk_jump = doDunk;
doDunk = function(){
  var f = byId(sel);
  if(!f || ball !== f.i || f.o < 2) return _doDunk_jump();

  var hoop = hoops[1 - f.t];
  var d = dist(f.c, f.r, hoop.c, hoop.r);
  if(d > 1) return _doDunk_jump();

  // Прыжок к кольцу
  dunkJumpAnimation(f, hoop, function(){
    // После прыжка — сам данк
    _doDunk_jump();
  });
};

// ===== 4. АЛЕЙ-УП С ПРЫЖКОМ =====
// Сохраняем старую startAlley
var _startAlley_jump = startAlley;
startAlley = function(){
  var f = byId(sel);
  if(!f || ball !== f.i || f.o < 2) return;

  var h = hoops[1 - f.t];
  var ally = fig.find(function(g){
    return g.t === f.t && g.i !== f.i && g.c >= 0 &&
      dist(g.c, g.r, h.c, h.r) <= 1;
  });
  if(!ally) return _startAlley_jump();

  // Сначала пас, потом прыжок союзника
  _startAlley_jump();

  // Прыжок союзника после получения
  setTimeout(function(){
    if(ally && dist(ally.c, ally.r, h.c, h.r) <= 1){
      dunkJumpAnimation(ally, h, function(){});
    }
  }, 400);
};

// ===== 5. ВИЗУАЛЬНЫЙ ПРЫЖОК ПРИ ПОСТЕР-ДАНКЕ =====
var _startAb_dunk = startAb;
startAb = function(ab){
  if(ab.m === 'poster_dunk'){
    var f = byId(sel);
    if(f && ball === f.i){
      var hoop = hoops[1 - f.t];
      if(dist(f.c, f.r, hoop.c, hoop.r) <= 1){
        dunkJumpAnimation(f, hoop, function(){
          _startAb_dunk(ab);

        return;
      }
    }
  }

};

  var shotInfo = '';

  else if(d <= 5) shotInfo = '🟠 Трёха (+1 бонус)';

};

// ИИ тоже прыгает при данке
var _aiWithBall_dunk = aiWithBall;
aiWithBall = async function(f){
  var h = hoops[0];
  var d = aiHoopDist(f.c, f.r);

  // Если ИИ у кольца и решил данковать — прыгает
  if(d <= 1 && f.o >= 2 && (f.s >= 4)){
    // Прыжок к кольцу
    await new Promise(function(resolve){
      var startPx = cen(f.c, f.r);
      var hoopPx = cen(h.c, h.r);
      var midX = (startPx.x + hoopPx.x) / 2;
      var midY = (startPx.y + hoopPx.y) / 2 - S * 1.2;
      f._animating = true;
      var FR = 20, i = 0;
      function step(){
        if(i > FR){
          f.px = startPx.x; f.py = startPx.y;
          f._animating = false;
          render();
          resolve();
          return;
        }
        var t = i / FR;
        var u = 1 - t;
        f.px = u*u * startPx.x + 2*u*t * midX + t*t * hoopPx.x;
        f.py = u*u * startPx.y + 2*u*t * midY + t*t * hoopPx.y;
        render();
        i++;
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  return _aiWithBall_dunk(f);
};

// Перезаписываем handleClick — всегда разрешаем менять выделение
handleClick = function(col, row){
  if(over) return;
  if(window.__animLock) return;
  if(awaitingPass) return;

  // Режимы — обрабатываем отдельно
  if(mode === 'ability' || mode === 'pass' || mode === 'press' ||
     mode === 'dribbleMenu' || mode === 'dribbleTarget' || mode === 'mark'){
    handleModeClick(col, row);
    return;
  }

  var fa = figAt(col, row);

  // Клик по фигуре ИИ — игнор
  if(fa && fa.t !== turn) return;

  // ===== Клик по СВОЕЙ фигуре =====
  if(fa && fa.t === turn && !fa.a){
    if(fa.fr > 0){ logMsg('💫 ' + fa.n + ' упал'); return; }
    if(fa.penalty > 0){ logMsg('🚫 ' + fa.n + ' в штрафном'); return; }

    // РАЗРЕШАЕМ сменить выделение даже если прошлая фигура тратила ОД
    if(sel !== null){
      var prev = byId(sel);
      if(prev && prev.i === fa.i){
        // Та же фигура — просто пересчитываем подсветку
        reHL(); ui(); draw();
        return;
      }
      // Другая фигура — РАЗРЕШАЕМ выбрать
      sel = null;
      hl = [];
    }

    sel = fa.i;
    reHL(); ui(); draw();
    return;
  }

  // ===== Движение на подсвеченный гекс =====
  if(sel !== null && hl.some(function(h){ return h.c === col && h.r === row; })){
    var f = byId(sel);
    if(!f || f.t !== turn) return;
    if(figAt(col, row)) return;

    var press = presses.find(function(p){
      return p.c === col && p.r === row && p.team !== f.t;
    });
    var cost = (ball === f.i) ? 2 : 1;
    if(press) cost += 1;

    if(f.o < cost){ logMsg('Мало ОД'); return; }

    var fromC = f.c, fromR = f.r;
    f.c = col; f.r = row;
    f.o -= cost; f.mv = true;

    ghostTrail(f, fromC, fromR, col, row,
      f.t === 0 ? 'rgba(34,197,94,0.35)' : 'rgba(239,68,68,0.35)', 4);

    if(press){
      popText('⚡ -1 ОД', cen(col, row).x, cen(col, row).y - 30, '#fbbf24', 14);
      burst(cen(col, row).x, cen(col, row).y, '#fbbf24', 8, 2);
    }

    if(gameMode === '1v1' && clearPending[f.t] &&
       dist(f.c, f.r, hoops[0].c, hoops[0].r) >= 4){
      clearPending[f.t] = false;
      logMsg('✓ За дугой');
    }

    if(f.o <= 0) end();
    else { reHL(); ui(); draw(); }
    return;
  }

  // Клик мимо — сброс
  if(sel !== null){
    sel = null;
    hl = [];
    ui(); draw();
  }
};

    teams.forEach(function(t){

      if(myEl) myEl.classList.toggle('sel-mine', myPick === t.id);
      if(oppEl) oppEl.classList.toggle('sel-opp', oppPick === t.id);
    });

  div.querySelectorAll('[data-my]').forEach(function(b){

  });
  div.querySelectorAll('[data-opp]').forEach(function(b){
    b.onclick = function(){ oppPick = b.getAttribute('data-opp'); updateSel(); };
  });

  function startMatch(isAI){
    if(!myPick){ alert('Выбери свою команду'); return; }
    if(!isAI && !oppPick){ alert('Выбери команду соперника'); return; }

    var t1 = KUROKO_FULL.find(function(x){ return x.id === myPick; });
    var t2 = isAI ? KUROKO_FULL.find(function(x){
      return x.id !== myPick;
    }) : KUROKO_FULL.find(function(x){ return x.id === oppPick; });

    if(isAI){
      // Случайный соперник
      var others = KUROKO_FULL.filter(function(x){ return x.id !== myPick; });
      t2 = others[Math.floor(Math.random() * others.length)];

      c1: t2.c1, c2: t2.c2,
      heroNames: t2.heroNames,
      lineups: t2.lineups
    };

    aiEnabled = !!isAI;

    var need = (MODE_PRESETS[gameMode] || MODE_PRESETS['5v5']).count;
    teamGreen = (t1.lineups[gameMode] || []).slice(0, need);
    teamRed = (t2.lineups[gameMode] || []).slice(0, need);

    div.remove();

    // Старт игры напрямую
    hideAllScreens();
    document.getElementById('game').classList.add('show');

    if(typeof initGame === 'function'){
      initGame(teamGreen, teamRed);
    }

    logMsg('⚡ ' + t1.name + ' vs ' + t2.name);
    console.log('[KUROKO] ' + t1.name + ' vs ' + t2.name);
  }

  document.getElementById('kurokoGo').onclick = function(){ startMatch(false); };
  document.getElementById('kurokoAi').onclick = function(){ startMatch(true); };
  document.getElementById('kurokoBack').onclick = function(){ div.remove(); showMain(); };
}

// ===== 1. НОВЫЕ ПРИЁМЫ =====
var DRIBBLES_NEW = [
  {n:'Кроссовер',    m:'cross',    c:1, req:1, needDef:1, type:'side'},
  {n:'Между ног',    m:'between',  c:2, req:2, needDef:1, type:'behind2'},
  {n:'Спин-мув',     m:'spin',     c:2, req:3, needDef:1, type:'behind1'},
  {n:'Евростеп',     m:'euro',     c:2, req:3, needDef:1, type:'behind1', bonus:2},
  {n:'Анкл-брейкер', m:'ankle',    c:3, req:4, needDef:1, type:'ankle'},
  {n:'Хезитейшн',    m:'hesi',     c:1, req:3, needDef:1, type:'hesi'},
  {n:'Степ-бэк',     m:'stepback', c:2, req:2, type:'stepback'}
];

if(typeof DRIBBLES !== 'undefined'){
  DRIBBLES.length = 0;
  DRIBBLES_NEW.forEach(function(d){ DRIBBLES.push(d); });
}

function checkDribbleCd(f, m){
  if(!f.dribbleCd) f.dribbleCd = {};
  return f.dribbleCd[m] > 0;
}

function findDefenderNear(f){
  return fig.find(function(g){
    return g.t !== f.t && g.c >= 0 && dist(g.c, g.r, f.c, f.r) === 1;
  });
}

// ===== 2. ЦЕЛИ ДЛЯ ПРИЁМОВ =====
function buildCrossTargets(f, def){
  var targets = [];
  var myAx = toAx(f.c, f.r), defAx = toAx(def.c, def.r);
  var dq = defAx.q - myAx.q, dr = defAx.r - myAx.r;
  var perps = [{q:-dr, r:dq}, {q:dr, r:-dq}];

  perps.forEach(function(p){
    var nq = Math.sign(p.q), nr = Math.sign(p.r);
    if(nq === 0 && nr === 0) return;
    var tOff = toOff(defAx.q + nq, defAx.r + nr);
    if(tOff.c < 0 || tOff.c >= COLS || tOff.r < 0 || tOff.r >= ROWS) return;
    if(figAt(tOff.c, tOff.r)) return;
    var defOff = toOff(defAx.q - nq, defAx.r - nr);
    targets.push({
      c: tOff.c, r: tOff.r, defId: def.i,
      type: 'cross',
      defPushQ: defOff.q, defPushR: defOff.r
    });
  });
  return targets;
}

function buildBehindTargets(f, def, steps){
  var targets = [];
  var myAx = toAx(f.c, f.r);
  var dirs = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
  var h = hoops[1 - f.t];
  var myHD = dist(f.c, f.r, h.c, h.r);

  dirs.forEach(function(d){
    var midOff = toOff(myAx.q + d[0], myAx.r + d[1]);
    if(midOff.c < 0 || midOff.c >= COLS ||
       midOff.r < 0 || midOff.r >= ROWS) return;
    var midFig = figAt(midOff.c, midOff.r);
    if(!midFig || midFig.i !== def.i) return;

    var tOff = toOff(myAx.q + d[0]*(1+steps), myAx.r + d[1]*(1+steps));
    if(tOff.c < 0 || tOff.c >= COLS ||
       tOff.r < 0 || tOff.r >= ROWS) return;
    if(figAt(tOff.c, tOff.r)) return;

    var dh = dist(tOff.c, tOff.r, h.c, h.r);
    if(dh < myHD){
      targets.push({c: tOff.c, r: tOff.r, defId: def.i, steps: steps});
    }
  });
  return targets;
}

// Замена buildDribbleTargets
buildDribbleTargets = function(){
  var f = byId(sel);
  if(!f) return [];
  var dr = DRIBBLES_NEW.find(function(d){ return d.m === dribbleType; });
  if(!dr) return [];
  var def = findDefenderNear(f);
  if(!def) return [];

  if(dr.type === 'side')    return buildCrossTargets(f, def);
  if(dr.type === 'behind2') return buildBehindTargets(f, def, 2);
  if(dr.type === 'behind1') return buildBehindTargets(f, def, 1);
  if(dr.type === 'ankle')   return buildBehindTargets(f, def, 1);
  return [];
};

// ===== 3. ВЫБОР ПРИЁМА =====
pickDribble = function(dr){
  var f = byId(sel);
  if(!f || ball !== f.i) return;
  if(f.o < dr.c){ logMsg('Мало ОД'); return; }
  if(checkDribbleCd(f, dr.m)){ logMsg('⏳ Кулдаун ' + f.dribbleCd[dr.m]); return; }
  if(f.d < dr.req){ logMsg('⚠ Требует Дри ' + dr.req); return; }
  if(dr.needDef && !findDefenderNear(f)){ logMsg('Нет защитника'); return; }

  if(dr.type === 'hesi'){
    // Хезитейшн — сразу
    var def = findDefenderNear(f);
    f.o -= dr.c;
    var atk = f.d + Math.floor(Math.random()*6) + 1;
    var dfn = def.z + Math.floor(Math.random()*6) + 1;
    logMsg('💫 Хезитейшн ' + atk + ' vs ' + dfn);
    if(atk >= dfn){
      def.o = Math.max(0, def.o - 1);
      logMsg('✓ ' + def.n + ' −1 ОД');
      popText('−1 ОД', cen(def.c, def.r).x, cen(def.c, def.r).y - 30, '#3b82f6', 14);
    }
    var cd1 = f.d <= 2 ? 1 : (f.d <= 4 ? 2 : 3);
    f.dribbleCd[dr.m] = cd1;
    if(f.o <= 0) end(); else { reHL(); ui(); draw(); }
    return;
  }

  if(dr.type === 'stepback'){
    f.o -= dr.c;
    var back = f.t === 0 ? {dc:0, dr:1} : {dc:0, dr:-1};
    var tc = f.c + back.dc, tr = f.r + back.dr;
    if(tc < 0 || tc >= COLS || tr < 0 || tr >= ROWS || figAt(tc, tr)){
      logMsg('Негде отойти'); f.o += dr.c;
    } else {
      f.c = tc; f.r = tr;
      f.px = undefined; f.py = undefined;
      f.shootBonus = (f.shootBonus || 0) + 3;
      logMsg('🚶 Степ-бэк +3');
      popText('+3', cen(f.c, f.r).x, cen(f.c, f.r).y - 25, '#fbbf24', 16);
    }
    var cd2 = f.d <= 2 ? 1 : (f.d <= 4 ? 2 : 3);
    f.dribbleCd[dr.m] = cd2;
    if(f.o <= 0) end(); else { reHL(); ui(); draw(); }
    return;
  }

  // Движения
  dribbleType = dr.m;
  mode = 'dribbleTarget';
  hl = buildDribbleTargets();
  if(!hl.length){ logMsg('Негде пройти'); mode='sel'; hl=[]; }
  ui(); draw();
};

// ===== 4. АНИМАЦИЯ =====
function animateDribble(f, fromC, fromR, toC, toR, color){
  return new Promise(function(resolve){
    var fromPx = cen(fromC, fromR), toPx = cen(toC, toR);
    var FR = 20, i = 0;
    f._animating = true;
    function step(){
      if(i > FR){
        f.px = toPx.x; f.py = toPx.y;
        f._animating = false;
        render(); resolve(); return;
      }
      var t = i / FR;
      var ease = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
      f.px = fromPx.x + (toPx.x - fromPx.x) * ease;
      f.py = fromPx.y + (toPx.y - fromPx.y) * ease;
      if(color && i % 3 === 0 && i > 0){
        fx.push({type:'ghost', x:f.px, y:f.py, color:color, life:18, maxLife:18, size:S*0.5});
      }
      render(); i++;
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

// ===== 5. ВЫПОЛНЕНИЕ =====
execDribble = async function(t){
  var f = byId(sel);
  if(!f) return;
  var def = byId(t.defId);
  var dr = DRIBBLES_NEW.find(function(d){ return d.m === dribbleType; });
  if(!dr) return;
  if(f.o < dr.c){ logMsg('Мало ОД'); return; }
  if(checkDribbleCd(f, dr.m)){ logMsg('⏳ Кулдаун'); return; }

  window.__animLock = true;
  try {
    var fromC = f.c, fromR = f.r;
    var roll = Math.floor(Math.random()*6) + 1;
    var defRoll = Math.floor(Math.random()*6) + 1;
    var atkPen = (dr.type === 'ankle') ? -3 : 0;
    var atk = f.d + atkPen + roll;
    var dfn = def ? def.z + defRoll : 99;
    var success = atk >= dfn;

    logMsg(dr.n + ': ' + atk + ' vs ' + dfn);

    // Анимация
    var color = dr.type === 'side' ? 'rgba(34,197,94,0.5)' :
                dr.type === 'behind2' ? 'rgba(245,158,11,0.5)' :
                dr.type === 'ankle' ? 'rgba(239,68,68,0.5)' : 'rgba(168,85,247,0.5)';

    if(!success){
      // Провал — возвращаемся
      await animateDribble(f, fromC, fromR, fromC, fromR, null);
      f.o = Math.max(0, f.o - 1);
      logMsg('✗ Провал');
      popText('✗', cen(f.c, f.r).x, cen(f.c, f.r).y - 30, '#ef4444', 20);
      setCd(f, dr.m);
      return;
    }

    // Успех
    await animateDribble(f, fromC, fromR, t.c, t.r, color);
    f.c = t.c; f.r = t.r;
    f.o -= dr.c;
    f.mv = true;
    logMsg('✓ ' + dr.n);
    popText(dr.n.toUpperCase() + '!', cen(t.c, t.r).x, cen(t.c, t.r).y - 34, '#22c55e', 14);
    burst(cen(t.c, t.r).x, cen(t.c, t.r).y, '#22c55e', 8, 2);

    // Эффекты
    if(dr.type === 'side' && def && t.defPushQ !== undefined){
      var pushOff = toOff(t.defPushQ, t.defPushR);
      if(pushOff.c >= 0 && pushOff.c < COLS &&
         pushOff.r >= 0 && pushOff.r < ROWS &&
         !figAt(pushOff.c, pushOff.r)){
        def.c = pushOff.c; def.r = pushOff.r;
        def.px = undefined; def.py = undefined;
        logMsg('↔️ ' + def.n + ' отброшен');
      }
    }
    else if(dr.type === 'behind1' && dr.m === 'spin' && def){
      def.o = Math.max(0, def.o - 1);
    }
    else if(dr.type === 'behind1' && dr.m === 'euro'){
      f.shootBonus = (f.shootBonus || 0) + 2;
    }
    else if(dr.type === 'ankle' && def){
      def.fr = 1; def.o = 0; def.a = true;
      logMsg('🦴 ' + def.n + ' УПАЛ!');
      popText('💫', cen(def.c, def.r).x, cen(def.c, def.r).y - 30, '#ef4444', 20);
    }

    setCd(f, dr.m);
  } finally {
    window.__animLock = false;
    mode = 'sel'; hl = [];
    if(f.o <= 0) end(); else { reHL(); ui(); draw(); }
  }
};

function setCd(f, m){
  if(!f.dribbleCd) f.dribbleCd = {};
  var cd = f.d <= 2 ? 1 : (f.d <= 4 ? 2 : 3);
  f.dribbleCd[m] = cd;
  logMsg('⏳ ' + m + ': кулдаун ' + cd);
}

/* ============================================================
   УМНЫЙ ИИ 2.0
   ============================================================ */

function aiEnemies(f, r){
  return fig.filter(function(g){
    return g.t !== f.t && g.c >= 0 && dist(g.c, g.r, f.c, f.r) <= (r || 1);
  });
}
function aiAllies(f){
  return fig.filter(function(g){ return g.t === f.t && g.i !== f.i && g.c >= 0; });
}
function aiHoopDist(c, r){ return dist(c, r, hoops[0].c, hoops[0].r); }
function aiCanSteal(f){
  if(f.stealsThisTurn === undefined) f.stealsThisTurn = 0;
  return f.stealsThisTurn < 2;
}

// ===== ДРИБЛИНГ =====
async function aiTryDribble(f){
  if(!f.dribbleCd) f.dribbleCd = {};
  if(f.o < 1 || f.d < 1) return false;
  var def = aiEnemies(f, 1)[0];
  if(!def) return false;

  var myAx = toAx(f.c, f.r);
  var myHD = aiHoopDist(f.c, f.r);
  var dirs = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
  var targets = [];

  dirs.forEach(function(d){
    var midOff = toOff(myAx.q + d[0], myAx.r + d[1]);
    if(midOff.c < 0 || midOff.c >= COLS || midOff.r < 0 || midOff.r >= ROWS) return;
    var midFig = figAt(midOff.c, midOff.r);
    if(!midFig || midFig.i !== def.i) return;
    for(var st = 1; st <= 2; st++){
      var tOff = toOff(myAx.q + d[0]*(1+st), myAx.r + d[1]*(1+st));
      if(tOff.c < 0 || tOff.c >= COLS || tOff.r < 0 || tOff.r >= ROWS) break;
      if(figAt(tOff.c, tOff.r)) continue;
      var dh = aiHoopDist(tOff.c, tOff.r);
      if(dh < myHD) targets.push({c:tOff.c, r:tOff.r, gain: myHD-dh});
    }
  });
  if(!targets.length) return false;
  targets.sort(function(a, b){ return b.gain - a.gain; });
  var best = targets[0];

  var list = [
    {m:'ankle', req:4, c:3, ch:0.4},
    {m:'spin',  req:3, c:2, ch:0.55},
    {m:'euro',  req:3, c:2, ch:0.5},
    {m:'between',req:2, c:2, ch:0.6},
    {m:'cross', req:1, c:1, ch:0.8}
  ];

  for(var i = 0; i < list.length; i++){
    var item = list[i];
    if(f.d < item.req || f.dribbleCd[item.m] > 0 || f.o < item.c) continue;
    if(!aiChance(item.ch)) continue;

    var roll = Math.floor(Math.random()*6) + 1;
    var defRoll = Math.floor(Math.random()*6) + 1;
    var pen = (item.m === 'ankle') ? -3 : 0;
    var success = (f.d + pen + roll) >= (def.z + defRoll);
    f.o -= item.c;
    logMsg('🤖 ' + f.n + ': ' + item.m);

    if(success){
      var fromC = f.c, fromR = f.r;
      f.c = best.c; f.r = best.r;
      f.px = undefined; f.py = undefined; f.mv = true;
      ghostTrail(f, fromC, fromR, best.c, best.r, 'rgba(168,85,247,0.7)', 5);
      if(item.m === 'spin') def.o = Math.max(0, def.o - 1);
      else if(item.m === 'euro') f.shootBonus = (f.shootBonus || 0) + 2;
      else if(item.m === 'ankle'){ def.fr = 1; def.o = 0; def.a = true; }
    } else {
      f.o = Math.max(0, f.o - 1);
    }
    f.dribbleCd[item.m] = f.d <= 2 ? 1 : (f.d <= 4 ? 2 : 3);
    ui(); draw();
    await aiSleep(350);
    return true;
  }
  return false;
}

// ===== СПОСОБНОСТИ =====
async function aiTryAbility(f){
  if(!f.ab || !f.ab.length || f.o < 1) return false;
  var avail = f.ab.filter(function(a){
    return !a.p && !(a.u && f.us.indexOf(a.n) >= 0) && f.o >= a.c &&
      (!f.abilityCd || !f.abilityCd[a.n] || f.abilityCd[a.n] === 0);
  });
  if(!avail.length) return false;

  var d = aiHoopDist(f.c, f.r);
  var near = aiEnemies(f, 1);

  // Баффы
  if(d <= 5 && f.o >= 2 && aiChance(0.35)){
    var buff = avail.find(function(a){
      return a.m === 'shoot_bonus3' || a.m === 'tyrant' || a.m === 'quickstep' || a.m === 'stance';
    });
    if(buff){
      f.o -= buff.c;
      if(buff.m === 'shoot_bonus3') f.shootBonus = (f.shootBonus || 0) + 3;
      else if(buff.m === 'tyrant'){ f.z += 2; f.s += 2; f.tyrantBuff = 1; }
      else if(buff.m === 'quickstep') f.quickStep = 2;
      else if(buff.m === 'stance'){ f.z += 2; f.defBuff = 2; }
      if(!f.abilityCd) f.abilityCd = {};
      f.abilityCd[buff.n] = ABILITY_CD[buff.m] || 3;
      logMsg('🤖 ' + f.n + ': ' + buff.n);
      ui(); draw();
      await aiSleep(220);
      return true;
    }
  }

  // Движения
  if(near.length && aiChance(0.7)){
    var mv = avail.find(function(a){
      return a.m === 'jump' || a.m === 'phase' || a.m === 'dash' || a.m === 'slide';
    });
    if(mv){
      var myAx = toAx(f.c, f.r);
      var dirs = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
      var rg = mv.m === 'jump' ? 3 : 2;
      var tgt = null, bs = -1e9;
      dirs.forEach(function(dd){
        for(var st = 1; st <= rg; st++){
          var tOff = toOff(myAx.q + dd[0]*st, myAx.r + dd[1]*st);
          if(tOff.c < 0 || tOff.c >= COLS || tOff.r < 0 || tOff.r >= ROWS) break;
          if(figAt(tOff.c, tOff.r)) continue;
          var en = 0;
          fig.forEach(function(g){
            if(g.t !== f.t && g.c >= 0 && dist(g.c, g.r, tOff.c, tOff.r) <= 1) en++;
          });
          var s = -aiHoopDist(tOff.c, tOff.r) * 3 - en * 2;
          if(s > bs){ bs = s; tgt = tOff; }
        }
      });
      if(tgt){
        f.o -= mv.c;
        ghostTrail(f, f.c, f.r, tgt.c, tgt.r, 'rgba(168,85,247,0.7)', 5);
        f.c = tgt.c; f.r = tgt.r;
        f.px = undefined; f.py = undefined; f.mv = true;
        if(mv.u) f.us.push(mv.n);
        if(!f.abilityCd) f.abilityCd = {};
        f.abilityCd[mv.n] = ABILITY_CD[mv.m] || 3;
        logMsg('🤖 ' + f.n + ': ' + mv.n);
        ui(); draw();
        await aiSleep(320);
        return true;
      }
    }
  }

  // Дебаффы
  if(near.length && aiChance(0.55)){
    var deb = avail.find(function(a){
      return a.m === 'blind' || a.m === 'freeze' || a.m === 'sting' || a.m === 'push';
    });
    if(deb){
      var e = near[0];
      try {
        pab = deb;
        execAb({c: e.c, r: e.r, m: 'enemy', id: e.i});
        await aiSleep(320);
        return true;
      } catch(err){ pab = null; }
    }
  }

  // Пост-ап
  if(d <= 2 && near.length && aiChance(0.7)){
    var post = avail.find(function(a){ return a.m === 'post_up'; });
    if(post){
      f.o -= post.c;
      if(!f.abilityCd) f.abilityCd = {};
      f.abilityCd[post.n] = 3;
      var def2 = near[0];
      if((f.s + Math.floor(Math.random()*6)) > (def2.s + Math.floor(Math.random()*6))){
        f.shootBonus = (f.shootBonus || 0) + 2;
      }
      logMsg('🤖 Пост-ап');
      ui(); draw();
      await aiSleep(250);
      return true;
    }
  }

  return false;
}

// ===== КОМАНДНЫЕ =====
async function aiTryTeam(f){
  if(!f.teamCd) f.teamCd = {};

  if(ball === f.i && f.o >= 2 && !f.teamCd.alley){
    var h = hoops[0];
    var ally = aiAllies(f).find(function(a){ return dist(a.c, a.r, h.c, h.r) <= 1; });
    if(ally && aiChance(0.6)){
      try { startAlley(); await aiSleep(700); return true; } catch(e){}
    }
  }

  if(ball === f.i && f.o >= 2 && !f.teamCd.fastbreak){
    if(aiHoopDist(f.c, f.r) >= 3 && !aiEnemies(f, 1).length && aiChance(0.5)){
      try { doFastBreak(); await aiSleep(500); return true; } catch(e){}
    }
  }

  if(f.o >= 1 && !f.teamCd.pickroll && aiEnemies(f, 1).length){
    var ally2 = aiAllies(f).find(function(a){ return dist(a.c, a.r, f.c, f.r) <= 2; });
    if(ally2 && aiChance(0.5)){
      try { doPickAndRoll(); await aiSleep(450); return true; } catch(e){}
    }
  }

  return false;
}

// ===== С МЯЧОМ =====
async function aiWithBall(f){
  var lvl = aiLevel();
  var h = hoops[0];
  var d = aiHoopDist(f.c, f.r);
  var near = aiEnemies(f, 1);
  var pressure = near.length >= 1;
  var dbl = near.length >= 2;

  // 1v1 clear
  if(gameMode === '1v1' && clearPending[f.t] && d < 4 && f.o >= 1){
    var opts = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
    var b = null, bd = -1;
    opts.forEach(function(p){
      var dh = dist(p[0], p[1], h.c, h.r);
      if(dh >= 4 && dh > bd){ bd = dh; b = p; }
    });
    if(b){
      f.c = b[0]; f.r = b[1]; f.o -= 1;
      f.px = undefined; f.py = undefined;
      clearPending[f.t] = false;
      ui(); draw();
      await aiSleep(220);
      return 'move';
    }
    return null;
  }

  // Оценка
  var tgt = d <= 1 ? 5 : d <= 3 ? 7 : 9;
  var pen = pressure ? 2 : 0;
  var bonus = 0;
  if((f.ab||[]).some(function(a){ return a.n === 'Снайпер'; }) && !f.mv) bonus += 2;
  if((f.ab||[]).some(function(a){ return a.n === 'Дальнобой'; }) && d >= 4) bonus += 1;
  if(f.shootBonus) bonus += f.shootBonus;
  if(f.bl > 0) bonus -= 2;
  if(d >= 2 && d <= 5) bonus += 1;
  var need = (tgt + pen) - (f.b + bonus + 3.5);
  var ch = need <= -3 ? 0.95 : need <= -1 ? 0.85 : need <= 1 ? 0.7 : need <= 3 ? 0.5 : need <= 5 ? 0.3 : 0.1;

  // Отличный бросок
  if(ch >= 0.72 && !dbl && f.o >= 2 && d <= 5){
    if(d <= 1 && f.s >= 4 && aiChance(0.7)){ doDunk(); await aiSleep(1100); return 'shot'; }
    if(d >= 1 && d <= 2 && aiChance(0.4)){ doFloater(); await aiSleep(1100); return 'shot'; }
    doShoot(); await aiSleep(1100); return 'shot';
  }

  // Тактики
  if(f.o >= 2 && aiChance(lvl.team) && await aiTryTeam(f)) return 'move';
  if(f.o >= 1 && aiChance(lvl.abilities * 0.7) && await aiTryAbility(f)) return 'move';
  if(pressure && !dbl && f.o >= 2 && aiChance(lvl.dribble) && await aiTryDribble(f)) return 'move';

  // Пас
  if((dbl || pressure || ch < 0.4) && f.o >= 1 && aiChance(lvl.pass)){
    var allies = aiAllies(f).filter(function(a){ return dist(f.c, f.r, a.c, a.r) <= 4; });
    if(allies.length){
      var scored = allies.map(function(a){
        var ne = 99;
        fig.forEach(function(g){
          if(g.t !== f.t && g.c >= 0) ne = Math.min(ne, dist(g.c, g.r, a.c, a.r));
        });
        return {ally: a, score: -aiHoopDist(a.c, a.r) * 2 + ne * 2};
      }).sort(function(x, y){ return y.score - x.score; });
      doPass(scored[0].ally.i);
      await aiSleep(320);
      return 'move';
    }
  }

  // Средний
  if(ch >= 0.55 && !dbl && f.o >= 2 && d <= 5){
    doShoot(); await aiSleep(1000); return 'shot';
  }

  // Движение к кольцу
  if(f.o >= 1){
    var opts2 = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
    if(opts2.length){
      opts2.sort(function(a, b){
        return dist(a[0], a[1], h.c, h.r) - dist(b[0], b[1], h.c, h.r);
      });
      f.c = opts2[0][0]; f.r = opts2[0][1]; f.o -= 1;
      f.px = undefined; f.py = undefined; f.mv = true;
      ui(); draw();
      await aiSleep(180);
      return 'move';
    }
  }
  return null;
}

// ===== ЗАЩИТА =====
async function aiDefend(f){
  var lvl = aiLevel();
  var bh = byId(ball);
  if(!bh || bh.t === f.t) return null;
  var d = dist(f.c, f.r, bh.c, bh.r);
  var attackHoop = hoops[0];
  var dToHoop = dist(bh.c, bh.r, attackHoop.c, attackHoop.r);

  // Игрок в проходе — держим позицию
  if(dToHoop <= 3 && d > 1 && f.o >= 1){
    var opts = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
    var best = null, bs = -1e9;
    opts.forEach(function(p){
      var dm = dist(p[0], p[1], bh.c, bh.r);
      var dh = dist(p[0], p[1], attackHoop.c, attackHoop.r);
      var btw = dm + dh - dist(bh.c, bh.r, attackHoop.c, attackHoop.r);
      var s = -btw * 3 - dh;
      if(s > bs){ bs = s; best = p; }
    });
    if(best){
      f.c = best[0]; f.r = best[1]; f.o -= 1;
      f.px = undefined; f.py = undefined;
      ui(); draw();
      await aiSleep(180);
      return 'move';
    }
    return null;
  }

  // Отбор
  if(d <= 1 && f.o >= 1 && aiCanSteal(f) && aiChance(lvl.defense * 0.9)){
    f.stealsThisTurn = (f.stealsThisTurn || 0) + 1;
    doSteal();
    await aiSleep(320);
    return 'steal';
  }

  // Способность
  if(d <= 1 && f.o >= 1 && f.ab && aiChance(lvl.abilities * 0.8)){
    var avail = f.ab.filter(function(a){
      return !a.p && !(a.u && f.us.indexOf(a.n) >= 0) && f.o >= a.c &&
        (!f.abilityCd || !f.abilityCd[a.n] || f.abilityCd[a.n] === 0);
    });
    var deb = avail.find(function(a){
      return a.m === 'blind' || a.m === 'freeze' || a.m === 'sting' || a.m === 'push';
    });
    if(deb){
      try {
        pab = deb;
        execAb({c: bh.c, r: bh.r, m:'enemy', id: bh.i});
        await aiSleep(320);
        return 'move';
      } catch(e){ pab = null; }
    }
  }

  // Позиция
  if(f.o >= 1){
    var oH = hoops[1];
    var opts2 = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
    var b2 = null, bs2 = -1e9;
    opts2.forEach(function(p){
      var dm = dist(p[0], p[1], bh.c, bh.r);
      var dh = dist(p[0], p[1], oH.c, oH.r);
      var btw = dm + dh - dist(bh.c, bh.r, oH.c, oH.r);
      var s = -dm*2.5 - dh*0.4 - btw*0.6;
      if(s > bs2){ bs2 = s; b2 = p; }
    });
    if(b2){
      f.c = b2[0]; f.r = b2[1]; f.o -= 1;
      f.px = undefined; f.py = undefined;
      ui(); draw();
      await aiSleep(180);
      return 'move';
    }
  }
  return null;
}

// ===== БЕЗ МЯЧА =====
async function aiOffBall(f){
  var bh = byId(ball);
  if(!bh) return null;
  if(bh.t === f.t){
    if(f.o >= 1){
      var opts = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
      var best = null, bs = -1e9;
      opts.forEach(function(p){
        var dh = aiHoopDist(p[0], p[1]);
        var press = 0;
        fig.forEach(function(g){
          if(g.t !== f.t && g.c >= 0 && dist(g.c, g.r, p[0], p[1]) <= 1) press += 2;
        });
        var s = -dh * 1.8 - press * 3;
        if(s > bs){ bs = s; best = p; }
      });
      if(best){
        f.c = best[0]; f.r = best[1]; f.o -= 1;
        f.px = undefined; f.py = undefined;
        ui(); draw();
        await aiSleep(180);
        return 'move';
      }
    }
    return null;
  }
  return await aiDefend(f);
}

async function aiStep(f){
  if(ball === f.i) return await aiWithBall(f);
  var bh = byId(ball);
  if(bh && bh.t !== f.t) return await aiDefend(f);
  return await aiOffBall(f);
}

async function aiPlayFigure(f){
  var g = 25;
  while(f.o > 0 && turn === 1 && !over && g-- > 0){
    var r = await aiStep(f);
    if(!r) break;
    if(r === 'shot') break;
    await aiSleep(150);
  }
}

// ===== ИГРА КОМАНДОЙ =====
playAllAI = async function(){
  if(aiRunning) return;
  aiRunning = true;
  logMsg('🤖 ИИ (' + aiDifficulty + ')...');
  var maxMoves = doubleMoveEnabled ? 2 : 1;
  var moved = 0;

  try {
    var guard = 20;
    while(turn === 1 && !over && guard-- > 0 && moved < maxMoves){
      var cands = fig.filter(function(x){
        return x.t === 1 && !x.a && x.c >= 0 && x.penalty === 0 && x.fr === 0;
      });
      if(!cands.length) break;

      var f = null;
      if(aiDifficulty === 'easy'){
        f = cands.find(function(x){ return ball === x.i; }) || cands[0];
      } else {
        var bs = -999;
        cands.forEach(function(c){
          var s = 0;
          if(ball === c.i) s += 100;
          s += c.o * 5;
          s += (10 - aiHoopDist(c.c, c.r)) * 3;
          var bo = byId(ball);
          if(bo && bo.t === 0) s += (8 - dist(c.c, c.r, bo.c, bo.r)) * 4;
          if(s > bs){ bs = s; f = c; }
        });
      }
      if(!f) break;

      sel = f.i;
      reHL(); ui(); draw();
      await aiSleep(200);
      await aiPlayFigure(f);

      if(!f.a && !over){
        f.a = true; f.o = 0;
        moved++;
        movesThisTurn = moved;
        await aiSleep(120);
      }
    }
    if(turn === 1 && !over){
      fig.forEach(function(g){
        if(g.t === 1 && !g.a && g.c >= 0){ g.a = true; g.o = 0; }
      });
      switchTurn();
    }
  } catch(e){
    console.error('AI error:', e);
    try {
      fig.forEach(function(g){
        if(g.t === 1 && !g.a && g.c >= 0){ g.a = true; g.o = 0; }
      });
      if(turn === 1 && !over) switchTurn();
    } catch(e2){}
  } finally {
    aiRunning = false;
    sel = null; hl = [];
  }
};
