function showOnlinePickScreen(){
  const myTeam = peerMyTeam;
  const need = (MODE_PRESETS[gameMode] || MODE_PRESETS['5v5']).count;
  const myColor = myTeam === 0 ? '🟢' : '🔴';

  const div = document.createElement('div');
  div.id = 'onlineSetupFinal';
  div.style.cssText = 'position:fixed;inset:0;background:#1a1a2e;z-index:600;overflow-y:auto;padding:16px;box-sizing:border-box;color:#fff;font-family:inherit';
  div.innerHTML =
    '<div style="max-width:600px;margin:0 auto">' +
    '<h2 style="text-align:center;margin:8px 0">' + myColor + ' ' + (profile.name || 'Игрок') + '</h2>' +
    '<div id="osOpp" style="text-align:center;color:#94a3b8;font-size:13px;margin-bottom:12px">Противник: ' + onlineOppName + '</div>' +
    '<div style="text-align:center;color:#fbbf24;font-size:13px;margin-bottom:12px">Выбери ' + need + ' фигур</div>' +
    '<div id="osPicks" style="background:#16213e;padding:8px;border-radius:8px;margin-bottom:10px;min-height:34px;font-size:12px"></div>' +
    '<div id="osPool" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px"></div>' +
    '<button id="osReady" style="width:100%;padding:16px;background:#e94560;color:#fff;border:0;border-radius:10px;font-size:16px;font-weight:bold;font-family:inherit;cursor:pointer">Готов (0/' + need + ')</button>' +
    '<div id="osStat" style="text-align:center;color:#94a3b8;font-size:12px;margin-top:12px;min-height:20px"></div>' +
    '</div>';
  document.body.appendChild(div);

  const poolEl = div.querySelector('#osPool');
  const picksEl = div.querySelector('#osPicks');
  const readyBtn = div.querySelector('#osReady');
  const statEl = div.querySelector('#osStat');

  function renderPicks(){
    picksEl.innerHTML = onlineMyPicks.length
      ? onlineMyPicks.map(function(n, i){
          return '<span data-i="' + i + '" style="display:inline-block;background:' + (myTeam === 0 ? '#22c55e' : '#ef4444') + ';padding:4px 10px;margin:3px;border-radius:5px;cursor:pointer">' + n + ' ×</span>';
        }).join('')
      : '<i style="color:#64748b">Пока пусто</i>';
    picksEl.querySelectorAll('[data-i]').forEach(function(el){
      el.onclick = function(){
        if(onlineMyReady) return;
        onlineMyPicks.splice(parseInt(el.getAttribute('data-i')), 1);
        renderAll();
      };
    });
  }
  function renderPool(){
    poolEl.innerHTML = '';
    Object.keys(F).forEach(function(n){
      const used = onlineMyPicks.indexOf(n) >= 0;
      const b = document.createElement('button');
      b.textContent = F[n].p + ' ' + n;
      b.style.cssText = 'padding:5px 8px;background:#3b82f6;color:#fff;border:0;border-radius:4px;font-size:11px;cursor:pointer;opacity:' + (used ? '0.3' : '1') + ';font-family:inherit';
      b.disabled = used || onlineMyReady;
      b.onclick = function(){
        if(onlineMyReady) return;
        if(onlineMyPicks.length >= need) return;
        onlineMyPicks.push(n);
        renderAll();
      };
      poolEl.appendChild(b);
    });
  }
  function renderAll(){
    renderPicks(); renderPool();
    const cnt = onlineMyPicks.length;
    if(onlineMyReady){
      readyBtn.style.background = '#22c55e';
      readyBtn.textContent = '✅ Готово! Ждём противника...';
      readyBtn.disabled = true;
    } else {
      readyBtn.textContent = 'Готов (' + cnt + '/' + need + ')';
      readyBtn.style.background = cnt === need ? '#22c55e' : '#e94560';
    }
  }

  readyBtn.onclick = function(){
    if(onlineMyReady) return;
    if(onlineMyPicks.length < need){
      statEl.textContent = 'Нужно ещё ' + (need - onlineMyPicks.length) + ' фигур';
      statEl.style.color = '#ef4444';
      return;
    }
    onlineMyReady = true;
    statEl.textContent = 'Ждём противника...';
    statEl.style.color = '#fbbf24';
    sendNet({ type:'picks', picks: onlineMyPicks, name: profile.name });
    renderAll();
    checkReadyOnline();
  };

  window.__onlinePickRender = function(){
    updateOppUI();
    if(onlineOppReady){
      statEl.textContent = onlineOppName + ' готов!';
      statEl.style.color = '#22c55e';
    }
    checkReadyOnline();
  };

  function checkReadyOnline(){
    if(onlineMyReady && onlineOppReady){
      statEl.textContent = '✅ Оба готовы! Запуск...';
      statEl.style.color = '#22c55e';
      setTimeout(startOnlineMatch, 600);
    }
  }

  renderAll();
  updateOppUI();
}

function checkReadyOnline(){
  if(window.__onlinePickRender) window.__onlinePickRender();
}

function startOnlineMatch(){
  const myTeam = peerMyTeam;
  const need = (MODE_PRESETS[gameMode] || MODE_PRESETS['5v5']).count;
  const myPicks = onlineMyPicks.slice(0, need);
  const oppPicks = (onlineOppPicks || []).slice(0, need);

  teamGreen = myTeam === 0 ? myPicks : oppPicks;
  teamRed = myTeam === 1 ? myPicks : oppPicks;

  const s = document.getElementById('onlineSetupFinal');
  if(s) s.remove();

  showGame();
  initGame(teamGreen, teamRed);
  logMsg('🌐 Онлайн! Ты — ' + (myTeam === 0 ? '🟢 ' : '🔴 ') + (profile.name || 'Игрок'));
}

// ===== ЧАСТИЦЫ (универсальный burst) =====
function burst(px, py, color, count, speed){
  if(!window.__particles) window.__particles = [];
  for(let i = 0; i < (count || 14); i++){
    const a = Math.random() * Math.PI * 2;
    const sp = (speed || 3) * (0.5 + Math.random());
    window.__particles.push({
      x: px, y: py,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 1,
      color: color,
      life: 40, maxLife: 40,
      size: 2 + Math.random() * 3
    });
  }
  if(!animating){ animating = true; requestAnimationFrame(tick); }
}

function shockwave(px, py, color){
  fx.push({

    x: px, y: py,
    r: 0,

          const a = (i / 12) * Math.PI * 2;

  const desperation = (sc[1] < sc[0] - 6) || (sc[0] >= 18 && sc[1] < 18);
  const leading = sc[1] > sc[0] + 4;
  return { d: d, near: near, pressure: pressure, doubleTeam: doubleTeam, desperation: desperation, leading: leading };
}

// ===== ОПЕКА — назначение защитников =====
function aiAssignMarks(){
  const attackers = fig.filter(function(f){ return f.t === 0 && f.c >= 0; });
  const defenders = fig.filter(function(f){ return f.t === 1 && f.c >= 0; });
  if(!attackers.length || !defenders.length){ window.__aiMarks = {}; return; }

  // Сортируем атакующих по угрозе
  const sorted = attackers.slice().sort(function(a, b){
    const aScore = a.b * 1.5 + a.o - hoopDist(a.c, a.r) * 0.5;
    const bScore = b.b * 1.5 + b.o - hoopDist(b.c, b.r) * 0.5;
    return bScore - aScore;
  });

  window.__aiMarks = {};
  sorted.forEach(function(atk, i){
    const def = defenders[i % defenders.length];
    window.__aiMarks[def.i] = atk.i;
  });
}

function aiMyMark(f){
  if(!window.__aiMarks) return null;
  const id = window.__aiMarks[f.i];
  return id !== undefined ? byId(id) : null;
}

// ===== ЗАСЛОН =====
function aiFindScreenSpot(f, ally){
  if(!ally || ally.c < 0) return null;
  if(dist(f.c, f.r, ally.c, ally.r) > 2) return null;
  const hisDef = fig.find(function(g){
    return g.t !== f.t && g.c >= 0 && dist(g.c, g.r, ally.c, ally.r) === 1;
  });
  if(!hisDef) return null;
  const hoop = hoops[0];
  const opts = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
  let best = null, bs = -1e9;
  opts.forEach(function(p){
    const dToDef = dist(p[0], p[1], hisDef.c, hisDef.r);
    const dToHoop = hoopDist(p[0], p[1]);
    const between = dToDef + dToHoop - dist(hisDef.c, hisDef.r, hoop.c, hoop.r);
    const score = -dToDef * 2 - between * 1.5;
    if(score > bs){ bs = score; best = p; }
  });
  return best;
}

async function aiDoScreen(f, spot, ally){
  if(!spot || f.o < 1) return false;
  const fromC = f.c, fromR = f.r;
  f.c = spot[0]; f.r = spot[1];
  f.o -= 1;
  f.px = undefined; f.py = undefined;
  f.mv = true;
  const hisDef = fig.find(function(g){
    return g.t !== f.t && g.c >= 0 && dist(g.c, g.r, f.c, f.r) === 1;
  });
  if(hisDef){
    hisDef.o = Math.max(0, hisDef.o - 1);
    logMsg('🤖 ' + f.n + ': заслон на ' + hisDef.n);
  }
  if(typeof ghostTrail === 'function') ghostTrail(f, fromC, fromR, f.c, f.r, 'rgba(6,182,212,0.7)', 6);
  if(typeof popText === 'function'){
    const p = cen(f.c, f.r);
    popText('🚧', p.x, p.y - 30, '#06b6d4', 22);
  }
  ui(); draw();
  await sleep(400);
  return true;
}

// ===== ПАС В ПРОХОД =====
async function aiPassInMotion(f, lvl){
  if(!chance(lvl.pass)) return false;
  if(f.o < 1) return false;
  const allies = aiNearbyAllies(f, 4);
  if(!allies.length) return false;

  const h = hoops[0];
  const myHD = hoopDist(f.c, f.r);
  const scored = allies.map(function(a){
    const dHoop = hoopDist(a.c, a.r);
    const ne = aiEnemyNearPoint(f, a.c, a.r);
    const forward = myHD - dHoop;
    let lane = 0;
    fig.forEach(function(x){
      if(x.t === f.t || x.c < 0) return;
      const dm = Math.min(dist(x.c, x.r, f.c, f.r), dist(x.c, x.r, a.c, a.r));
      if(dm <= 1) lane += 3;
      else if(dm <= 2) lane += 1;
    });
    return { ally: a, score: -dHoop * 2 + ne * 2.8 + forward * 1.8 - lane * 2.5 };
  }).sort(function(x, y){ return y.score - x.score; });

  const best = scored[0];
  if(best.score < -3) return false;

  const target = best.ally;
  // Перехват
  let int = null, br = 0;
  fig.forEach(function(g){
    if(g.t === f.t || g.c < 0) return;
    const minD = Math.min(dist(g.c, g.r, f.c, f.r), dist(g.c, g.r, target.c, target.r));
    if(minD > 1) return;
    const r = g.z + Math.floor(Math.random()*6) + 1 + 2;
    if(r > br){ br = r; int = g; }
  });
  if(int && (f.d + Math.floor(Math.random()*6) + 1) <= br){
    f.o -= 1;
    ball = int.i;
    delete holds[f.i];
    logMsg('🤖 ПЕРЕХВАТ: ' + int.n);
    ui(); draw();
    await sleep(400);
    return true;
  }
  ball = target.i;
  delete holds[f.i];
  f.o -= 1;
  logMsg('🤖 Пас ' + f.n + ' → ' + target.n);
  ui(); draw();
  await sleep(360);
  return true;
}

// ===== УМНЫЙ ДРИБЛИНГ (все приёмы) =====
async function aiSmartDribble(f, lvl){
  if(!chance(lvl.dribble)) return false;
  if(f.o < 1 || f.d < 3) return false;
  const def = enemiesAround(f, 1)[0];
  if(!def) return false;

  const myAx = toAx(f.c, f.r);
  const myHD = hoopDist(f.c, f.r);
  const dirs = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
  const targets = [];
  dirs.forEach(function(d){
    const midOff = toOff(myAx.q + d[0], myAx.r + d[1]);
    if(midOff.c < 0 || midOff.c >= COLS || midOff.r < 0 || midOff.r >= ROWS) return;
    const midFig = figAt(midOff.c, midOff.r);
    if(!midFig || midFig.i !== def.i) return;
    for(let st = 1; st <= 2; st++){
      const tOff = toOff(myAx.q + d[0]*(1+st), myAx.r + d[1]*(1+st));
      if(tOff.c < 0 || tOff.c >= COLS || tOff.r < 0 || tOff.r >= ROWS) break;
      if(figAt(tOff.c, tOff.r)) continue;
      const dh = hoopDist(tOff.c, tOff.r);
      if(dh < myHD) targets.push({c:tOff.c, r:tOff.r, dist:st, gain: myHD - dh});
    }
  });

  const drList = [
    { m:'ankle', cond: function(){ return targets.length && f.o >= 3 && f.d >= 4 && !f.dribbleCd.ankle; }, chance_: 0.5 },
    { m:'spin',  cond: function(){ return targets.length && f.o >= 2 && !f.dribbleCd.spin; }, chance_: 0.6 },
    { m:'euro',  cond: function(){ return targets.length && myHD <= 3 && f.o >= 2 && !f.dribbleCd.euro; }, chance_: 0.55 },
    { m:'cross', cond: function(){ return targets.length && f.o >= 1 && !f.dribbleCd.cross; }, chance_: 0.75 }
  ];

  for(let i = 0; i < drList.length; i++){
    const item = drList[i];
    if(item.cond() && chance(lvl.smart * item.chance_)){
      const dr = DRIBBLES2.find(function(x){ return x.m === item.m; });
      if(!dr) continue;
      if(f.o < dr.c) continue;
      if(item.m === 'cross' || item.m === 'spin' || item.m === 'ankle' || item.m === 'euro'){
        const best = targets.sort(function(a, b){ return b.gain - a.gain; })[0];
        if(!best) continue;
        // Симуляция проверки
        const roll = Math.floor(Math.random()*6) + 1;
        const defRoll = Math.floor(Math.random()*6) + 1;
        const atkPen = (item.m === 'ankle') ? -3 : 0;
        const atk = f.d + atkPen + roll;
        const dfn = def.z + defRoll;
        const success = atk >= dfn;
        f.o -= dr.c;
        logMsg('🤖 ' + f.n + ': ' + dr.n + ' (' + atk + ' vs ' + dfn + ')');
        if(success){
          const fromC = f.c, fromR = f.r;
          f.c = best.c; f.r = best.r;
          f.px = undefined; f.py = undefined; f.mv = true;
          if(typeof ghostTrail === 'function') ghostTrail(f, fromC, fromR, best.c, best.r, 'rgba(168,85,247,0.7)', 7);
          if(item.m === 'spin') def.o = Math.max(0, def.o - 1);
          else if(item.m === 'euro') f.shootBonus = (f.shootBonus || 0) + 2;
          else if(item.m === 'ankle'){ def.fr = 1; def.o = 0; logMsg('🦴 ' + def.n + ' упал'); }
          logMsg('✓ Прошёл');
        } else {
          f.o = Math.max(0, f.o - 1);
          logMsg('✗ Не прошёл');
        }
        const cd = f.d <= 2 ? 1 : (f.d <= 4 ? 2 : 3);
        f.dribbleCd[item.m] = cd;
        ui(); draw();
        await sleep(450);
        return true;
      }
    }
  }
  return false;
}

// ===== СПОСОБНОСТИ ИИ =====
async function aiSmartAbility(f, mode, lvl){
  if(!f.ab || !f.ab.length) return false;
  if(!chance(lvl.abilities)) return false;
  const avail = f.ab.filter(function(a){
    return !a.p && !(a.u && f.us.indexOf(a.n) >= 0) && f.o >= a.c;
  });
  if(!avail.length) return false;

  if(mode === 'attack'){
    const ab = avail.find(function(a){ return a.m === 'jump' || a.m === 'phase' || a.m === 'dash'; });
    if(!ab) return false;
    const myAx = toAx(f.c, f.r);
    const dirs = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
    let best = null, bd = 99;
    dirs.forEach(function(d){
      for(let st = 1; st <= 3; st++){
        const tOff = toOff(myAx.q + d[0]*st, myAx.r + d[1]*st);
        if(tOff.c < 0 || tOff.c >= COLS || tOff.r < 0 || tOff.r >= ROWS) break;
        if(figAt(tOff.c, tOff.r)) continue;
        const dh = hoopDist(tOff.c, tOff.r);
        if(dh < bd){ bd = dh; best = tOff; }
      }
    });
    if(!best) return false;
    const fromC = f.c, fromR = f.r;
    const fromPx = cen(fromC, fromR);
    if(typeof ghostTrail === 'function') ghostTrail(f, fromC, fromR, best.c, best.r, 'rgba(168,85,247,0.8)', 9);
    f.c = best.c; f.r = best.r;
    f.px = undefined; f.py = undefined;
    f.o -= ab.c;
    if(ab.u) f.us.push(ab.n);
    logMsg('🤖 ' + f.n + ': ' + ab.n);
    if(typeof popText === 'function') popText('⚡', fromPx.x, fromPx.y - 30, '#a855f7', 22);
    ui(); draw();
    await sleep(420);
    return true;
  }

  if(mode === 'defense'){
    const bh = byId(ball);
    if(!bh || bh.t === f.t) return false;
    if(dist(f.c, f.r, bh.c, bh.r) > 1) return false;
    const debuff = avail.find(function(a){
      return a.m === 'blind' || a.m === 'freeze' || a.m === 'sting' || a.m === 'push';
    });
    if(!debuff) return false;
    if(debuff.m === 'blind') bh.bl = 1;
    else if(debuff.m === 'freeze') bh.fr = 1;
    else if(debuff.m === 'sting') bh.o = Math.max(0, bh.o - 2);
    else if(debuff.m === 'push'){
      const a = toAx(f.c, f.r), b = toAx(bh.c, bh.r);
      const dq = Math.sign(b.q - a.q), dr = Math.sign(b.r - a.r);
      const tp = toOff(b.q + dq, b.r + dr);
      if(tp.c >= 0 && tp.c < COLS && tp.r >= 0 && tp.r < ROWS && !figAt(tp.c, tp.r)){
        bh.c = tp.c; bh.r = tp.r; bh.px = undefined; bh.py = undefined;
      }
    }
    if(debuff.u) f.us.push(debuff.n);
    f.o -= debuff.c;
    logMsg('🤖 ' + f.n + ': ' + debuff.n);
    if(typeof popText === 'function'){
      const p = cen(bh.c, bh.r);
      popText('✨', p.x, p.y - 30, '#fbbf24', 22);
    }
    ui(); draw();
    await sleep(420);
    return true;
  }
  return false;
}

// ===== УМНЫЙ ХОД С МЯЧОМ =====
async function aiSmartWithBall(f){
  const lvl = aiLevel();
  const info = aiAnalyze(f);
  const h = hoops[0];

  // 1v1 — вывод за дугу
  if(gameMode === '1v1' && window.clearPending && window.clearPending[f.t]){
    if(f.o >= 2 && !aiIsOut3(f)){
      const opts = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
      let best = null, bd = -1;
      opts.forEach(function(p){
        const dh = dist(p[0], p[1], h.c, h.r);
        if(dh >= 4 && dh > bd){ bd = dh; best = p; }
      });
      if(best){
        f.c = best[0]; f.r = best[1]; f.o -= 2;
        f.px = undefined; f.py = undefined; f.mv = true;
        ui(); draw();
        await sleep(320);
        return 'move';
      }
    }
  }

  // Оценка броска
  let tgt = (info.d <= 1) ? 5 : (info.d <= 3) ? 7 : 9;
  let pen = info.pressure ? 2 : 0;
  let bonus = 0;
  if(f.ab.some(function(a){ return a.n === 'Снайпер'; }) && !f.mv) bonus += 2;
  if(f.ab.some(function(a){ return a.n === 'Дальнобой'; }) && info.d >= 4) bonus += 1;
  if(f.shootBonus) bonus += f.shootBonus;
  if(f.bl > 0) bonus -= 2;
  const need = (tgt + pen) - (f.b + bonus + 3.5);
  const ch = need <= -3 ? 0.95 : need <= -1 ? 0.85 : need <= 1 ? 0.68 : need <= 3 ? 0.48 : need <= 5 ? 0.28 : 0.1;

  // 1. Отличный бросок
  if(ch >= 0.75 && !info.doubleTeam && f.o >= 2 && info.d <= 5){
    if(info.d <= 1 && f.s >= 4){ doDunk(); return 'shot'; }
    if(info.d <= 3){ doShoot(); return 'shot'; }
    if(info.d <= 5 && ch >= 0.65){ doShoot(); return 'shot'; }
  }

  // 2. Способности-проход
  if(info.pressure && await aiSmartAbility(f, 'attack', lvl)) return 'move';

  // 3. Дриблинг
  if(info.pressure && !info.doubleTeam && await aiSmartDribble(f, lvl)) return 'move';

  // 4. Заслон для союзника
  if(info.pressure && chance(lvl.smart * 0.4)){
    const ally = aiNearbyAllies(f, 2).find(function(a){ return hoopDist(a.c, a.r) < info.d; });
    if(ally){
      const spot = aiFindScreenSpot(f, ally);
      if(spot && await aiDoScreen(f, spot, ally)) return 'move';
    }
  }

  // 5. Пас в проход
  if(await aiPassInMotion(f, lvl)) return 'move';

  // 6. Средний бросок
  if(ch >= 0.55 && !info.doubleTeam && f.o >= 2 && info.d <= 5){
    doShoot(); return 'shot';
  }

 // 7. Отчаянный бросок
  if(info.desperation && f.o >= 2 && info.d <= 6){
    doShoot(); return 'shot';
  }

  // 8. Ведёт — тянет время
  if(info.leading && f.o >= 1 && !info.pressure){
    f.o -= 1;
    logMsg('🤖 ' + f.n + ': держит мяч');
    ui(); draw();
    await sleep(250);
    return 'move';
  }

  // 9. Движение к кольцу
  if(f.o >= 1 && await aiMoveTo(f, h.c, h.r, 1)) return 'move';
  return null;
}

// ===== УМНАЯ ЗАЩИТА =====
async function aiSmartDefend(f){
  const lvl = aiLevel();
  const bh = byId(ball);
  if(!bh || bh.t === f.t) return null;
  const d = dist(f.c, f.r, bh.c, bh.r);

  // Опека — если я назначен на конкретного игрока
  const mark = aiMyMark(f);
  if(mark && mark.c >= 0){
    const dMark = dist(f.c, f.r, mark.c, mark.r);
    if(dMark > 2 && d > 2 && f.o >= 1){
      if(await aiMoveTo(f, mark.c, mark.r, 1)) return 'move';
    }
  }

  // Способности
  if(d <= 1 && await aiSmartAbility(f, 'defense', lvl)) return 'move';

  // Отбор
  if(d <= 1 && f.o >= 1 && chance(lvl.defense * 0.85)){
    doSteal();
    await sleep(400);
    return 'steal';
  }

  // Давление
  if(f.o >= 1 && chance(0.4)){
    const ownH = hoops[1];
    if(dist(f.c, f.r, ownH.c, ownH.r) <= 3 && !presses.some(function(p){ return p.c === f.c && p.r === f.r; })){
      presses.push({c: f.c, r: f.r, team: f.t, owner: f.i});
      f.o -= 1;
      logMsg('🤖 ' + f.n + ': Давление');
      ui(); draw();
      await sleep(280);
      return 'move';
    }
  }

  // Позиционная защита — между мячом и кольцом
  if(f.o >= 1){
    const oH = hoops[1];
    const opts = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
    let best = null, bs = -1e9;
    opts.forEach(function(p){
      const dm = dist(p[0], p[1], bh.c, bh.r);
      const dh = dist(p[0], p[1], oH.c, oH.r);
      const btw = dm + dh - dist(bh.c, bh.r, oH.c, oH.r);
      const press = presses.some(function(pr){ return pr.c === p[0] && pr.r === p[1] && pr.team !== f.t; });
      const score = -dm * 2.8 - dh * 0.4 - btw * 0.6 - (press ? 5 : 0);
      if(score > bs){ bs = score; best = p; }
    });
    if(best){
      f.c = best[0]; f.r = best[1]; f.o -= 1;
      f.px = undefined; f.py = undefined;
      ui(); draw();
      await sleep(240);
      return 'move';
    }
  }
  return null;
}

// ===== БЕЗ МЯЧА — АТАКА =====
async function aiSmartOffBall(f){
  const bh = byId(ball);
  if(!bh) return null;

  if(bh.t === f.t){
    // Заслон для того, у кого мяч
    const carrier = byId(ball);
    if(carrier && carrier.i !== f.i && chance(0.35)){
      const spot = aiFindScreenSpot(f, carrier);
      if(spot && f.o >= 1 && await aiDoScreen(f, spot, carrier)) return 'move';
    }
    // Открыться
    if(f.o >= 1){
      const opts = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
      let best = null, bs = -1e9;
      opts.forEach(function(p){
        const dh = hoopDist(p[0], p[1]);
        let pressure = 0;
        fig.forEach(function(g){
          if(g.t !== f.t && g.c >= 0 && dist(g.c, g.r, p[0], p[1]) <= 1) pressure += 2;
        });
        const score = -dh * 1.8 - pressure * 3;
        if(score > bs){ bs = score; best = p; }
      });
      if(best){
        f.c = best[0]; f.r = best[1]; f.o -= 1;
        f.px = undefined; f.py = undefined;
        ui(); draw();
        await sleep(260);
        return 'move';
      }
    }
    return null;
  }
  return aiSmartDefend(f);
}

// ===== ПЕРЕЗАПИСЬ aiStep =====
aiStep = async function(f){
  // Обновляем опеку раз в ход
  if(!window.__marksSet){
    aiAssignMarks();
    window.__marksSet = true;
  }
  if(ball === f.i) return aiSmartWithBall(f);
  const bh = byId(ball);
  if(bh && bh.t !== f.t) return aiSmartDefend(f);
  return aiSmartOffBall(f);
};

// Перехват render — рисуем разметку ПОСЛЕ поля, но ДО фигур
const _origRender10a = render;
render = function(){
  _origRender10a();

  // === РАЗМЕТКА ПОВЕРХ ПОЛЯ ===
  hoops.forEach(function(h, idx){
    const hp = cen(h.c, h.r);
    const down = idx === 0; // hoops[0] — верхнее или нижнее в зависимости от ориентации

    // === ШТРАФНАЯ ЗОНА (краска) ===
    const paintR = 2.3 * W;
    x.beginPath();
    if(down){
      x.arc(hp.x, hp.y, paintR, 0, Math.PI);
    } else {
      x.arc(hp.x, hp.y, paintR, Math.PI, Math.PI * 2);
    }
    x.fillStyle = 'rgba(245,158,11,0.10)';
    x.fill();
    x.strokeStyle = idx === 0 ? 'rgba(248,113,113,0.5)' : 'rgba(74,222,128,0.5)';
    x.lineWidth = 2;
    x.stroke();

    // === ТРЁХОЧКОВАЯ ДУГА ===
    const threeR = 4.2 * W;
    x.beginPath();
    if(down){
      x.arc(hp.x, hp.y, threeR, Math.PI * 0.15, Math.PI * 0.85);
    } else {
      x.arc(hp.x, hp.y, threeR, Math.PI * 1.15, Math.PI * 1.85);
    }
    x.strokeStyle = 'rgba(255,255,255,0.3)';
    x.lineWidth = 2.5;
    x.setLineDash([6, 6]);
    x.stroke();
    x.setLineDash([]);

    // === НАДПИСЬ "3PT" ===
    const labelX = hp.x + threeR * 0.75;
    const labelY = hp.y + (down ? -10 : 10);
    x.font = 'bold 10px sans-serif';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillStyle = 'rgba(255,255,255,0.35)';
    x.fillText('3PT', labelX, labelY);
    x.fillText('3PT', hp.x - threeR * 0.75, labelY);

    // === ЩИТ (backboard) ===
    const bw = S * 1.6, bh = 4;
    const by = down ? hp.y - S * 0.95 : hp.y + S * 0.95 - bh;
    x.fillStyle = 'rgba(240,240,255,0.9)';
    x.fillRect(hp.x - bw/2, by, bw, bh);
    x.strokeStyle = 'rgba(0,0,0,0.5)';
    x.lineWidth = 1;
    x.strokeRect(hp.x - bw/2, by, bw, bh);

    // === ПАУТИНКА ПОД КОЛЬЦОМ ===
    const netR = 8;
    for(let i = 0; i < 6; i++){
      const a1 = (i / 6) * Math.PI * 2;
      const a2 = ((i + 1) / 6) * Math.PI * 2;
      x.beginPath();
      x.moveTo(hp.x + Math.cos(a1) * netR, hp.y + Math.sin(a1) * netR);
      x.lineTo(hp.x, hp.y + netR * 1.6);
      x.lineTo(hp.x + Math.cos(a2) * netR, hp.y + Math.sin(a2) * netR);
      x.strokeStyle = 'rgba(255,255,255,0.25)';
      x.lineWidth = 1;
      x.stroke();
    }
  });

  // === ЦЕНТРАЛЬНЫЙ КРУГ ===
  const centerR = W * 1.2;
  const cc = cen(4, 5.5);
  x.beginPath();
  x.arc(cc.x, cc.y + S, centerR, 0, 6.3);
  x.strokeStyle = 'rgba(255,255,255,0.18)';
  x.lineWidth = 2;
  x.setLineDash([4, 6]);
  x.stroke();
  x.setLineDash([]);
  x.font = 'bold 11px sans-serif';
  x.fillStyle = 'rgba(255,255,255,0.12)';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillText('CENTER', cc.x, cc.y + S);
};

logMsg('✅ Часть 10a загружена (разметка)');
// ============================================================
// ЧАСТЬ 10b: Фикс 1v1 + усиление ИИ
// ============================================================

// ===== ПРАВИЛО "CLEAR" (выход за дугу в 1v1) =====
window.clearPending = { 0: false, 1: false };

function aiIsOut3(f){
  const h = hoops[0];
  return dist(f.c, f.r, h.c, h.r) >= 4;
}

// Проверка авто-выхода за дугу каждый тик
setInterval(function(){
  if(over) return;
  if(gameMode !== '1v1') return;
  const bh = byId(ball);
  if(!bh) return;
  if(window.clearPending[bh.t] && aiIsOut3(bh)){
    window.clearPending[bh.t] = false;
    logMsg('✓ За дугой — атакуй!');
    if(typeof ui === 'function') ui();
    if(typeof draw === 'function') draw();
  }
}, 300);

// ===== ФИКС resetPositions ДЛЯ 1v1 =====
const _origReset10b = resetPositions;
resetPositions = function(scoringTeam){
  if(gameMode !== '1v1'){
    return _origReset10b(scoringTeam);
  }

  // === 1v1 ===
  const h = hoops[0]; // оба кольца совпадают

  const scorer = fig.find(function(f){ return f.t === scoringTeam && f.c >= 0; });
  const opponent = fig.find(function(f){ return f.t === (1 - scoringTeam) && f.c >= 0; });

  // Забивший — рядом с кольцом (защищает)
  if(scorer){
    scorer.c = 4;
    scorer.r = 10;
    scorer.a = false; scorer.o = scorer.mo;
    scorer.fr = 0; scorer.bl = 0; scorer.mv = false;
    scorer.px = undefined; scorer.py = undefined;
    scorer.shootBonus = 0;
    if(scorer.dribbleCd){
      ['cross','spin','ankle','euro','hesi','between','stepback'].forEach(function(k){ scorer.dribbleCd[k] = 0; });
    }
  }

  // Соперник — на линии трёшки с мячом
  if(opponent){
    opponent.c = 4;
    opponent.r = 7; // 4 гекса от кольца = 3-очковая
    opponent.a = false; opponent.o = opponent.mo;
    opponent.fr = 0; opponent.bl = 0; opponent.mv = false;
    opponent.px = undefined; opponent.py = undefined;
    opponent.shootBonus = 0;
    if(opponent.dribbleCd){
      ['cross','spin','ankle','euro','hesi','between','stepback'].forEach(function(k){ opponent.dribbleCd[k] = 0; });
    }
    ball = opponent.i;
  }

  // Соперник уже за дугой — clear не нужен
  window.clearPending[0] = false;
  window.clearPending[1] = false;

  webs = []; presses = []; holds = {};
  turn = 1 - scoringTeam;
  sel = null; hl = []; mode = 'sel'; pab = null;

  logMsg('🔄 Сброс 1v1. Мяч у ' + (opponent ? opponent.n : '???'));
  ui(); draw();

  if(typeof aiEnabled !== 'undefined' && aiEnabled && turn === 1 && !over){
    if(typeof playAllAI === 'function') setTimeout(playAllAI, 800);
  }
};

// ===== ПРОВЕРКА CLEAR ПРИ БРОСКЕ =====
const _origShoot10b = doShoot;
doShoot = function(){
  const f = byId(sel);
  if(!f) return _origShoot10b();
  if(gameMode === '1v1' && window.clearPending[f.t] && !aiIsOut3(f)){
    logMsg('⚠ Выйди за дугу!');
    if(typeof popText === 'function') popText('⚠ ЗА ДУГУ', cen(f.c, f.r).x, cen(f.c, f.r).y - 40, '#fbbf24', 16);
    return;
  }
  return _origShoot10b();
};

const _origDunk10b = doDunk;
doDunk = function(){
  const f = byId(sel);
  if(!f) return _origDunk10b();
  if(gameMode === '1v1' && window.clearPending[f.t] && !aiIsOut3(f)){
    logMsg('⚠ Выйди за дугу!');
    return;
  }
  return _origDunk10b();
};

// ===== УСТАНОВКА ФЛАГА CLEAR =====
// После отбора
const _origSteal10b = doSteal;
doSteal = function(){
  const before = ball;
  const r = _origSteal10b();
  if(gameMode === '1v1' && ball !== before){
    const bh = byId(ball);
    if(bh && !aiIsOut3(bh)){
      window.clearPending[bh.t] = true;
    }
  }
  return r;
};

// После подбора
const _origReb10b = rebound;
rebound = function(team){
  _origReb10b(team);
  if(gameMode === '1v1'){
    const bh = byId(ball);
    if(bh && !aiIsOut3(bh)){
      window.clearPending[bh.t] = true;
    }
  }
};

// ===== УСИЛЕНИЕ ИИ В 1v1 =====
const _origAiStep10b = aiStep;
aiStep = async function(f){
  // 1v1: если мяч у ИИ и нужен clear
  if(gameMode === '1v1' && ball === f.i && window.clearPending[f.t] && !aiIsOut3(f)){
    if(f.o >= 1){
      const h = hoops[0];
      const opts = nb(f.c, f.r).filter(function(p){ return !figAt(p[0], p[1]); });
      if(opts.length){
        let best = null, bd = -1;
        opts.forEach(function(p){
          const dh = dist(p[0], p[1], h.c, h.r);
          if(dh > bd){ bd = dh; best = p; }
        });
        if(best){
          f.c = best[0]; f.r = best[1]; f.o -= 1;
          f.px = undefined; f.py = undefined; f.mv = true;
          logMsg('🤖 ' + f.n + ': выход за дугу');
          ui(); draw();
          await sleep(300);
          return 'move';
        }
      }
    }
    return null;
  }
  return _origAiStep10b(f);
};

// ===== ПИК-Н-РОЛЛ (союзник ставит скрин) =====
async function aiPickAndRoll(f, lvl){
  if(!chance(lvl.smart * 0.4)) return false;
  if(f.o < 1) return false;
  const en = enemiesAround(f, 2)[0];
  if(!en) return false;
  const ally = fig.find(function(a){
    return a.t === f.t && a.i !== f.i && a.c >= 0
      && dist(f.c, f.r, a.c, a.r) <= 2
      && dist(en.c, en.r, a.c, a.r) <= 2;
  });
  if(!ally) return false;
  en.o = Math.max(0, en.o - 1);
  f.o -= 1;
  logMsg('🤖 Пик-н-ролл: ' + ally.n + ' → скрин на ' + en.n);
  if(typeof popText === 'function'){
    const p = cen(ally.c, ally.r);
    popText('🛡', p.x, p.y - 30, '#06b6d4', 20);
  }
  ui(); draw();
  await sleep(400);
  return true;
}

// ===== ХУК В aiSmartWithBall — добавить пик-н-ролл =====
const _origSmartBall10b = aiSmartWithBall;
aiSmartWithBall = async function(f){
  const lvl = aiLevel();
  const info = aiAnalyze(f);

  // Пик-н-ролл если под давлением
  if(info.pressure && !info.doubleTeam){
    if(await aiPickAndRoll(f, lvl)) return 'move';
  }
  return _origSmartBall10b(f);
};

// ===== ПРОВЕРКА CLEAR ПРИ НАЧАЛЕ ИГРЫ (1v1) =====
const _origInit10b = initGame;
initGame = function(a, b){
  _origInit10b(a, b);
  if(gameMode === '1v1'){
    window.clearPending[0] = false;
    window.clearPending[1] = false;
    // Мяч у первого — у него позиция рядом с кольцом, значит нужен clear
    const bh = byId(ball);
    if(bh && !aiIsOut3(bh)){
      window.clearPending[bh.t] = true;
      logMsg('⚠ Выйди за дугу перед броском');
    }
  }
};

// ===== ВИЗУАЛЬНАЯ ПОДСКАЗКА CLEAR =====
const _origRender10b = render;
render = function(){
  _origRender10b();
  if(gameMode !== '1v1' || over) return;
  const bh = byId(ball);
  if(!bh || !window.clearPending[bh.t]) return;
  const h = hoops[0];
  const hp = cen(h.c, h.r);
  const threeR = 4.2 * W;
  x.beginPath();
  x.arc(hp.x, hp.y, threeR, Math.PI, Math.PI * 2);
  x.strokeStyle = 'rgba(251,191,36,0.95)';
  x.lineWidth = 4;
  x.setLineDash([8, 6]);
  x.stroke();
  x.setLineDash([]);
  x.fillStyle = 'rgba(251,191,36,0.95)';
  x.font = 'bold 14px sans-serif';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillText('ВЫВЕДИ ЗА ДУГУ', window.__CW / 2, window.__CH - 26);
};

logMsg('✅ Часть 10b загружена (фикс 1v1 + ИИ)');
// ============================================================
// ЧАСТЬ 11: Давление (фикс) + Опека (новая механика)
// ============================================================

// ===== ХРАНИЛИЩЕ ОПЕКИ =====
window.oppMarks = {}; // { опекаемый.id : опекун.id }

// ===== ДАВЛЕНИЕ — списание +1 ОД при входе =====
// Перехватываем движение в handleClick
const _origHandleClick11 = handleClick;
handleClick = async function(col, row){
  // Проверка — если движение на гекс с давлением соперника
  if(mode === 'sel' && sel !== null){
    const f = byId(sel);
    if(f && hl.some(function(h){ return h.c === col && h.r === row; })){
      const press = presses.find(function(p){
        return p.c === col && p.r === row && p.team !== f.t;
      });
      if(press){
        const baseCost = (ball === f.i) ? 2 : 1;
        const cost = baseCost + 1;
        if(f.o < cost){
          logMsg('⚠ Не хватает ОД (давление +1)');
          return;
        }
        f.c = col; f.r = row;
        f.o -= cost;
        f.mv = true;
        // Эффект вспышки
        const p = cen(col, row);
        if(typeof popText === 'function') popText('⚡ -1 ОД', p.x, p.y - 30, '#fbbf24', 14);
        if(typeof burst === 'function') burst(p.x, p.y, '#fbbf24', 8, 2);
        logMsg('🛡 ' + f.n + ' вошёл в давление (-1 ОД)');
        if(f.o <= 0) end();
        else { reHL(); ui(); draw(); }
        return;
      }
    }
  }
  return _origHandleClick11(col, row);
};

// ===== ОПЕКА: старт =====
function startOppMark(){
  const f = byId(sel);
  if(!f || f.o < 1) return;
  mode = 'mark';
  hl = [];
  // Подсвечиваем врагов в радиусе 1
  fig.forEach(function(g){
    if(g.t !== f.t && g.c >= 0 && dist(f.c, f.r, g.c, g.r) <= 1){
      hl.push({c: g.c, r: g.r, m: 'enemy', id: g.i});
    }
  });
  if(!hl.length){
    logMsg('Нет врагов рядом');
    mode = 'sel';
    return;
  }
  ui(); draw();
}

// ===== ОПЕКА: подтверждение =====
function doOppMark(targetId){
  const f = byId(sel);
  const t = byId(targetId);
  if(!f || !t) return;
  if(f.o < 1) return;

  f.o -= 1;
  window.oppMarks[targetId] = f.i;

  logMsg('🎯 ' + f.n + ' опекает ' + t.n);
  if(typeof popText === 'function'){
    const p = cen(t.c, t.r);
    popText('🎯 ОПЕКА', p.x, p.y - 34, '#dc2626', 14);
  }
  mode = 'sel'; hl = [];
  if(f.o <= 0) end(); else { reHL(); ui(); draw(); }
}

// ===== ОПЕКА: очистка при отходе =====
setInterval(function(){
  Object.keys(window.oppMarks).forEach(function(tid){
    const t = byId(parseInt(tid));
    const o = byId(window.oppMarks[tid]);
    if(!t || !o || t.c < 0 || o.c < 0 || dist(t.c, t.r, o.c, o.r) > 2){
      delete window.oppMarks[tid];
    }
  });
}, 500);

// ===== ПРОВЕРКА: опекают ли фигуру =====
function isMarked(f){
  return window.oppMarks[f.i] !== undefined;
}

// ===== ВЛИЯНИЕ ОПЕКИ НА БРОСОК =====
const _origShoot11 = doShoot;
doShoot = function(){
  const f = byId(sel);
  if(f && isMarked(f)){
    logMsg('🎯 Опека: -1 к броску');
    f.b -= 1;
    try { return _origShoot11(); }
    finally { setTimeout(function(){ f.b += 1; }, 200); }
  }
  return _origShoot11();
};

// ===== ВЛИЯНИЕ ОПЕКИ НА ОТБОР (защиту) =====
const _origSteal11 = doSteal;
doSteal = function(){
  const f = byId(sel);
  if(f && isMarked(f)){
    logMsg('🎯 Опека: -1 к отбору');
    f.z -= 1;
    try { return _origSteal11(); }
    finally { setTimeout(function(){ f.z += 1; }, 200); }
  }
  return _origSteal11();
};

// ===== UI: кнопка Опека + подсветка в меню =====
const _origUI11 = ui;
ui = function(){
  _origUI11();
  if(over || sel === null) return;
  const f = byId(sel);
  if(!f || f.t !== turn || f.a) return;

  // === ОБРАБОТКА РЕЖИМА MARK ===
  if(mode === 'mark'){
    const act = document.getElementById('act');
    act.innerHTML = '';
    const title = document.createElement('div');
    title.textContent = '🎯 Выбери кого опекать';
    title.style.cssText = 'color:#dc2626;font-weight:bold;font-size:13px;width:100%;margin-bottom:4px';
    act.appendChild(title);
    const cb = document.createElement('button');
    cb.textContent = '← Отмена';
    cb.className = 'cancel';
    cb.onclick = function(){ mode = 'sel'; hl = []; reHL(); ui(); draw(); };
    act.appendChild(cb);
    addEndTurnButton(act);
    return;
  }

  if(mode !== 'sel') return;

  // === КНОПКА ОПЕКИ (для фигуры без мяча рядом с врагом) ===
  if(ball !== f.i && f.o >= 1){
    const enemiesAdj = fig.filter(function(g){
      return g.t !== f.t && g.c >= 0 && dist(g.c, g.r, f.c, f.r) <= 1;
    });
    if(enemiesAdj.length){
      const act = document.getElementById('act');
      const hasBtn = Array.from(act.querySelectorAll('button')).some(function(b){
        return b.textContent.indexOf('Опека') >= 0;
      });
      if(!hasBtn){
        const b = document.createElement('button');
        b.textContent = '🎯 Опека (1)';
        b.style.background = '#dc2626';
        b.style.fontWeight = 'bold';
        b.onclick = startOppMark;
        // Вставим перед "Завершить"
        const endBtn = Array.from(act.querySelectorAll('button')).find(function(x){
          return x.textContent.indexOf('Завершить') >= 0;
        });
        if(endBtn) act.insertBefore(b, endBtn);
        else act.appendChild(b);
      }
    }
  }

  // === ИНФО-ПАНЕЛЬ: показать опеку ===
  const info = document.getElementById('figInfo');
  if(info && info.style.display !== 'none'){
    if(isMarked(f)){
      const o = byId(window.oppMarks[f.i]);
      info.innerHTML += '<br><span style="color:#dc2626">🎯 Опекает: ' + (o ? o.n : '?') + '</span>';
    }
    // Мой опекун?
    const myTarget = window.oppMarks[f.i];
    if(myTarget === undefined){
      Object.keys(window.oppMarks).forEach(function(tid){
        if(window.oppMarks[tid] === f.i){
          const t = byId(parseInt(tid));
          if(t) info.innerHTML += '<br><span style="color:#dc2626">🎯 Я опекаю: ' + t.n + '</span>';
        }
      });
    }
  }
};

// ===== ОБРАБОТКА КЛИКА В РЕЖИМЕ MARK =====
const _origHandleModeClick11 = handleModeClick;
handleModeClick = function(col, row){
  if(mode === 'mark'){
    const t = hl.find(function(h){ return h.c === col && h.r === row; });
    if(t && t.id !== undefined) doOppMark(t.id);
    else { mode = 'sel'; hl = []; reHL(); ui(); draw(); }
    return;
  }
  return _origHandleModeClick11(col, row);
};

// ===== ВИЗУАЛИЗАЦИЯ: давление + опека =====
const _origRender11 = render;
render = function(){
  _origRender11();

  // === ДАВЛЕНИЕ: усиленная отрисовка ===
  presses.forEach(function(pr){
    const c = cen(pr.c, pr.r);
    // Пунктирная зона
    x.beginPath();
    x.arc(c.x, c.y, S * 0.72, 0, 6.3);
    x.strokeStyle = pr.team ? 'rgba(220,38,38,0.8)' : 'rgba(22,163,74,0.8)';
    x.lineWidth = 3;
    x.setLineDash([5, 4]);
    x.stroke();
    x.setLineDash([]);
    // Иконка давления в центре
    x.font = Math.round(S * 0.65) + 'px sans-serif';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.globalAlpha = 0.7;
    x.fillStyle = pr.team ? '#fca5a5' : '#86efac';
    x.fillText('⚡', c.x, c.y);
    x.globalAlpha = 1;
  });

  // === ОПЕКА: линии между опекуном и целью ===
  Object.keys(window.oppMarks).forEach(function(tid){
    const t = byId(parseInt(tid));
    const o = byId(window.oppMarks[tid]);
    if(!t || !o || t.c < 0 || o.c < 0) return;
    const tp = cen(t.c, t.r);
    const op = cen(o.c, o.r);
    // Пунктирная красная линия
    x.beginPath();
    x.moveTo(op.x, op.y);
    x.lineTo(tp.x, tp.y);
    x.strokeStyle = 'rgba(220,38,38,0.7)';
    x.lineWidth = 2;
    x.setLineDash([4, 4]);
    x.stroke();
    x.setLineDash([]);
    // Иконка опеки над целью
    x.font = Math.round(S * 0.7) + 'px sans-serif';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText('🎯', tp.x, tp.y - S * 0.85);
    // Иконка опекуна
    x.font = Math.round(S * 0.6) + 'px sans-serif';
    x.fillText('🎯', op.x, op.y - S * 0.85);
  });

  // === CLEAR-PENDING (1v1) — жёлтая дуга ===
  if(gameMode === '1v1' && !over){
    const bh = byId(ball);
    if(bh && window.clearPending && window.clearPending[bh.t]){
      const h = hoops[0];
      const hp = cen(h.c, h.r);
      const threeR = 4.2 * W;
      x.beginPath();
      x.arc(hp.x, hp.y, threeR, Math.PI, Math.PI * 2);
      x.strokeStyle = 'rgba(251,191,36,0.9)';
      x.lineWidth = 4;
      x.setLineDash([8, 6]);
      x.stroke();
      x.setLineDash([]);
    }
  }
};

// ===== СБРОС ОПЕКИ В КОНЦЕ РАУНДА =====
const _origEnd11 = end;
end = function(){
  _origEnd11();
  // Если все активированы — новый раунд — очищаем опеку
  if(fig.every(function(g){ return !g.a; })){
    window.oppMarks = {};
    logMsg('🎯 Опека сброшена');
  }
};

// ===== СБРОС ПРИ ЗАВЕРШЕНИИ ИГРЫ =====
const _origReset11 = resetPositions;
resetPositions = function(t){
  _origReset11(t);
  window.oppMarks = {};
};

logMsg('✅ Часть 11 загружена (давление + опека)');
</script>
